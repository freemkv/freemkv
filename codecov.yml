coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

comment: false

ignore:
  - "**/tests"
  - "**/macos"
  - "**/windows"
  - "**/*.md"
  # info.rs is one `run()` of device + curl + fs I/O (55.9%, 387 misses); its
  # pure helpers are already covered, the remainder is unreachable without hardware.
  - "**/src/info.rs"
