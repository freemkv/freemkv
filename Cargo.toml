[package]
name = "freemkv"
version = "1.6.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Desktop UI for freemkv"

[lib]
name = "freemkv"
path = "src/lib.rs"

[[bin]]
name = "freemkv"
path = "src/main.rs"

# The double-clickable Windows image. `freemkv.exe` is console-subsystem and
# must stay the CLI byte-for-byte, and a PE subsystem is fixed at link time —
# so the windowed launch has to be a second binary, not a runtime branch.
#
# Cargo has no `[target.'cfg(windows)'.bin]`, so the platform gate lives inside
# the file: on macOS and Linux it is an empty `main` that links nothing. It is
# NOT behind `required-features`, deliberately — a feature that CI forgets to
# pass would silently ship the release zip without the app in it.
[[bin]]
name = "freemkv-gui"
path = "src/bin/freemkv-gui.rs"

[dependencies]
freemkv-engine = "1.6"
libfreemkv = "1.6"
freemkv-keysources = "1.6"
freemkv-i18n = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
isolang = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
mimalloc = "0.1"

# ── Windows desktop shell ───────────────────────────────────────────────────
# `winsafe` is idiomatic safe Win32 with ZERO dependencies — it owns the message
# loop, window classes and control lifetimes, and asks the OS to draw every
# control, which is what makes the app indistinguishable from a native Windows
# program. Chosen over `native-windows-gui` (unmaintained since 2022) and the
# raw `windows` bindings (far more unsafe boilerplate for a plain desktop app).
#
# PINNED with `=`: winsafe is pre-1.0 and moves on a quarterly cadence, so it
# reserves the right to break the API. Upgrade deliberately, never implicitly.
[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.28", features = ["gui", "shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication", "NSWindow", "NSView", "NSControl", "NSButton",
  "NSTextField", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSResponder",
  "NSProgressIndicator", "NSBox", "NSOutlineView", "NSTableView",
  "NSTableColumn", "NSScrollView", "NSOpenPanel", "NSSavePanel",
  "NSPanel", "NSGraphics", "NSCell", "NSTextFieldCell", "NSStackView",
  "NSLayoutConstraint", "NSFont", "NSColor", "NSImage", "NSRunningApplication",
  "NSTextView", "NSText", "NSButtonCell", "NSActionCell", "NSComboBox",
  "NSPasteboard", "NSDragging", "NSAlert", "NSApplication",
  "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "NSSplitView",
  "NSTabView", "NSTabViewItem", "NSStepper", "NSSlider", "NSWorkspace",
  "NSPasteboardItem", "NSFilePromiseReceiver", "NSSecureTextField",
] }
objc2-foundation = { version = "0.3", features = [
  "NSString", "NSGeometry", "NSArray", "NSObjCRuntime", "NSNotification",
  "NSDate", "NSTimer", "NSRunLoop", "NSURL", "NSValue", "NSDictionary",
  "NSEnumerator", "NSError", "NSRange", "NSAttributedString", "NSDictionary",
] }

# Resolve the freemkv crates from their GIT TAGS. They are OFF crates.io
# (libfreemkv git-deps the firmware crate, and keysources deps libfreemkv), so
# this [patch.crates-io] git-tag redirect is the ONLY resolution path — there is
# no crates.io publish for these crates at all.
#
# Committed (CI-visible) so the release workflow can resolve on a clean runner.
# It applies to the direct deps above AND the transitive references the other
# crates make, unifying every libfreemkv ref to one source (no duplicate crate,
# no trait-identity mismatch).
#
# The release script rewrites these tags before regenerating Cargo.lock. Local
# dev overrides this with a path patch in the gitignored .cargo/config.toml (a
# config-level [patch.crates-io] wins over this manifest one).
[patch.crates-io]
libfreemkv = { git = "https://github.com/freemkv/libfreemkv", tag = "v1.6.2" }
freemkv-engine = { git = "https://github.com/freemkv/freemkv-engine", tag = "v1.6.2" }
freemkv-keysources = { git = "https://github.com/freemkv/freemkv-keysources", tag = "v1.6.2" }
freemkv-i18n = { git = "https://github.com/freemkv/freemkv-i18n", tag = "v1.6.2" }
