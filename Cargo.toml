[package]
name = "freemkv"
version = "1.8.2"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "freemkv disc ripper: command-line tool, plus the desktop app with the gui feature and the rip server with the server feature"

[lib]
name = "freemkv"
path = "src/lib.rs"

[[bin]]
name = "freemkv"
path = "src/main.rs"

# The Windows app's windowed image. A PE subsystem is fixed at link time, so it
# is a second binary; CI renames it to `freemkv.exe` beside the console image
# renamed to `freemkv.com`. Empty on macOS and Linux.
[[bin]]
name = "freemkv-gui"
path = "src/bin/freemkv-gui.rs"
required-features = ["gui"]

# The server shell's integration tests, carried over from the daemon's own
# suite. They live in tests/server/ (not auto-discovered) so the CLI and app
# builds never try to compile them.
[[test]]
name = "server_end_to_end"
path = "tests/server/end_to_end.rs"
required-features = ["server"]

[[test]]
name = "server_halt_drain"
path = "tests/server/halt_drain.rs"
required-features = ["server"]

[[test]]
name = "server_join_all_drain"
path = "tests/server/join_all_drain.rs"
required-features = ["server"]

[[test]]
name = "server_resume_remux"
path = "tests/server/resume_remux.rs"
required-features = ["server"]

[[test]]
name = "server_spawn_registration"
path = "tests/server/spawn_registration.rs"
required-features = ["server"]

[[test]]
name = "server_watchdog"
path = "tests/server/watchdog.rs"
required-features = ["server"]

# The desktop app (`gui`) and the unattended rip server (`server`). Without
# either the build is the CLI, with no UI and no server dependencies.
[features]
default = []
# `freemkv server`: the rip daemon + web UI that runs in the container image.
# Only adds crates; `mimalloc/secure` hardens the allocator of a process that
# runs privileged and parses untrusted disc payloads unattended.
server = ["dep:tiny_http", "dep:once_cell", "tracing-subscriber/json", "mimalloc/secure"]
gui = ["dep:winsafe", "dep:windows", "dep:gtk4", "dep:libadwaita",
       "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation",
       "dep:objc2-user-notifications", "dep:block2"]

[dependencies]
freemkv-engine = "1.8"
libfreemkv = "1.8"
freemkv-keysources = "1.8"
freemkv-i18n = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
isolang = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }
libc = "0.2"
mimalloc = "0.1"

# ── Server shell (`--features server`) ─────────────────────────────────────
tiny_http = { version = "0.12", optional = true }
once_cell = { version = "1", optional = true }

# ── Windows desktop shell ───────────────────────────────────────────────────
# `winsafe` is idiomatic safe Win32 with ZERO dependencies — it owns the message
# loop, window classes and control lifetimes, and asks the OS to draw every
# control, which is what makes the app indistinguishable from a native Windows
# program. Chosen over `native-windows-gui` (unmaintained since 2022) and the
# raw `windows` bindings (far more unsafe boilerplate for a plain desktop app).
#
# PINNED with `=`: winsafe is pre-1.0 and moves on a quarterly cadence, so it
# reserves the right to break the API. Upgrade deliberately, never implicitly.
[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { optional = true, version = "=0.0.29", features = ["gui", "shell", "advapi"] }
# Rip-finished toast (WinRT `ToastNotificationManager`), which winsafe does not
# wrap. PINNED with `=`, same rationale as winsafe.
windows = { optional = true, version = "=0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation"] }

# ── Linux desktop shell (GTK4 + libadwaita) ────────────────────────────────
# GTK4 is what Flathub reviewers expect and what the GNOME desktop draws
# natively; libadwaita adds the modern GNOME widgets (AdwApplicationWindow,
# AdwHeaderBar hamburger menu, AdwToast) so the app looks like a first-class
# GNOME app.
#
# PINNED with `=`: same rationale as winsafe. GTK4 bindings ship every ~6
# months with API adjustments; libadwaita is pre-1.0 across upstream too.
#
# GATED on `target_env = "gnu"` — GTK4/libadwaita depend on the glibc GTK
# runtime and cannot link statically against musl. The Linux CLI binary
# ships as `x86_64-unknown-linux-musl` (single static file, no runtime
# deps), so its build must skip the shell. This condition also skips
# src/linux.rs / src/linux_app.rs — see the matching cfg in src/lib.rs
# and src/main.rs.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
gtk4 = { optional = true, version = "=0.9", features = ["v4_10"] }
libadwaita = { optional = true, version = "=0.7", features = ["v1_4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { optional = true, version = "0.3", features = [
  "NSApplication", "NSWindow", "NSView", "NSControl", "NSButton",
  "NSTextField", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSResponder",
  "NSProgressIndicator", "NSBox", "NSOutlineView", "NSTableView",
  "NSTableColumn", "NSScrollView", "NSOpenPanel", "NSSavePanel",
  "NSPanel", "NSGraphics", "NSCell", "NSTextFieldCell", "NSStackView",
  "NSLayoutConstraint", "NSFont", "NSColor", "NSImage", "NSRunningApplication",
  "NSTextView", "NSText", "NSButtonCell", "NSActionCell", "NSComboBox",
  "NSPasteboard", "NSDragging", "NSAlert", "NSApplication",
  "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "NSSplitView",
  "NSTabView", "NSTabViewItem", "NSStepper", "NSSlider", "NSWorkspace",
  "NSPasteboardItem", "NSFilePromiseReceiver", "NSSecureTextField", "NSParagraphStyle",
] }
objc2-foundation = { optional = true, version = "0.3", features = [
  "NSString", "NSGeometry", "NSArray", "NSObjCRuntime", "NSNotification",
  "NSDate", "NSTimer", "NSRunLoop", "NSURL", "NSValue", "NSDictionary",
  "NSEnumerator", "NSError", "NSRange", "NSAttributedString", "NSDictionary",
  "NSBundle",
] }
# Rip-finished notification. PINNED with `=`, same rationale as winsafe.
objc2-user-notifications = { optional = true, version = "=0.3", default-features = false, features = [
  "std", "block2", "bitflags", "UNNotification", "UNNotificationContent",
  "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound",
  "UNNotificationTrigger", "UNUserNotificationCenter",
] }
block2 = { version = "=0.6", optional = true }

[dev-dependencies]
# `test_util` fixtures (`aacs_state`, …) for this crate's tests (keys-upfront
# KU-P1). CI resolves it through the sibling path patch.
libfreemkv = { version = "1.8", features = ["test-util"] }
# The server's reachability tests plant a decode verdict offline.
freemkv-keysources = { version = "1.8", features = ["test-hooks"] }
tempfile = "3"

# Resolve the freemkv crates from their GIT TAGS. They are OFF crates.io
# (libfreemkv git-deps the firmware crate, and keysources deps libfreemkv), so
# this [patch.crates-io] git-tag redirect is the ONLY resolution path — there is
# no crates.io publish for these crates at all.
#
# Committed (CI-visible) so the release workflow can resolve on a clean runner.
# It applies to the direct deps above AND the transitive references the other
# crates make, unifying every libfreemkv ref to one source (no duplicate crate,
# no trait-identity mismatch).
#
# The release script rewrites these tags before regenerating Cargo.lock. Local
# dev overrides this with a path patch in the gitignored .cargo/config.toml (a
# config-level [patch.crates-io] wins over this manifest one).
[patch.crates-io]
libfreemkv = { git = "https://github.com/freemkv/libfreemkv", tag = "v1.8.2" }
freemkv-engine = { git = "https://github.com/freemkv/freemkv-engine", tag = "v1.8.2" }
freemkv-keysources = { git = "https://github.com/freemkv/freemkv-keysources", tag = "v1.8.2" }
freemkv-unlock = { git = "https://github.com/freemkv/freemkv-unlock", tag = "v1.8.2" }
freemkv-i18n = { git = "https://github.com/freemkv/freemkv-i18n", tag = "v1.8.2" }
