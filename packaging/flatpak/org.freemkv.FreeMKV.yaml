# Flatpak manifest for the Flathub submission.
#
# WHY the runtime is `org.gnome.Platform//47`: it is the current stable GNOME
# runtime as of 2026-09 and carries GTK4 + libadwaita at the versions the
# `gtk4-rs` / `libadwaita-rs` crates need. Bumping the runtime is a
# deliberate action — every runtime version pins a Cairo/GLib/GDK-Pixbuf/
# libadwaita triple, and the Rust crates track those closely.
#
# WHY `--device=all`: freemkv reads from the optical drive via SG_IO ioctls
# (`/dev/sr0`, `/dev/sg1`). The Portal API cannot expose a raw SCSI device;
# `--device=all` is the accepted Flathub answer for optical-media tools
# (same finish-arg MakeMKV's manifest uses). Reviewers accept it because
# there is no less-privileged alternative for AACS key derivation and
# multi-pass sector reads.
#
# WHY `--filesystem=xdg-videos --filesystem=xdg-download`: default rip
# destinations. A user who moved `$XDG_VIDEOS_DIR` gets the new location
# via the Documents portal + explicit filesystem grant.

app-id: org.freemkv.FreeMKV
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: freemkv

finish-args:
  # Wayland is the primary target; X11 fallback so the app still runs on
  # X sessions without the user having to change anything.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Optical drives (see WHY above).
  - --device=all

  # Rip output destinations. Everything else the user picks goes through
  # the GtkFileDialog + portals, so no blanket home-directory grant.
  - --filesystem=xdg-videos
  - --filesystem=xdg-download

  # Keydb fetch and update-check need outbound HTTPS to the endpoints the
  # user configured in Settings. No inbound network is opened.
  - --share=network

  # Desktop notifications for rip-finished (the `Effect::NotifyRipFinished`
  # code path in `linux.rs`). No extra permission is needed — the portal
  # is the default access method under Flatpak.
  - --talk-name=org.freedesktop.portal.Desktop

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/freemkv/cargo

modules:
  - name: freemkv
    buildsystem: simple
    build-commands:
      # `--offline` + a `cargo-sources.json` (generated by
      # `flatpak-cargo-generator.py` in CI) would let this build without
      # network. The current form assumes the sandbox has `--share=network`
      # during build; Flathub's builder does. `sources.yaml` overrides
      # this if the submission repo pins vendored deps.
      - cargo build --release
      - install -Dm755 target/release/freemkv /app/bin/freemkv
      # `.desktop`, AppStream metainfo, and the app icon.
      - install -Dm644 packaging/flatpak/org.freemkv.FreeMKV.desktop
          /app/share/applications/org.freemkv.FreeMKV.desktop
      - install -Dm644 packaging/flatpak/org.freemkv.FreeMKV.metainfo.xml
          /app/share/metainfo/org.freemkv.FreeMKV.metainfo.xml
      - install -Dm644 res/freemkv-icon.svg
          /app/share/icons/hicolor/scalable/apps/org.freemkv.FreeMKV.svg
    sources:
      - type: dir
        # The whole freemkv source tree, expected to be checked out into
        # the sandbox at build time. On Flathub this is done by the
        # submission repo's own `sources.yaml`; on the local
        # `flatpak-builder` invocation `--repo=.` picks it up.
        path: ../..
