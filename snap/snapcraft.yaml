name: freemkv
# Version and grade come from Cargo.toml plus the suffix CI writes to
# snap/local/version-suffix (empty on a release tag). See override-pull.
adopt-info: freemkv
base: core24
confinement: strict
license: MIT
icon: res/freemkv-icon.svg

platforms:
  amd64:
  # Built only by `snapcraft remote-build` (Launchpad); see packaging/snap/README.md.
  arm64:

# Drive access, verified against snapd interfaces/builtin/optical_drive.go:
# the plain `optical-drive` plug grants read on /dev/sr*, /dev/scd*, /dev/sg*
# and auto-connects; `write: true` adds write on the same nodes. libfreemkv
# opens the drive O_RDWR for SG_IO, so even reading a disc needs
# `optical-write`. The base declaration has deny-connection AND
# deny-auto-connection for `write: true`: a store install cannot connect it,
# even by hand, until the store grants allow-connection (and auto-connection)
# for this snap; a `--dangerous` install skips that policy, so `snap connect`
# works there. The default seccomp template does not filter ioctl by request.
plugs:
  optical-write:
    interface: optical-drive
    write: true

# GtkApplication owns its application id on the session bus; confinement
# denies that unless the snap declares the name as a dbus slot.
slots:
  freemkv-dbus:
    interface: dbus
    bus: session
    name: org.freemkv.FreeMKV

apps:
  freemkv:
    # App build: a bare launch opens the window when a display is present,
    # any arguments run the CLI (src/app_entry.rs wants_gui).
    command: bin/freemkv
    common-id: org.freemkv.FreeMKV
    desktop: usr/share/applications/org.freemkv.FreeMKV.desktop
    extensions: [gnome]
    slots: [freemkv-dbus]
    plugs:
      - optical-drive
      - optical-write
      - hardware-observe
      - home
      - removable-media
      - network
  freemkv-cli:
    # Same binary with the display variables cleared, so a bare launch
    # prints usage like the CLI build. Still needs the GNOME runtime
    # because the binary links GTK4.
    command: bin/freemkv-cli
    extensions: [gnome]
    plugs:
      - optical-drive
      - optical-write
      - hardware-observe
      - home
      - removable-media
      - network

parts:
  freemkv:
    # `nil`, not `rust`: under the gnome extension the rust plugin cannot find
    # its rustup build-snap, so the pinned toolchain is installed directly.
    plugin: nil
    source: .
    build-packages: [build-essential, curl, git, pkg-config]
    build-environment:
      # Must match rust-version in Cargo.toml; tests/snap_packaging.rs checks.
      - RUST_TOOLCHAIN: "1.98.1"
    override-pull: |
      craftctl default
      base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
      suffix_file="$CRAFT_PROJECT_DIR/snap/local/version-suffix"
      if [ -f "$suffix_file" ]; then suffix=$(tr -d '[:space:]' < "$suffix_file"); else suffix="+dev"; fi
      version="$base$suffix"
      craftctl set version="$version"
      case "$version" in
        *-*|*+*) craftctl set grade=devel ;;
        *) craftctl set grade=stable ;;
      esac
    # `--locked` only without the sibling-checkout patches CI writes to
    # .cargo/config.toml on dev and qa, which the committed lock does not match.
    override-build: |
      set -eu
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
      export PATH="$HOME/.cargo/bin:$PATH"
      rustc --version
      locked=""
      [ -f .cargo/config.toml ] || locked="--locked"
      cargo build --release $locked --features gui --bin freemkv
      install -Dm755 target/release/freemkv "$CRAFT_PART_INSTALL/bin/freemkv"
      printf '%s\n' '#!/bin/sh' \
        'exec env -u DISPLAY -u WAYLAND_DISPLAY "$SNAP/bin/freemkv" "$@"' \
        > "$CRAFT_PART_INSTALL/bin/freemkv-cli"
      chmod 755 "$CRAFT_PART_INSTALL/bin/freemkv-cli"
      install -Dm644 packaging/flatpak/org.freemkv.FreeMKV.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/org.freemkv.FreeMKV.desktop"
      install -Dm644 packaging/flatpak/org.freemkv.FreeMKV.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/org.freemkv.FreeMKV.metainfo.xml"
      install -Dm644 res/freemkv-icon.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/org.freemkv.FreeMKV.svg"
    parse-info: [usr/share/metainfo/org.freemkv.FreeMKV.metainfo.xml]
