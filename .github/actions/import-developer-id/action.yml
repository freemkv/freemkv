name: Import Developer ID
description: >
  Import the Developer ID Application certificate into a throwaway keychain and
  report the signing identity. A no-op when the secrets are absent, so forks —
  which cannot read secrets — still build, unsigned, instead of failing.

inputs:
  certificate-p12:
    description: Base64-encoded Developer ID Application certificate (.p12)
    required: false
  certificate-password:
    description: Password the .p12 was exported with
    required: false
  keychain-password:
    description: Password for the temporary keychain this creates
    required: false

outputs:
  signed:
    description: '"true" when a Developer ID identity is available'
    value: ${{ steps.do.outputs.signed }}
  identity:
    description: >
      The full 'Developer ID Application: NAME (TEAMID)' identity string,
      empty when no certificate was available.
    value: ${{ steps.do.outputs.identity }}

runs:
  using: composite
  steps:
    - id: do
      shell: bash
      env:
        CERT_P12: ${{ inputs.certificate-p12 }}
        CERT_PASSWORD: ${{ inputs.certificate-password }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain-password }}
      run: |
        set -euo pipefail
        if [ -z "${CERT_P12:-}" ]; then
          echo "no signing secrets present — unsigned build (not distributable)"
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        KC="$RUNNER_TEMP/signing.keychain-db"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
        # The default is a 5-minute auto-lock. It expires part-way through a
        # build and surfaces as a signing failure that reads like a bad
        # certificate, which is a long way from the truth.
        security set-keychain-settings -lut 21600 "$KC"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
        printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$RUNNER_TEMP/cert.p12"
        # Without the partition list, codesign waits on a GUI authorisation
        # prompt that can never be answered on a runner: the job HANGS until it
        # times out rather than failing with anything informative.
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
        security list-keychains -d user -s "$KC" \
          $(security list-keychains -d user | tr -d '"')
        ID=$(security find-identity -v -p codesigning "$KC" \
              | awk -F'"' '/Developer ID Application/{print $2; exit}')
        [ -n "$ID" ] || {
          echo "::error::the imported certificate has no 'Developer ID Application' identity"
          echo "::error::a Development or Apple Distribution certificate cannot be notarized"
          exit 1
        }
        echo "signed=true" >> "$GITHUB_OUTPUT"
        echo "identity=$ID" >> "$GITHUB_OUTPUT"
        echo "Signing as: $ID"
