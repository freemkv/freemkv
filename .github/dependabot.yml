# Version updates are monthly and grouped into one PR per ecosystem.
# Security updates are separate and run whenever an advisory is published.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  target-branch: dev
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    all:
      patterns:
      - '*'
  ignore:
  - dependency-name: freemkv-unlock
  - dependency-name: libfreemkv
  - dependency-name: freemkv-keysources
  - dependency-name: freemkv-i18n
  - dependency-name: freemkv-engine
- package-ecosystem: github-actions
  directory: /
  target-branch: dev
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    all:
      patterns:
      - '*'
  ignore:
  - dependency-name: dtolnay/rust-toolchain
