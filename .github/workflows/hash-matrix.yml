name: hash-matrix

# Fixed answers prove correctness; shared inputs make platform parity meaningful.

on:
  push:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest
    outputs:
      libfreemkv: ${{ steps.revisions.outputs.libfreemkv }}
      engine: ${{ steps.revisions.outputs.engine }}
      keys: ${{ steps.revisions.outputs.keys }}
      i18n: ${{ steps.revisions.outputs.i18n }}
      unlock: ${{ steps.revisions.outputs.unlock }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Snapshot the candidate dependencies
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          SIBLING_REF: ${{ github.ref_name == 'dev' && 'dev' || 'qa' }}
        run: |
          python3 - <<'PYREFS'
          import json, os, subprocess
          revisions = {"freemkv": os.environ["GITHUB_SHA"]}
          names = {"libfreemkv": "libfreemkv", "engine": "freemkv-engine",
                   "keys": "freemkv-keysources", "i18n": "freemkv-i18n", "unlock": "freemkv-unlock"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as outputs:
              for key, repo in names.items():
                  sha = subprocess.check_output(["gh", "api", f"repos/freemkv/{repo}/git/ref/heads/{os.environ['SIBLING_REF']}",
                                                 "--jq", ".object.sha"], text=True).strip()
                  if len(sha) != 40:
                      raise SystemExit(f"Invalid revision for {repo}")
                  revisions[repo] = sha
                  outputs.write(f"{key}={sha}\n")
          with open("revisions.json", "w") as output:
              json.dump(revisions, output, sort_keys=True)
          PYREFS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: media-revisions, path: revisions.json, if-no-files-found: error }
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate the shared master.mkv
        run: |
          ffmpeg -v error -f lavfi -i testsrc=duration=6:size=640x480:rate=24 \
            -f lavfi -i sine=frequency=440:duration=6 \
            -f lavfi -i sine=frequency=880:duration=6 \
            -map 0:v -map 1:a -map 2:a -c:v libx264 -pix_fmt yuv420p -c:a ac3 -b:a 192k \
            -metadata:s:a:0 language=eng -metadata:s:a:1 language=spa master.mkv
          sha256sum master.mkv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: matrix-master-media, path: master.mkv }

  suite:
    needs: media
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: freemkv }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/libfreemkv, ref: "${{ needs.media.outputs.libfreemkv }}", path: libfreemkv }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-engine, ref: "${{ needs.media.outputs.engine }}", path: freemkv-engine }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-keysources, ref: "${{ needs.media.outputs.keys }}", path: freemkv-keysources }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-i18n, ref: "${{ needs.media.outputs.i18n }}", path: freemkv-i18n }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-unlock, ref: "${{ needs.media.outputs.unlock }}", path: freemkv-unlock }
      - name: Point the patches at the sibling checkouts
        shell: bash
        run: |
          mkdir -p freemkv/.cargo
          cat > freemkv/.cargo/config.toml <<'CFG'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-i18n = { path = "../freemkv-i18n" }

          [patch."https://github.com/freemkv/freemkv-unlock"]
          freemkv-unlock = { path = "../freemkv-unlock" }
          CFG
      - name: Record the libfreemkv sha
        shell: bash
        run: |
          echo "LF_SHA=$(git -C libfreemkv rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Install FFmpeg
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-*)  sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macos-*)   brew install ffmpeg ;;
            windows-*) choco install ffmpeg -y --no-progress ;;
          esac
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: freemkv }
      - run: cargo build --release --bin freemkv
        working-directory: freemkv
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: matrix-master-media, path: shared }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate content and subtitle lifecycle against known answers
        shell: bash
        run: |
          BIN="$PWD/freemkv/target/release/freemkv"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          python freemkv/tests/media_kat.py --binary "$BIN" --artifacts media-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: media-${{ matrix.os }}
          path: media-results
          if-no-files-found: error
          retention-days: 14
      - name: Run the CLI suite against the shared media
        shell: bash
        run: |
          set +e -uo pipefail
          BIN="$PWD/freemkv/target/release/freemkv"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          FMKV_BIN="$BIN" \
          FMKV_MASTER="$PWD/shared/master.mkv" \
          FMKV_HASHES="$PWD/hashes-${{ matrix.os }}.txt" \
            bash freemkv/tests/cli-integration.sh
          rc=$?
          echo "libfreemkv=$LF_SHA" >> "hashes-${{ matrix.os }}.txt"
          echo "--- hashes recorded on ${{ matrix.os }} ---"
          cat "hashes-${{ matrix.os }}.txt"
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "matrix-hashes-${{ matrix.os }}"
          path: "hashes-${{ matrix.os }}.txt"

  compare-known-answers:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: 'media-*', path: reports }
      - run: python3 tests/media_kat.py --compare reports

  compare:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "matrix-hashes-*", merge-multiple: true, path: hashes }
      - name: Every platform must produce the same bytes
        shell: bash
        run: |
          set -euo pipefail
          ls -1 hashes/ || { echo "::error::no hash files were produced"; exit 1; }
          python3 - <<'PY'
          import glob, os, sys, collections

          arts = collections.defaultdict(dict)
          shas = {}
          files = sorted(glob.glob("hashes/*.txt"))
          if not files:
              print("::error::no hash files to compare"); sys.exit(1)

          for path in files:
              plat = os.path.basename(path)[len("hashes-"):-len(".txt")]
              for line in open(path):
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("libfreemkv="):
                      shas[plat] = line.split("=", 1)[1]
                      continue
                  h, _, name = line.partition("  ")
                  arts[name.strip()][plat] = h

          plats = sorted({p for v in arts.values() for p in v})
          print("platforms:", ", ".join(plats) or "(none)")

          fail = False

          if len(set(shas.values())) > 1:
              print("::error::libfreemkv shas differ across the matrix "
                    f"({shas}) -- MUX_APP differs, so a byte comparison would be "
                    "meaningless. Pin the sibling refs.")
              fail = True

          EXPECTED = {"ubuntu-latest", "macos-latest", "windows-latest"}
          absent = sorted(EXPECTED - set(plats))
          if absent:
              print(f"::error::no hashes from {', '.join(absent)} -- that platform "
                    "was never compared, so this run cannot claim parity across all three")
              fail = True

          for name in sorted(arts):
              by = arts[name]
              missing = [p for p in plats if p not in by]
              uniq = set(by.values())
              if len(uniq) == 1 and not missing:
                  print(f"  OK    {name}: identical on all {len(by)} platforms")
              elif len(uniq) == 1:
                  fail = True
                  print(f"::error::{name} was NOT produced on {', '.join(missing)} "
                        "-- it agrees where it exists, but that platform is unproven")
              else:
                  fail = True
                  print(f"::error::{name} DIFFERS across platforms:")
                  for p in sorted(by):
                      print(f"      {p:16} {by[p]}")

          sys.exit(1 if fail else 0)
          PY

  real-media:
    needs: media
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write   # OIDC; nothing else is needed
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: freemkv }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/libfreemkv, ref: "${{ needs.media.outputs.libfreemkv }}", path: libfreemkv }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-engine, ref: "${{ needs.media.outputs.engine }}", path: freemkv-engine }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-keysources, ref: "${{ needs.media.outputs.keys }}", path: freemkv-keysources }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-i18n, ref: "${{ needs.media.outputs.i18n }}", path: freemkv-i18n }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-unlock, ref: "${{ needs.media.outputs.unlock }}", path: freemkv-unlock }
      - name: Point the patches at the sibling checkouts
        shell: bash
        run: |
          mkdir -p freemkv/.cargo
          cat > freemkv/.cargo/config.toml <<'CFG'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-i18n = { path = "../freemkv-i18n" }

          [patch."https://github.com/freemkv/freemkv-unlock"]
          freemkv-unlock = { path = "../freemkv-unlock" }
          CFG
      - name: Record the libfreemkv sha
        shell: bash
        run: echo "LF_SHA=$(git -C libfreemkv rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Are the fixture credentials available?
        id: creds
        shell: bash
        env:
          FMKV_FIXTURES_ROLE: ${{ secrets.FMKV_FIXTURES_ROLE }}
          FMKV_FIXTURES_S3: ${{ secrets.FMKV_FIXTURES_S3 }}
        run: |
          if [ -n "$FMKV_FIXTURES_ROLE" ] && [ -n "$FMKV_FIXTURES_S3" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::error::Required DVD fixture credentials are missing"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: steps.creds.outputs.have == 'true'
        with:
          role-to-assume: ${{ secrets.FMKV_FIXTURES_ROLE }}
          aws-region: ${{ vars.FMKV_FIXTURES_REGION }}
      - name: Fetch the disc fixture
        if: steps.creds.outputs.have == 'true'
        shell: bash
        env:
          FMKV_FIXTURES_S3: ${{ secrets.FMKV_FIXTURES_S3 }}
        run: aws s3 cp "$FMKV_FIXTURES_S3/dvd.iso" dvd.iso --quiet && ls -l dvd.iso
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install media tools
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-*) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macos-*) brew install ffmpeg ;;
            windows-*) choco install ffmpeg -y --no-progress ;;
          esac
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        if: steps.creds.outputs.have == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.creds.outputs.have == 'true'
        with: { workspaces: freemkv }
      - run: cargo build --release --bin freemkv
        if: steps.creds.outputs.have == 'true'
        working-directory: freemkv
      - name: Rip the fixture and hash the result
        if: steps.creds.outputs.have == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/freemkv/target/release/freemkv"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" iso://dvd.iso mkv://dvd-out.mkv
          python freemkv/tests/media_checks.py timeline dvd-out.mkv --mode cadence
          python freemkv/tests/media_checks.py decode dvd-out.mkv
          if command -v sha256sum >/dev/null; then H=$(sha256sum dvd-out.mkv | cut -d' ' -f1)
          else H=$(shasum -a 256 dvd-out.mkv | cut -d' ' -f1); fi
          printf '%s  dvd-out.mkv\nlibfreemkv=%s\n' "$H" "$LF_SHA" > "real-${{ matrix.os }}.txt"
          cat "real-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.creds.outputs.have == 'true'
        with:
          name: "matrix-real-${{ matrix.os }}"
          path: "real-${{ matrix.os }}.txt"

  compare-real:
    needs: real-media
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "matrix-real-*", merge-multiple: true, path: real }
        continue-on-error: true
      - name: Every platform must rip the disc identically
        shell: bash
        run: |
          set -euo pipefail
          if ! ls real/*.txt >/dev/null 2>&1; then
            echo "Required real-media reports are missing; platform parity was not validated." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 - <<'PY'
          import glob, os, sys, collections
          arts, shas = collections.defaultdict(dict), {}
          for path in sorted(glob.glob("real/*.txt")):
              plat = os.path.basename(path)[len("real-"):-len(".txt")]
              for line in open(path):
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("libfreemkv="):
                      shas[plat] = line.split("=", 1)[1]; continue
                  h, _, name = line.partition("  ")
                  arts[name.strip()][plat] = h

          plats = sorted({p for v in arts.values() for p in v})
          print("platforms:", ", ".join(plats) or "(none)")
          fail = False

          if len(set(shas.values())) > 1:
              print(f"::error::libfreemkv shas differ across the matrix ({shas}) -- "
                    "MUX_APP differs, so a byte comparison would be meaningless.")
              fail = True

          EXPECTED = {"ubuntu-latest", "macos-latest", "windows-latest"}
          absent = sorted(EXPECTED - set(plats))
          if absent:
              print(f"::error::no real-media hashes from {', '.join(absent)} -- "
                    "that platform was never compared")
              fail = True

          for name in sorted(arts):
              by = arts[name]
              if len(set(by.values())) == 1 and not (EXPECTED - set(by)):
                  print(f"  OK    {name}: identical on all {len(by)} platforms")
              else:
                  fail = True
                  print(f"::error::{name} DIFFERS or is missing:")
                  for p in sorted(by):
                      print(f"      {p:16} {by[p]}")

          sys.exit(1 if fail else 0)
          PY
