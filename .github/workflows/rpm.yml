name: RPM package

# .rpm packages for Fedora, RHEL and openSUSE, repackaged from the release's
# validated .debs (packaging/rpm/deb2rpm.py): same binaries, so nothing is
# compiled here. Every .deb on the release becomes an .rpm, any package, any
# architecture (amd64 -> x86_64, arm64 -> aarch64, armhf -> armv7hl).
#
#   tag push        wait for deb.yml's .debs on the release, convert, install-test,
#                   sign, attach freemkv-*.rpm (+ .sha256), refresh freemkv.org/rpm
#   dispatch + tag  the same for an existing release (backfill):
#                     gh workflow run rpm.yml --ref dev -f tag=v1.8.0
#   dev/qa/PR       convert the LATEST release's .debs and install-test; publish nothing
#
# Packages are signed with secret APT_SIGNING_KEY (the freemkv.org APT/RPM key).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to add .rpms to (e.g. v1.8.0); empty = test only
        type: string
        default: ''
  push:
    branches: [dev, qa]
    tags: ['v*', '!v*-rc*']
  pull_request:
    paths: ['packaging/rpm/**', '.github/workflows/rpm.yml']

concurrency:
  group: rpm-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaging-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s packaging/rpm -p 'test_*.py' -v

  debs:
    needs: packaging-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - name: Pick the release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; publish=true
          elif [ -n "$INPUT_TAG" ]; then tag=$INPUT_TAG; publish=true
          else tag=$(gh release view --json tagName -q .tagName); publish=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release $tag, publish=$publish"
      # On a tag, deb.yml attaches the .debs after building and installing
      # them; wait until they are there and the asset list has settled.
      - name: Wait for the release's .debs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          last=
          for attempt in $(seq 1 280); do
            debs=$(gh release view "$TAG" --json assets -q '[.assets[].name | select(endswith(".deb"))] | sort | join(" ")' 2>/dev/null || true)
            case " $debs " in *" freemkv-amd64.deb "*) case " $debs " in *" freemkv-cli-amd64.deb "*)
                if [ "$debs" = "$last" ]; then echo "debs: $debs"; exit 0; fi ;;
            esac ;; esac
            last=$debs
            echo "waiting for $TAG .debs ($attempt): ${debs:-none}"
            sleep 30
          done
          echo "the .debs never appeared on $TAG"; exit 1
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.deb' --pattern '*.deb.sha256' --dir debs
          cd debs && for f in *.deb; do
            [ -f "$f.sha256" ] && sha256sum -c "$f.sha256"
          done
          ls -l
      - uses: actions/upload-artifact@v7
        with: { name: debs, path: debs/*.deb, if-no-files-found: error, retention-days: 7 }

  build:
    needs: debs
    runs-on: ubuntu-24.04
    container: fedora:40
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v8
        with: { name: debs, path: debs }
      - name: Convert
        run: |
          set -euo pipefail
          dnf -y -q install rpm-build rpm-sign zstd python3 gnupg2 jq
          python3 packaging/rpm/deb2rpm.py --output rpms --floor gtk4=4.10 --floor libadwaita=1.4 debs/*.deb
          for r in rpms/*.rpm; do
            echo "== $r"; rpm -qp --info "$r" | sed -n '1,12p'; rpm -qp --requires "$r"; rpm -qp --conflicts "$r"; rpm -qpl "$r"
          done
      - name: Sign
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY }}
          PUBLISH: ${{ needs.debs.outputs.publish }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            [ "$PUBLISH" = true ] && { echo "APT_SIGNING_KEY is required to publish"; exit 1; }
            echo "::notice::no APT_SIGNING_KEY here; packages left unsigned (test run)"; exit 0
          fi
          GNUPGHOME=$(mktemp -d); export GNUPGHOME
          printf '%s\n' "$KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          gpg --armor --export "$fpr" > rpms/freemkv.asc
          rpmsign --addsign --define "_gpg_name $fpr" --define "_gpg_path $GNUPGHOME" \
            --define '_gpg_sign_cmd_extra_args --pinentry-mode loopback' rpms/*.rpm
          rpm --import rpms/freemkv.asc
          out=$(rpm -K rpms/*.rpm)
          echo "$out"
          if grep -v ' signatures OK$' <<<"$out"; then echo "unsigned or bad signature"; exit 1; fi
      - name: Install legs
        id: legs
        run: |
          set -euo pipefail
          legs='[]'
          add() { legs=$(jq -c --argjson l "$1" '. + [$l]' <<<"$legs"); }
          if [ -f rpms/freemkv-x86_64.rpm ]; then
            add '{"name": "fedora-40-x86_64", "runner": "ubuntu-24.04", "image": "fedora:40", "arch": "x86_64", "pm": "dnf", "app": true}'
            add '{"name": "opensuse-tumbleweed-x86_64", "runner": "ubuntu-24.04", "image": "opensuse/tumbleweed", "arch": "x86_64", "pm": "zypper", "app": true}'
            add '{"name": "almalinux-9-x86_64", "runner": "ubuntu-24.04", "image": "almalinux:9", "arch": "x86_64", "pm": "dnf", "app": false}'
          fi
          if [ -f rpms/freemkv-aarch64.rpm ]; then
            add '{"name": "fedora-40-aarch64", "runner": "ubuntu-24.04-arm", "image": "fedora:40", "arch": "aarch64", "pm": "dnf", "app": true}'
          fi
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with: { name: rpm-package, path: rpms, if-no-files-found: error, retention-days: 90 }

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.legs) }}
    name: install (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with: { name: rpm-package, path: rpms }
      - name: CLI package installs, is static and runs
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          if [ -f rpms/freemkv.asc ]; then
            rpm --import rpms/freemkv.asc
            rpm -K "rpms/freemkv-cli-$ARCH.rpm" | grep -F 'signatures OK'
          fi
          if [ "$PM" = dnf ]; then dnf -y -q install "./rpms/freemkv-cli-$ARCH.rpm" /usr/bin/awk
          else zypper -n -q install --allow-unsigned-rpm "./rpms/freemkv-cli-$ARCH.rpm" gawk; fi
          rpm -q freemkv-cli
          expected=$(rpm -qp --qf '%{VERSION}' "rpms/freemkv-cli-$ARCH.rpm")
          /usr/bin/freemkv --version | tee cli-version.log
          awk -v e="$expected" '$1 == e { f=1 } END { exit !f }' cli-version.log
          status=0; /usr/bin/freemkv > /dev/null 2>&1 || status=$?
          test "$status" -eq 2
      - name: App package replaces the CLI and runs
        if: matrix.app
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PM: ${{ matrix.pm }}
        run: |
          set -euo pipefail
          if [ "$PM" = dnf ]; then
            dnf -y -q install --allowerasing "./rpms/freemkv-$ARCH.rpm" \
              /usr/bin/Xvfb /usr/bin/dbus-run-session /usr/sbin/useradd /usr/sbin/runuser \
              mesa-dri-drivers libglvnd-gles
          else
            zypper -n -q install --allow-unsigned-rpm --force-resolution "./rpms/freemkv-$ARCH.rpm"
          fi
          rpm -q freemkv
          if rpm -q freemkv-cli; then echo "freemkv-cli is still installed alongside freemkv"; exit 1; fi
          ldd /usr/bin/freemkv | grep -F libgtk-4.so
          test -f /usr/share/applications/org.freemkv.FreeMKV.desktop
          freemkv --version
      - name: Launch the installed GUI without a terminal
        if: matrix.app && matrix.pm == 'dnf'
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home tester
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          status=0
          runuser -u tester -- env DISPLAY=:99 GDK_BACKEND=x11 \
            timeout 15s dbus-run-session -- /usr/bin/freemkv > gui-launch.log 2>&1 || status=$?
          cat gui-launch.log
          test "$status" -eq 124

  publish:
    needs: [debs, install]
    if: needs.debs.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: rpm-package, path: rpm-package }
      - name: Attach the installed and validated packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.debs.outputs.tag }}
        run: |
          set -euo pipefail
          cd rpm-package
          rpms=(freemkv-*.rpm)
          for f in "${rpms[@]}"; do sha256sum "$f" > "$f.sha256"; done
          ls -l
          gh release upload "$TAG" freemkv-*.rpm freemkv-*.rpm.sha256 --clobber
      # A marketing outage must not turn the release red; rpm.yml there also runs daily.
      - name: Refresh the freemkv.org RPM repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: gh api repos/freemkv/marketing/dispatches -f event_type=rpm-refresh
