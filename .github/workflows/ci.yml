name: CI

on:
  push:
    # dev -> qa -> main. `dev` is where work lands and is meant to be pushed
    # to often: these are the FAST checks, so a mistake surfaces in minutes.
    # `qa` is the release candidate — it runs these too, plus the expensive
    # suite in qa.yml. `main` only ever moves at release time, to a tagged
    # commit that was already green on qa.
    branches: [main, dev, qa]
  pull_request:

# Rapid dev pushes supersede their own in-progress runs instead of stacking.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: every job here only reads the repo (checkout,
# build, lint, test). No job publishes a release, writes to the repo, or needs
# OIDC, so nothing elevates this.
permissions:
  contents: read

# WHY THE SIBLING CHECKOUTS — this is NOT a monorepo.
#
# The committed Cargo.toml resolves every freemkv crate from a git TAG, and one
# of those tags (freemkv-engine v1.6.0) DOES NOT EXIST — release-orchestrate.yml creates it.
# So every job here failed at dependency resolution with "failed to find tag
# v1.6.0", on all three OSes, before compiling a line. Even once that tag
# exists, pinning it means CI validates this branch against the last release of
# the libraries rather than their dev tips, so a change spanning repos cannot be
# verified until the tags are cut — the worst moment to find a build error.
#
# The fix mirrors the developer's local layout. Every repo is checked out into a
# subdirectory of $GITHUB_WORKSPACE, reproducing ~/Developer/freemkv/*, and a
# generated .cargo/config.toml redirects the git-tag patches at those paths.
# Config-level [patch.crates-io] wins over the manifest one — the same mechanism
# local development already uses (see the note in Cargo.toml).
#
# Subdirectories rather than `../libfreemkv` because actions/checkout refuses
# any `path:` outside $GITHUB_WORKSPACE, and the workspace IS the repo dir.
# Repos stay separate, tags stay separate, the release cascade is untouched.
#
# freemkv-unlock is patched like the rest: libfreemkv depends on it by version
# (git-tag override), so the workspace needs the path redirect too.
#
# `--locked` is not used. The committed Cargo.lock resolves the freemkv crates
# as path packages and carries [[patch.unused]] entries — artifacts of whichever
# local cargo config last wrote it, describing a developer's machine rather than
# a release. release-orchestrate.yml regenerates it with the real tags at ship time, which is
# where the pin has to hold.
#
# `freemkv` ships as two builds of one source: the CLI (no features) and the
# app (`--features gui`, adds the AppKit / winsafe / GTK4 shell). Every job that
# compiles the crate on macOS, Windows or Linux-glibc covers BOTH builds;
# `cli-has-no-ui-deps` proves the CLI build links no UI crate on any target.
#
# A third build, the server (`--features server`, the rip daemon + web UI of
# the container image), is Linux-only: `cli-linux` lints and tests it, and
# `no-server-deps-outside-server` proves neither the CLI nor the app build
# links a server crate.
#
# RELEASE-CANDIDATE-ONLY JOBS. dev is the FAST lane, so the macOS, Windows and
# Intel jobs below (and cli-linux's release builds) run on qa and main rather
# than on every push to dev. Nothing stops being checked before a release:
# qa.yml independently covers macOS and Windows, and the jobs unique to this
# file run here on qa and main. `if` SKIPS a job rather than queueing it; a
# never-scheduled job would leave the run pending and the required checks
# incomplete forever.
jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --experimental-vm-modules --test tests/web/*.test.mjs

  # CI owns the changelog: main may never carry a released version without a
  # CHANGELOG.md entry for it. The release orchestrator dates an existing
  # `## [X.Y.Z]` heading — it does NOT invent one — so a version bump that
  # forgot its changelog entry must fail here rather than ship a blank release.
  # Hard-fails on main (and PRs targeting main); warns elsewhere so an
  # in-progress dev/qa branch whose entry isn't written yet is not blocked.
  media-harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tests/media_gate.py reads TOML with tomllib (Python 3.11+).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --quiet pyyaml
      - run: python3 -m unittest discover -s tests -p 'test_media*.py' -v
      # The GUI gate's driver and disc fixture (qa's gui-gate job).
      - run: python3 -m unittest discover -s tests -p 'test_gui*.py' -v

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a CHANGELOG entry for the crate version on main
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for ${version}."
            exit 0
          fi
          msg="CHANGELOG.md has no '## [${version}]' entry"
          if [ "${GITHUB_REF_NAME:-}" = "main" ] || [ "${GITHUB_BASE_REF:-}" = "main" ]; then
            echo "::error::${msg} — main requires a changelog entry for the released version."
            exit 1
          fi
          echo "::warning::${msg} (allowed on ${GITHUB_REF_NAME:-unknown}; required before it can reach main)."

  # ── macOS: the whole crate, GUI shell included ─────────────────────────────
  # --all-targets so the tests and the AppKit shell are linted too.
  lint-macos:
    # qa/main only: see "RELEASE-CANDIDATE-ONLY JOBS" in the header.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - run: cargo fmt --check
        working-directory: freemkv
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: freemkv
      - run: cargo clippy --all-targets --features gui -- -D warnings
        working-directory: freemkv

  # The disc-backed tests skip themselves when FMKV_TEST_ISO is unset, so
  # this runs the platform-neutral suite without needing media on the runner.
  test-macos:
    # qa/main only: see "RELEASE-CANDIDATE-ONLY JOBS" in the header.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - run: cargo test --tests
        working-directory: freemkv
      - run: cargo test --tests --features gui
        working-directory: freemkv

  # ── Windows: the whole crate, the winsafe shell included ───────────────────
  # The peer of the macOS jobs. Without these, the Windows desktop shell would
  # be compiled for the first time by the RELEASE workflow — i.e. a broken
  # Windows shell would be discovered at tag time, not at PR time.
  # `platform.rs` in particular has a `#[cfg(windows)]` `GetDiskFreeSpaceExW`
  # arm that no other job compiles, so nothing else can catch a regression.
  lint-windows:
    # qa/main only: see "RELEASE-CANDIDATE-ONLY JOBS" in the header.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - run: cargo fmt --check
        working-directory: freemkv
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: freemkv
      - run: cargo clippy --all-targets --features gui -- -D warnings
        working-directory: freemkv

  # The suite is platform-neutral by contract (the disc-backed tests skip
  # themselves when FMKV_TEST_ISO is unset). If a test needs editing to pass
  # on Windows, the Windows port has broken something — that is the signal.
  test-windows:
    # qa/main only: see "RELEASE-CANDIDATE-ONLY JOBS" in the header.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - run: cargo test --tests
        working-directory: freemkv
      - run: cargo test --tests --features gui
        working-directory: freemkv

  # The shippable Windows products are release builds of the app (both bins)
  # and the CLI. `cargo test` above only builds dev profile, and
  # release-only failures are real (LTO, codegen-units, opt-level). Cheap
  # insurance that the artifact the release workflow zips actually links.
  release-build-windows:
    # qa/main only: see "RELEASE-CANDIDATE-ONLY JOBS" in the header.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - run: cargo build --release --features gui
        working-directory: freemkv
      - run: cargo build --release --bin freemkv
        working-directory: freemkv

  # ── Intel Mac: a target we SHIP but never otherwise compile ────────────────
  # Both the macOS app .zip and the bare CLI binary ship an x86_64-apple-darwin build,
  # and until this job existed no CI leg compiled that target at all — the
  # runners are arm64, so a break would have surfaced at tag time, in the
  # release workflow, after the version bump and the tag push.
  build-macos-intel:
    # qa/main only: see "RELEASE-CANDIDATE-ONLY JOBS" in the header.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - run: cargo build --release --target x86_64-apple-darwin --bin freemkv
        working-directory: freemkv
      - run: cargo build --release --target x86_64-apple-darwin --features gui --bin freemkv
        working-directory: freemkv

  # ── Linux-glibc: CLI and GTK4 app ─────────────────────────────────────────
  # The app build's gtk4/libadwaita build.rs probe pkg-config, hence the
  # apt-get. The musl CLI release binaries are built in release.yml.
  cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - name: Install GTK4 + libadwaita development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      # The only rustfmt gate on dev and on pull requests.
      - run: cargo fmt --check
        working-directory: freemkv
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: freemkv
      - run: cargo clippy --all-targets --features gui -- -D warnings
        working-directory: freemkv
      - run: cargo test --tests
        working-directory: freemkv
      - run: cargo test --tests --features gui
        working-directory: freemkv
      - run: cargo clippy --all-targets --features server -- -D warnings
        working-directory: freemkv
      - run: cargo test --tests --features server
        working-directory: freemkv
      - run: cargo build --release --bin freemkv
        if: github.ref_name == 'qa' || github.ref_name == 'main'
        working-directory: freemkv
      - run: cargo build --release --features gui --bin freemkv
        if: github.ref_name == 'qa' || github.ref_name == 'main'
        working-directory: freemkv

  # The CLI build must link no UI crate on any target. `--target all` resolves
  # every platform's deps from one Linux runner.
  cli-has-no-ui-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: No gtk4/libadwaita/winsafe/objc2-app-kit without the gui feature
        working-directory: freemkv
        shell: bash
        run: |
          set -euo pipefail
          ui='^(gtk4|libadwaita|winsafe|objc2-app-kit) '
          cli=$(cargo tree -e normal --target all --prefix none)
          app=$(cargo tree -e normal --target all --prefix none --features gui)
          if grep -E "$ui" <<<"$cli" | sort -u | grep .; then
            echo "::error::the CLI build (no features) pulls in the UI crates above"
            exit 1
          fi
          # Guard the guard: the app build must still find them.
          [ "$(grep -E "$ui" <<<"$app" | cut -d' ' -f1 | sort -u | wc -l)" -eq 4 ] || {
            echo "::error::expected all four UI crates in the gui build's tree"
            exit 1
          }

  # The server crates (web server, JSON log sink) belong to the server build
  # only: the CLI and app builds must link none of them, on any target.
  no-server-deps-outside-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: No tiny_http/tracing-serde without the server feature
        working-directory: freemkv
        shell: bash
        run: |
          set -euo pipefail
          srv='^(tiny_http|tracing-serde) '
          ui='^(gtk4|libadwaita|winsafe|objc2-app-kit) '
          cli=$(cargo tree -e normal --target all --prefix none)
          app=$(cargo tree -e normal --target all --prefix none --features gui)
          server=$(cargo tree -e normal --target all --prefix none --features server)
          if grep -E "$srv" <<<"$cli" | sort -u | grep .; then
            echo "::error::the CLI build (no features) pulls in the server crates above"
            exit 1
          fi
          if grep -E "$srv" <<<"$app" | sort -u | grep .; then
            echo "::error::the app build (--features gui) pulls in the server crates above"
            exit 1
          fi
          if grep -E "$ui" <<<"$server" | sort -u | grep .; then
            echo "::error::the server build (--features server) pulls in the UI crates above"
            exit 1
          fi
          # Guard the guard: the server build must still find them.
          [ "$(grep -E "$srv" <<<"$server" | cut -d' ' -f1 | sort -u | wc -l)" -eq 2 ] || {
            echo "::error::expected both server crates in the server build's tree"
            exit 1
          }

  # ── Dependency audit: cargo-deny over the RESOLVED graph ───────────────────
  # Gates the resolved dependency graph against RUSTSEC advisories, a permissive
  # licence allow-list, and source/ban hygiene (see deny.toml). Mirrors the
  # sibling-checkout layout (this is not a monorepo) so `cargo metadata`
  # resolves the freemkv crates from their dev tips via the generated
  # .cargo/config.toml, exactly as the build jobs do.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-deny
      # Run from the repo dir so the generated .cargo/config.toml path patches apply.
      - run: cargo deny --all-features check advisories bans licenses sources
        working-directory: freemkv

  # The shared core must stay platform-neutral: this checks the LIBRARY on
  # Linux, so if a `df` call or any OS assumption creeps into ui.rs/engine.rs
  # it fails here long before the Windows shell exists to notice. Checked
  # without the gui feature, so no GTK4 headers are needed.
  core-is-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - run: cargo check --lib
        working-directory: freemkv

  # The macOS bundle carries its own version, and the release build refuses to
  # run when it disagrees with the tag. That check is correct but it fires
  # AFTER the tag is public, so its verdict can only burn a version number:
  # v1.6.1 and v1.6.2 were both tagged, pushed, and then failed at the first
  # job of the release build on a bundle version nobody had bumped.
  #
  # Checking it here, on every push, means the two files cannot drift in the
  # first place -- so by the time a release reads them they already agree, and
  # the release-time check becomes a formality rather than a gate anyone can
  # arrive at too late.
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cargo.toml and Info.plist must agree
        shell: bash
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          short=$(sed -n 's/.*<key>CFBundleShortVersionString<\/key><string>\(.*\)<\/string>.*/\1/p' macos/Info.plist)
          bundle=$(sed -n 's/.*<key>CFBundleVersion<\/key><string>\(.*\)<\/string>.*/\1/p' macos/Info.plist)

          echo "Cargo.toml                  $crate"
          echo "CFBundleShortVersionString  $short"
          echo "CFBundleVersion             $bundle"

          rc=0
          [ -n "$crate" ] || { echo "::error::could not read version from Cargo.toml"; rc=1; }
          [ "$short" = "$crate" ] || {
            echo "::error file=macos/Info.plist::CFBundleShortVersionString is '$short' but Cargo.toml says '$crate'"
            rc=1
          }
          [ "$bundle" = "$crate" ] || {
            echo "::error file=macos/Info.plist::CFBundleVersion is '$bundle' but Cargo.toml says '$crate'"
            rc=1
          }
          exit $rc

  # ── Coverage: informational Codecov upload ─────────────────────────────────
  # Additive, NON-REQUIRED. Mirrors the Linux CLI job's sibling-checkout layout
  # (this is not a monorepo) so cargo llvm-cov can resolve the freemkv crates
  # from their dev tips via the generated .cargo/config.toml. `--locked` is
  # intentionally omitted for the same reason the rest of this file omits it
  # (see the header note): the committed Cargo.lock describes a developer's
  # machine, not a release. Uploads with CODECOV_TOKEN (empty on forks, where
  # Codecov falls back to its tokenless mode) and never fails CI.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v2
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          self: freemkv
      - name: Install GTK4 + libadwaita development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libadwaita-1-dev build-essential
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - uses: taiki-e/install-action@3ce020901a1c1292716d3268bf506c1ae55a84cd # v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --features gui --ignore-run-fail --lcov --output-path lcov.info
        working-directory: freemkv
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: freemkv/lcov.info
          slug: freemkv/freemkv
          fail_ci_if_error: false
