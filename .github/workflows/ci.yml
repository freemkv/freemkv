name: CI

on:
  push:
    # dev -> qa -> main. `dev` is where work lands and is meant to be pushed
    # to often: these are the FAST checks, so a mistake surfaces in minutes.
    # `qa` is the release candidate — it runs these too, plus the expensive
    # suite in qa.yml. `main` only ever moves at release time, to a tagged
    # commit that was already green on qa.
    branches: [main, dev, qa]
  pull_request:

# WHY THE SIBLING CHECKOUTS — this is NOT a monorepo.
#
# The committed Cargo.toml resolves every freemkv crate from a git TAG, and one
# of those tags (freemkv-engine v1.6.0) DOES NOT EXIST — release.sh creates it.
# So every job here failed at dependency resolution with "failed to find tag
# v1.6.0", on all three OSes, before compiling a line. Even once that tag
# exists, pinning it means CI validates this branch against the last release of
# the libraries rather than their dev tips, so a change spanning repos cannot be
# verified until the tags are cut — the worst moment to find a build error.
#
# The fix mirrors the developer's local layout. Every repo is checked out into a
# subdirectory of $GITHUB_WORKSPACE, reproducing ~/Developer/freemkv/*, and a
# generated .cargo/config.toml redirects the git-tag patches at those paths.
# Config-level [patch.crates-io] wins over the manifest one — the same mechanism
# local development already uses (see the note in Cargo.toml).
#
# Subdirectories rather than `../libfreemkv` because actions/checkout refuses
# any `path:` outside $GITHUB_WORKSPACE, and the workspace IS the repo dir.
# Repos stay separate, tags stay separate, the release cascade is untouched.
#
# freemkv-unlock gets a checkout but no patch entry: it is reached as
# libfreemkv's path dep (../freemkv-unlock), which resolves to the workspace
# root under this layout.
#
# `--locked` is not used. The committed Cargo.lock resolves the freemkv crates
# as path packages and carries [[patch.unused]] entries — artifacts of whichever
# local cargo config last wrote it, describing a developer's machine rather than
# a release. release.sh regenerates it with the real tags at ship time, which is
# where the pin has to hold.
#
# `freemkv` is one binary with two shells: the CLI (every OS) and the native
# desktop GUI (macOS + Windows). So CI verifies BOTH halves:
#   - the macOS jobs build/lint/test the whole crate incl. the AppKit shell —
#     where the dead-state bugs live;
#   - the Windows jobs do the same for the winsafe shell, and are the only jobs
#     that compile the `#[cfg(windows)]` half of platform.rs at all;
#   - the Linux job builds/lints/tests the CLI, which is what Linux ships (the
#     GUI is target-gated off, so a Linux build is pure CLI);
#   - a lib-only check keeps the shared core (ui.rs/engine.rs) portable.
jobs:
  # ── macOS: the whole crate, GUI shell included ─────────────────────────────
  # --all-targets so the tests and the AppKit shell are linted too.
  lint-macos:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo fmt --check
        working-directory: freemkv
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: freemkv

  # The disc-backed tests skip themselves when FMKV_TEST_ISO is unset, so
  # this runs the platform-neutral suite without needing media on the runner.
  test-macos:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo test --tests
        working-directory: freemkv

  # ── Windows: the whole crate, the winsafe shell included ───────────────────
  # The peer of the macOS jobs. Without these, the Windows desktop shell would
  # be compiled for the first time by the RELEASE workflow — i.e. a broken
  # Windows shell would be discovered at tag time, not at PR time.
  # `platform.rs` in particular has a `#[cfg(windows)]` `GetDiskFreeSpaceExW`
  # arm that no other job compiles, so nothing else can catch a regression.
  lint-windows:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo fmt --check
        working-directory: freemkv
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: freemkv

  # The suite is platform-neutral by contract (the disc-backed tests skip
  # themselves when FMKV_TEST_ISO is unset). If a test needs editing to pass
  # on Windows, the Windows port has broken something — that is the signal.
  test-windows:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo test --tests
        working-directory: freemkv

  # The shippable Windows product is a release build of the freemkv bins
  # (CLI + desktop shell). `cargo test` above only builds dev profile, and
  # release-only failures are real (LTO, codegen-units, opt-level). Cheap
  # insurance that the artifact the release workflow zips actually links.
  release-build-windows:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo build --release
        working-directory: freemkv

  # ── Intel Mac: a target we SHIP but never otherwise compile ────────────────
  # Both the .dmg and the bare CLI binary ship an x86_64-apple-darwin build,
  # and until this job existed no CI leg compiled that target at all — the
  # runners are arm64, so a break would have surfaced at tag time, in the
  # release workflow, after the version bump and the tag push.
  build-macos-intel:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo build --release --target x86_64-apple-darwin
        working-directory: freemkv

  # ── Linux: the CLI (what Linux ships) ──────────────────────────────────────
  # The GUI is target-gated off, so this builds the pure CLI. If any GUI code
  # or OS assumption leaked into the always-compiled path it would fail here
  # on `-D warnings` (dead code) long before a Linux user hit it.
  cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: freemkv
      - run: cargo test --tests
        working-directory: freemkv
      - run: cargo build --release
        working-directory: freemkv

  # The shared core must stay platform-neutral: this checks the LIBRARY on
  # Linux, so if a `df` call or any OS assumption creeps into ui.rs/engine.rs
  # it fails here long before the Windows shell exists to notice.
  core-is-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo check --lib
        working-directory: freemkv

  # The macOS bundle carries its own version, and the release build refuses to
  # run when it disagrees with the tag. That check is correct but it fires
  # AFTER the tag is public, so its verdict can only burn a version number:
  # v1.6.1 and v1.6.2 were both tagged, pushed, and then failed at the first
  # job of the release build on a bundle version nobody had bumped.
  #
  # Checking it here, on every push, means the two files cannot drift in the
  # first place -- so by the time a release reads them they already agree, and
  # the release-time check becomes a formality rather than a gate anyone can
  # arrive at too late.
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo.toml and Info.plist must agree
        shell: bash
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          short=$(sed -n 's/.*<key>CFBundleShortVersionString<\/key><string>\(.*\)<\/string>.*/\1/p' macos/Info.plist)
          bundle=$(sed -n 's/.*<key>CFBundleVersion<\/key><string>\(.*\)<\/string>.*/\1/p' macos/Info.plist)

          echo "Cargo.toml                  $crate"
          echo "CFBundleShortVersionString  $short"
          echo "CFBundleVersion             $bundle"

          rc=0
          [ -n "$crate" ] || { echo "::error::could not read version from Cargo.toml"; rc=1; }
          [ "$short" = "$crate" ] || {
            echo "::error file=macos/Info.plist::CFBundleShortVersionString is '$short' but Cargo.toml says '$crate'"
            rc=1
          }
          [ "$bundle" = "$crate" ] || {
            echo "::error file=macos/Info.plist::CFBundleVersion is '$bundle' but Cargo.toml says '$crate'"
            rc=1
          }
          exit $rc
