name: qa

# Bounded media validation runs in hash-matrix; full-disc EC2 integration is opt-in.

on:
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      run_media:
        description: >-
          Run full-disc DVD/BD/UHD/HD-DVD integration on ephemeral EC2 runners
          (~121 GiB per platform, approximately two hours). The bounded media
          known-answer and three-platform parity gate runs on every QA push.
        type: boolean
        default: false

# A run_media dispatch gets its own group: cancelling it after launch-runners
# would strand its EC2 runners until their 4h self-destruct.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.run_media && format('-media-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rc-tag:
    # Only a qa push is a candidate; a dispatch (e.g. a media run on dev) must
    # not mint an rc tag.
    if: github.event_name == 'push' && github.ref_name == 'qa'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Stamp the next rc
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$v" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          n=$(git tag -l "v$v-rc*" | sed "s|^v$v-rc||" | sort -n | tail -1)
          tag="v$v-rc$(( ${n:-0} + 1 ))"
          git tag "$tag"
          git push origin "$tag"
          echo "### Candidate \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  release-tests:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
        # CLI build, then the app build.
        features: ['', '--features gui']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n
          self: freemkv
      - name: Install GTK4 + libadwaita development headers (Linux app)
        if: runner.os == 'Linux' && matrix.features != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
          key: ${{ matrix.features == '' && 'cli' || 'app' }}
      - run: cargo test --release --tests ${{ matrix.features }}
        working-directory: freemkv

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n
          self: freemkv
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - run: cargo build --release --tests
        working-directory: freemkv
      - run: cargo build --release --tests --features gui
        working-directory: freemkv
      # The release installer, compiled and round-tripped here so a broken
      # freemkv.iss fails qa instead of the tag build (steps mirror release.yml).
      - run: cargo build --release --features gui
        working-directory: freemkv
      - name: Build the installer
        shell: pwsh
        working-directory: freemkv
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target/release/freemkv-gui.exe stage/freemkv.exe
          Copy-Item target/release/freemkv.exe stage/freemkv.com
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.4.3 -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" "/DBinDir=$((Resolve-Path stage).Path)" "/O$PWD" packaging/windows/freemkv.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc exited $LASTEXITCODE" }
          if (-not (Test-Path freemkv-x86_64-windows-setup.exe)) { throw "freemkv-x86_64-windows-setup.exe was not built" }
      - name: Round-trip the installer
        shell: pwsh
        working-directory: freemkv
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\freemkv"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\freemkv.lnk"
          $aumid = 'org.freemkv.FreeMKV'
          $aumidKey = "HKCU:\Software\Classes\AppUserModelId\$aumid"
          $userPath = { [Environment]::GetEnvironmentVariable('Path', 'User') }
          Start-Process -Wait ./freemkv-x86_64-windows-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          foreach ($f in 'freemkv.exe','freemkv.com','unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "installer did not create $dir\$f" }
          }
          if ((& $userPath) -split ';' -notcontains $dir) { throw "installer did not add $dir to the user PATH" }
          if (-not (Test-Path $lnk)) { throw "installer did not create $lnk" }
          $item = (New-Object -ComObject Shell.Application).NameSpace((Split-Path $lnk)).ParseName((Split-Path $lnk -Leaf))
          $got = $item.ExtendedProperty('System.AppUserModel.ID')
          if ($got -ne $aumid) { throw "Start-menu shortcut AppUserModelID is '$got', want $aumid" }
          if (-not (Test-Path $aumidKey)) { throw "installer did not register $aumidKey" }
          & "$dir\freemkv.com" --version
          if ($LASTEXITCODE -ne 0) { throw "installed freemkv.com --version exited $LASTEXITCODE" }
          Start-Process -Wait "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          # The uninstaller relaunches itself from %TEMP%, so -Wait can return early.
          $done = { -not (Test-Path "$dir\freemkv.exe") -and ((& $userPath) -split ';' -notcontains $dir) }
          for ($i = 0; $i -lt 60 -and -not (& $done); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\freemkv.exe") { throw "uninstaller left $dir\freemkv.exe" }
          if ((& $userPath) -split ';' -contains $dir) { throw "uninstaller left $dir on the user PATH" }
          if (Test-Path $lnk) { throw "uninstaller left $lnk" }
          if (Test-Path $aumidKey) { throw "uninstaller left $aumidKey" }

  cli-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: freemkv
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n
          self: freemkv
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - name: Install ffmpeg and python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            brew install ffmpeg
          fi
      # The CLI build: cli-parity expects a bare `freemkv` to print usage.
      - run: cargo build --release --bin freemkv
        working-directory: freemkv
      - run: tests/cli-parity.sh check
        working-directory: freemkv
      - run: tests/cli-integration.sh
        working-directory: freemkv

  launch-runners:
    needs: [release-tests, windows-build, cli-integration]
    if: github.event_name == 'workflow_dispatch' && inputs.run_media
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [linux, windows]
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.FMKV_RUNNER_ROLE }}
          aws-region: us-west-2
      - name: Mint a registration token and stash it in SSM (SecureString)
        id: reg
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          tok=$(gh api -X POST "repos/${{ github.repository }}/actions/runners/registration-token" -q .token)
          echo "::add-mask::$tok"
          param="/freemkv-ci/runner-reg/${{ github.run_id }}-${{ matrix.os }}"
          aws ssm put-parameter --name "$param" --type SecureString --value "$tok" --overwrite >/dev/null
          echo "param=$param" >> "$GITHUB_OUTPUT"
      - name: Launch the ephemeral runner
        run: |
          set -euo pipefail

          if [ "${{ matrix.os }}" = "windows" ]; then
            vpc=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
            subnet=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" --query 'Subnets[0].SubnetId' --output text)
            aws ec2 run-instances \
              --launch-template LaunchTemplateName=freemkv-runner-${{ matrix.os }} \
              --subnet-id "$subnet" \
              --tag-specifications "ResourceType=instance,Tags=[
                  {Key=freemkv-ci,Value=runner},
                  {Key=runner-token-param,Value=${{ steps.reg.outputs.param }}},
                  {Key=runner-repo,Value=${{ github.repository }}},
                  {Key=launched-by,Value=${{ github.run_id }}}]" \
              --query 'Instances[0].InstanceId' --output text
            exit 0
          fi


          vpc=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          subnets=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" \
                      --query 'Subnets[].SubnetId' --output text)
          [ -n "$subnets" ] || { echo "no subnets in default VPC $vpc" >&2; exit 1; }

          types="c7i.4xlarge c6i.4xlarge m7i.4xlarge"

          tags="ResourceType=instance,Tags=[
              {Key=freemkv-ci,Value=runner},
              {Key=runner-token-param,Value=${{ steps.reg.outputs.param }}},
              {Key=runner-repo,Value=${{ github.repository }}},
              {Key=launched-by,Value=${{ github.run_id }}}]"

          try_launch() {
            local market="$1"; shift
            local t s id
            for t in $types; do
              for s in $subnets; do
                echo "attempt: type=$t subnet=$s market=$market"
                if id=$(aws ec2 run-instances \
                          --launch-template LaunchTemplateName=freemkv-runner-linux \
                          --instance-type "$t" \
                          --subnet-id "$s" \
                          "$@" \
                          --tag-specifications "$tags" \
                          --query 'Instances[0].InstanceId' --output text 2>launch.err); then
                  echo "$id"
                  echo "launched $id (linux, type=$t subnet=$s market=$market)"
                  return 0
                fi
                echo "  failed ($t/$s/$market): $(cat launch.err)"
                if ! grep -qiE 'InsufficientInstanceCapacity|Unsupported|InsufficientHostCapacity|capacity|SpotMaxPriceTooLow' launch.err; then
                  echo "non-capacity error — not retrying further" >&2
                  return 2
                fi
              done
            done
            return 1
          }

          rc=0
          try_launch spot --instance-market-options 'MarketType=spot' || rc=$?
          [ "$rc" = 0 ] && exit 0
          if [ "$rc" = 2 ]; then
            echo "::error title=Runner launch failed::a non-capacity error launching the linux media runner — see the failure above" >&2
            exit 1
          fi

          echo "all Spot attempts hit capacity — falling back to On-Demand"
          rc=0
          try_launch on-demand --instance-market-options '{}' || rc=$?
          [ "$rc" = 0 ] && exit 0
          echo "::error title=No capacity::every instance type × subnet failed as both Spot and On-Demand in us-west-2 — check service quotas / capacity in the region" >&2
          exit 1
      # No instance will consume the registration token: delete it rather than leave it in SSM.
      - name: Delete the unused registration token
        if: (failure() || cancelled()) && steps.reg.outputs.param != ''
        env:
          PARAM: ${{ steps.reg.outputs.param }}
        run: aws ssm delete-parameter --name "$PARAM" || true

  cli-matrix:
    needs: [launch-runners]
    if: github.event_name == 'workflow_dispatch' && inputs.run_media
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        # The targets release.yml ships the CLI for. Building the host gnu
        # target instead pulled in GTK (glib-sys) on Linux; on musl it is
        # cfg'd out.
        include:
          - os: linux
            target: x86_64-unknown-linux-musl
          - os: windows
            target: x86_64-pc-windows-msvc
    runs-on: [self-hosted, freemkv-media, "${{ matrix.os }}"]
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { path: freemkv }
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-engine freemkv-keysources freemkv-i18n freemkv-unlock
          patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n
          self: freemkv
          ref: "${{ github.ref_name == 'dev' && 'dev' || 'qa' }}"
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-ci
          ref: 7ff716072c7063aaf4f1a7dd7200f532dab77794
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}
          persist-credentials: false
          path: ci
      - name: Record the libfreemkv sha
        shell: bash
        run: echo "LF_SHA=$(git -C libfreemkv rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3
          else
            choco install ffmpeg python3 -y --no-progress
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          fi
          command -v ffprobe >/dev/null || {
            echo "::error title=ffprobe missing::the acceptance suite verifies every output with ffprobe; without it the run would only be checking exit codes"
            exit 1
          }
          ffprobe -version | head -1
          if [ "${{ matrix.os }}" = "windows" ]; then
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
            for d in /c/Python3*/; do
              if [ -x "${d}python.exe" ]; then
                echo "${d%/}" >> "$GITHUB_PATH"
                export PATH="$PATH:${d%/}"
              fi
            done
          fi
          PY=$(command -v python3 || command -v python || ls /c/Python3*/python.exe 2>/dev/null | head -1 || true)
          if [ -z "$PY" ] || ! "$PY" -c 'import sys; sys.exit(0 if sys.version_info[0] == 3 else 1)'; then
            echo "::error title=python 3 missing::the acceptance suite analyses every output timeline with a python program; without it the timeline checks would not run"
            exit 1
          fi
          echo "FMKV_PYTHON=$PY" >> "$GITHUB_ENV"
          "$PY" --version
      - name: Provision the build toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows" ]; then
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            have_vc=
            if [ -x "$vswhere" ]; then
              have_vc=$("$vswhere" -latest -products '*' \
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
                -property installationPath 2>/dev/null || true)
            fi
            if [ -z "$have_vc" ]; then
              choco install -y visualstudio2022buildtools --no-progress
              choco install -y visualstudio2022-workload-vctools --no-progress
            fi
          else
            # musl-tools: ring and mimalloc compile C for the musl target.
            sudo apt-get install -y -qq build-essential curl musl-tools
          fi
          # One pinned toolchain: freemkv's rust-version, as release-orchestrate
          # uses. Any rustup failure fails the job; never fall back to the AMI's.
          V=$(sed -n -E 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' freemkv/Cargo.toml | head -1)
          [ -n "$V" ] || { echo "::error::could not read rust-version from freemkv/Cargo.toml"; exit 1; }
          if [ "${{ matrix.os }}" = "windows" ]; then
            cargo_bin="$(cygpath -u "$USERPROFILE")/.cargo/bin"
          else
            cargo_bin="$HOME/.cargo/bin"
          fi
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$cargo_bin/rustup" ] && [ ! -x "$cargo_bin/rustup.exe" ]; then
            if [ "${{ matrix.os }}" = "windows" ]; then
              curl -sSf -o rustup-init.exe https://win.rustup.rs/x86_64
              ./rustup-init.exe -y --profile minimal --default-toolchain none \
                --default-host x86_64-pc-windows-msvc
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none
            fi
          fi
          # POSIX form for $GITHUB_PATH: a C:\ entry is split on its drive-letter
          # colon when Git-Bash re-parses PATH for the next step.
          export PATH="$cargo_bin:$PATH"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          rustup toolchain install "$V" --profile minimal --target "${{ matrix.target }}"
          echo "RUSTUP_TOOLCHAIN=$V" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$V" rustc --version
      # Catches the gui feature's crates leaking into the CLI build.
      - name: The CLI build has no UI dependencies
        shell: bash
        working-directory: freemkv
        run: |
          set -euo pipefail
          tree=$(cargo tree -e normal,build --target "${{ matrix.target }}" --prefix none)
          ui=$(grep -E '^(gtk4|gdk4|libadwaita|glib-sys|gobject-sys|gio-sys|winsafe|windows|objc2-app-kit) ' \
                 <<<"$tree" | sed 's/ (\*)$//' | sort -u || true)
          if [ -n "$ui" ]; then
            echo "::error title=UI crates in the CLI build::the CLI must build without the gui feature's dependencies:"
            echo "$ui"
            exit 1
          fi
      - name: Build the CLI
        shell: bash
        working-directory: freemkv
        run: cargo build --release --target "${{ matrix.target }}" --bin freemkv
      - name: Fetch the four disc fixtures
        shell: bash
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION=us-west-2 AWS_REGION=us-west-2
          B="${{ secrets.FMKV_FIXTURES_BUCKET }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            ISO_DIR=$(cygpath -m "$(pwd)")/isos
          else
            ISO_DIR="$(pwd)/isos"
          fi
          mkdir -p isos
          echo "ISO_DIR=$ISO_DIR" >> "$GITHUB_ENV"
          if ! err=$(aws s3 cp "s3://$B/keydb.cfg" keydb.cfg --region us-west-2 --only-show-errors 2>&1); then
            echo "::error title=Key database download failed::could not fetch keydb.cfg from the fixtures bucket — the BD family cannot decrypt without it: ${err:-<no client output>}"
            exit 1
          fi
          if [ "${{ matrix.os }}" = "windows" ]; then
            echo "KEYDB_PATH=$(cygpath -m "$(pwd)")/keydb.cfg" >> "$GITHUB_ENV"
          else
            echo "KEYDB_PATH=$(pwd)/keydb.cfg" >> "$GITHUB_ENV"
          fi

          for f in dvd bd uhd hddvd; do
            sz=$(aws s3api head-object --bucket "$B" --key "$f.iso" --region us-west-2 \
                   --query ContentLength --output text)
            echo "::group::fetch $f.iso ($((sz/1024/1024/1024)) GiB)"
            if ! err=$(aws s3 cp "s3://$B/$f.iso" "isos/$f.iso" --region us-west-2 --only-show-errors 2>&1); then
              echo "::error title=Fixture download failed ($f)::could not fetch $f.iso from the Oregon bucket — check the runner's instance profile can read it: ${err:-<no client output>}"
              exit 1
            fi
            echo "::endgroup::"
          done
          df -h . | tail -1
      - name: Run the full CLI acceptance suite
        id: suite
        shell: bash
        env:
          FMKV_KEY_URL: ${{ secrets.FMKV_KEY_URL }}
          FMKV_KEY_AUTH: ${{ secrets.FMKV_KEY_AUTH }}
        run: |
          set +e -uo pipefail
          if [ -z "${FMKV_KEY_URL:-}" ] || [ -z "${FMKV_KEY_AUTH:-}" ]; then
            echo "::error title=Key service not configured::FMKV_KEY_URL / FMKV_KEY_AUTH are unset, so the AACS fixtures (bd, uhd) cannot decrypt. Set them as repo secrets. The DVD would still pass, because CSS needs no key — do not read a green DVD as evidence the keys work."
            exit 1
          fi

          BIN="$PWD/freemkv/target/${{ matrix.target }}/release/freemkv"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BIN="$(cygpath -m "$PWD")/freemkv/target/${{ matrix.target }}/release/freemkv.exe"
            export TMPDIR="$(cygpath -m "${RUNNER_TEMP}")"
          fi
          [ -x "${BIN%.exe}" ] || [ -x "$BIN" ] || {
            echo "::error title=CLI binary missing::expected a release build at $BIN"; exit 1; }

          chmod +x ci/scripts/cli-acceptance.sh || true
          FMKV_MEDIA_CHECKS="$PWD/freemkv/tests/media_checks.py" \
          FMKV_BIN="$BIN" \
          FMKV_DVD_ISO="$ISO_DIR/dvd.iso" \
          FMKV_BD_ISO="$ISO_DIR/bd.iso" \
          FMKV_UHD_ISO="$ISO_DIR/uhd.iso" \
          FMKV_HDDVD_ISO="$ISO_DIR/hddvd.iso" \
          FMKV_KEYDB="$KEYDB_PATH" \
          FMKV_HASHES="$PWD/cli-${{ matrix.os }}.txt" \
            bash ci/scripts/cli-acceptance.sh 2>&1 | tee "suite-${{ matrix.os }}.log"
          rc=${PIPESTATUS[0]}

          if [ "$rc" != 0 ]; then
            echo "── every failing check on ${{ matrix.os }} ──"
            grep -E '^  (FAIL|SKIP)' "suite-${{ matrix.os }}.log" || true
            echo "──"
          fi

          if [ "$rc" != 0 ]; then
            echo "::error title=CLI acceptance failed on ${{ matrix.os }}::the suite exited $rc — the FAIL/SKIP lines naming each check are in this step's log above"
          fi
          echo "libfreemkv=$LF_SHA" >> "cli-${{ matrix.os }}.txt"
          echo "── hashes recorded on ${{ matrix.os }} ──"
          cat "cli-${{ matrix.os }}.txt"
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "cli-matrix-${{ matrix.os }}"
          path: "cli-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "cli-suite-log-${{ matrix.os }}"
          path: "suite-${{ matrix.os }}.log"

  compare-cli-matrix:
    needs: [cli-matrix]
    if: always() && (github.event_name == 'workflow_dispatch' && inputs.run_media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "cli-matrix-*", path: hashes }
        continue-on-error: true
      - name: Linux and Windows must produce identical bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, collections

          arts, shas = collections.defaultdict(dict), {}
          files = sorted(glob.glob("hashes/*/cli-*.txt"))
          if not files:
              print("::error title=No hashes produced::neither leg of the CLI matrix "
                    "uploaded a hash file, so nothing was compared. Check whether the "
                    "EC2 runners registered at all.")
              sys.exit(1)

          for path in files:
              plat = os.path.basename(path)[len("cli-"):-len(".txt")]
              for line in open(path):
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("libfreemkv="):
                      shas[plat] = line.split("=", 1)[1]
                      continue
                  h, _, name = line.partition("  ")
                  arts[name.strip()][plat] = h

          plats = sorted({p for v in arts.values() for p in v})
          print("platforms:", ", ".join(plats) or "(none)")
          fail = False

          if len(set(shas.values())) > 1:
              print(f"::error title=Sibling shas differ::libfreemkv differs across the "
                    f"matrix ({shas}) — MUX_APP is stamped from it, so a byte comparison "
                    "would be meaningless. Pin the sibling refs.")
              fail = True

          EXPECTED = {"linux", "windows"}
          absent = sorted(EXPECTED - set(plats))
          if absent:
              print(f"::error title=Platform never reported::no hashes from "
                    f"{', '.join(absent)} — that leg was never compared, so this run "
                    "cannot claim cross-platform parity")
              fail = True

          for name in sorted(arts):
              by = arts[name]
              missing = sorted(EXPECTED - set(by))
              if len(set(by.values())) == 1 and not missing:
                  print(f"  OK    {name}")
              elif missing:
                  fail = True
                  print(f"::error title=Artifact missing on {','.join(missing)}::{name} "
                        f"was not produced on {', '.join(missing)} — it agrees where it "
                        "exists, but that platform is unproven for this output")
              else:
                  fail = True
                  print(f"::error title=Output differs::{name} DIFFERS across platforms:")
                  for p in sorted(by):
                      print(f"      {p:10} {by[p]}")

          print(f"\n{len(arts)} artifacts compared across {len(plats)} platforms")
          sys.exit(1 if fail else 0)
          PY
