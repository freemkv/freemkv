name: qa

# ── The qa gate: "is this production worth?" ────────────────────────────────
#
# dev -> qa -> main.
#
# `dev` is for committing often. ci.yml answers "is it green" in minutes with
# fmt, clippy and the unit suite, so a mistake surfaces while it is still cheap
# to fix. `qa` is the release-candidate branch, and THIS workflow is the claim
# that a commit is production worth: everything expensive that can run without
# physical media. `main` only ever receives a qa that went green here.
#
# Sibling repos are checked out at `qa`, NOT `dev`. A qa run that resolved its
# dependencies from dev tips would be validating a combination that is not the
# one being released, which is the exact failure this branch exists to prevent.
#
# What this gate CANNOT cover: `disc://` and real `iso://` need physical media,
# and no hosted runner has an optical drive or the image hoard. Those run on a
# self-hosted runner (see the media job at the end) and are the one leg that
# stays on hardware.
on:
  push:
    branches: [qa]
  workflow_dispatch:

jobs:
  # ── Name the candidate ────────────────────────────────────────────────
  #
  # Every push to `qa` is a release candidate, so every push gets a tag:
  # v<version>-rc<N>, N incrementing. That is the answer to "which build is on
  # qa right now, and is it the one I tested?" — a question that otherwise gets
  # answered from memory.
  #
  # This runs FIRST and does not depend on the gates, deliberately. A red
  # candidate needs a name more than a green one does: "rc3 failed
  # release-tests on windows" is a sentence you can act on; "qa is red" is not.
  # Red on qa is a working gate, not an incident — it is the branch saying this
  # is not production worth yet. Fix on dev, get dev green, push qa again.
  #
  # release.yml excludes v*-rc* so a candidate never publishes a release.
  rc-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Stamp the next rc
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$v" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          # Numeric sort on the rc ordinal: -rc10 must beat -rc9, and a plain
          # lexical sort gets that backwards from the tenth candidate on.
          n=$(git tag -l "v$v-rc*" | sed "s|^v$v-rc||" | sort -n | tail -1)
          tag="v$v-rc$(( ${n:-0} + 1 ))"
          git tag "$tag"
          git push origin "$tag"
          echo "### Candidate \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  # The debug suite runs on every dev push. Release is a DIFFERENT build:
  # overflow checks are off, debug_assert! is compiled out, and inlining
  # changes what the optimiser can prove. A test that only passes in debug is
  # a test that never guarded the binary anyone actually ships.
  release-tests:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: qa
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: qa
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: qa
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: qa
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: qa
          path: freemkv-unlock
      - name: Resolve siblings from their qa tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo test --release --tests
        working-directory: freemkv

  # clippy's output is target-dependent: cfg-gated code only gets linted on
  # the target it compiles for. Linting solely on the dev machine's host
  # target is how a lint that CI rejects reaches a push.
  cross-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: qa
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: qa
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: qa
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: qa
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: qa
          path: freemkv-unlock
      - name: Resolve siblings from their qa tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
        working-directory: freemkv

  # Windows compiles the tests but does not run them, matching the policy
  # ci.yml already set. The value here is codegen: the #[cfg(windows)] halves
  # of the SCSI transport and platform layers compile on no other runner, so
  # without this they are first built at release time.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: qa
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: qa
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: qa
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: qa
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: qa
          path: freemkv-unlock
      - name: Resolve siblings from their qa tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo build --release --tests
        working-directory: freemkv

  # ── The real-media gate ───────────────────────────────────────────────
  #
  # Everything above runs on hosted runners and cannot touch a disc image.
  # This job runs the ~70-check acceptance suite against the actual ISO hoard,
  # which is the only thing that has ever caught this project's worst defects:
  # a CSS false positive that silently destroyed a DVD's title table, and
  # multi-clip A/V drift. Both were invisible to every hardware-free check.
  #
  # It needs a self-hosted runner labelled `freemkv-media` on a host that has
  # the hoard mounted. See .github/QA.md for the registration command; the
  # runner also needs a keydb and, for the UHD family, the online key service
  # credentials — without those that family SKIPS, which the suite reports as a
  # named gap rather than a pass.
  #
  # The suite itself lives in the private repo (it needs the hoard and key
  # material), and the runner can reach Gitea, so it is cloned rather than
  # vendored.
  real-media:
    # Run only when the runner is actually configured.
    #
    # A job with no runner does not fail — it QUEUES, for up to 24 hours, and a
    # queued job keeps the whole workflow "in progress". release.sh's CI gate
    # reads every run for the commit and refuses while any is queued, so an
    # unregistered runner does not just skip this check: it blocks every
    # release, indefinitely, with no error anywhere. That is what it did.
    #
    # `timeout-minutes` does NOT fix this — it bounds execution, not queue time.
    # Gating on the repo variable does: unconfigured, the job is skipped and the
    # workflow completes; configured, it runs exactly as before. The variable is
    # the one this job cannot work without, so it is the honest condition.
    #
    # AND only on a PUSH. These repos are public and this runner holds the key
    # database, so a job a fork could trigger is a job that can walk away with
    # AACS key material. A fork cannot push to this branch, so keying on the
    # event — not on approval settings someone can relax later — is what makes
    # that unreachable.
    #
    # ORDERING: this is the most expensive thing the gate runs, so it runs
    # LAST. `needs` is not decoration here — it is the cost control. Nothing
    # touches real media until lint, the unit suites, the cross-lint, the
    # Windows build and the synthetic CLI matrix have all gone green, so a
    # typo cannot burn a 90-minute rip.
    needs: [release-tests, cross-lint, windows-build, cli-integration]
    if: vars.FMKV_ACCEPTANCE != '' && github.event_name == 'push'
    #
    # `freemkv-lan`, NOT `freemkv-media`. This job needs a PRE-PROVISIONED box:
    # the acceptance suite at a fixed path, the ISO hoard mounted, and reach to
    # the private repo on LAN Gitea. An ephemeral EC2 runner has none of those.
    #
    # They shared the `freemkv-media` label for exactly one run, and an EC2
    # runner immediately grabbed this job and failed on
    # `acceptance suite not found at /opt/freemkv-acceptance/cli-acceptance.sh`
    # — a job stolen by a runner that could never satisfy it. The label now
    # names the requirement (a LAN host) rather than the workload (media), so
    # the two cannot collide again.
    runs-on: [self-hosted, freemkv-lan]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: qa
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: qa
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: qa
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: qa
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: qa
          path: freemkv-unlock
      - name: Resolve siblings from their qa tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.97.0
      # The step below hands the suite an explicit FMKV_BIN, which suppresses
      # the build the suite would otherwise do for itself -- so without this,
      # it is handed a path nothing ever produced and dies on "binary not
      # executable" before running a single case.
      - name: Build the CLI the suite will drive
        shell: bash
        working-directory: freemkv
        run: cargo build --release --bin freemkv
      - name: Real-media acceptance
        shell: bash
        env:
          FMKV_ISO_ROOT: ${{ vars.FMKV_ISO_ROOT }}
          FMKV_KEYDB: ${{ vars.FMKV_KEYDB }}
          FMKV_KEY_URL: ${{ secrets.FMKV_KEY_URL }}
          FMKV_KEY_AUTH: ${{ secrets.FMKV_KEY_AUTH }}
          ACCEPTANCE: ${{ vars.FMKV_ACCEPTANCE }}
        run: |
          # The suite lives ON THE RUNNER, provisioned out of band, and is
          # named by a repo variable. It is deliberately NOT cloned here: this
          # file is public, and naming the repository or host it comes from
          # would put internal infrastructure into a public workflow, which the
          # leak guard correctly refuses.
          test -x "$ACCEPTANCE" || {
            echo "::error::acceptance suite not found at '$ACCEPTANCE' - set the FMKV_ACCEPTANCE repo variable to its path on the runner"
            exit 2
          }
          FMKV_BIN="$PWD/freemkv/target/release/freemkv" bash "$ACCEPTANCE"

  # ── The CLI surface, end to end ───────────────────────────────────────
  #
  # tests/cli-integration.sh generates its own Blu-ray-legal media with ffmpeg
  # and then drives every file-reachable CLI function, verifying output with
  # ffprobe rather than trusting an exit code. This is the check that would
  # have caught a sink silently writing the wrong thing while returning 0.
  #
  # It needs no hardware, so it belongs here rather than on the hardware
  # checklist where it previously sat as a manual step.
  cli-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: qa
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: qa
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: qa
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: qa
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: qa
          path: freemkv-unlock
      - name: Resolve siblings from their qa tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - name: Install ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            brew install ffmpeg
          fi
      # Two legs, both hardware-free, both previously manual pre-release steps
      # — the kind that get skipped precisely when a release is being rushed.
      #
      # cli-parity is a golden-master characterization: a matrix of invocations
      # whose exit code, stdout and stderr are captured, normalized to strip the
      # version stamp and paths, and diffed against a recorded golden. It
      # catches the CLI contract changing by accident.
      #
      # cli-integration generates its own Blu-ray-legal media with ffmpeg and
      # verifies the output with ffprobe rather than trusting an exit code. It
      # is the check that catches a sink writing the wrong thing while
      # returning 0 — which is exactly how a defect reached a release.
      # cli-integration.sh builds the binary itself; cli-parity.sh does not —
      # it checks for one and exits 2 with "build it first". Build once here so
      # both legs share it and neither depends on the other's side effects.
      - run: cargo build --release --bin freemkv
        working-directory: freemkv
      - run: tests/cli-parity.sh check
        working-directory: freemkv
      - run: tests/cli-integration.sh
        working-directory: freemkv

  # ── Full-size media, on ephemeral EC2 ───────────────────────────────────────
  #
  # The one thing no hosted runner can do. GitHub's runners ship ~14 GB of disk
  # against a 35 GB Blu-ray and a 53 GB UHD, so the fixtures in `hash-matrix`
  # stop at a 6 GB DVD. These two jobs are the only reason EC2 exists here.
  #
  # They run LAST, behind everything cheap, for the same reason `real-media`
  # does: this is the leg that costs money per minute.
  #
  # macOS is deliberately absent. EC2 Mac is bare-metal-only and requires a
  # Dedicated Host with a 24-hour minimum allocation, so a 90-minute job bills
  # a full day and no teardown can avoid it. Hosted macOS already covers build,
  # test, the synthetic CLI matrix and the 6 GB real DVD — full-size media on
  # macOS is a known, accepted gap rather than a silent one.
  launch-full-media:
    needs: [release-tests, cross-lint, windows-build, cli-integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [linux, windows]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::457667483187:role/freemkv-ci-runners
          aws-region: us-west-2
      - name: Mint a single-use registration token
        id: reg
        env:
          # GITHUB_TOKEN cannot mint runner registration tokens: that needs
          # repo-admin, which it is never granted. Uses the PAT.
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          tok=$(gh api -X POST "repos/${{ github.repository }}/actions/runners/registration-token" -q .token)
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"
      - name: Launch the ephemeral runner
        run: |
          set -euo pipefail
          vpc=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          subnet=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" --query 'Subnets[0].SubnetId' --output text)
          aws ec2 run-instances \
            --launch-template LaunchTemplateName=freemkv-runner-${{ matrix.os }} \
            --subnet-id "$subnet" \
            --tag-specifications "ResourceType=instance,Tags=[
                {Key=freemkv-ci,Value=runner},
                {Key=runner-token,Value=${{ steps.reg.outputs.token }}},
                {Key=runner-repo,Value=${{ github.repository }}},
                {Key=launched-by,Value=${{ github.run_id }}}]" \
            --query 'Instances[0].InstanceId' --output text

  full-media:
    needs: launch-full-media
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: [self-hosted, freemkv-media, "${{ matrix.os }}"]
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { path: freemkv }
      - uses: actions/checkout@v7
        with: { repository: freemkv/libfreemkv,         ref: qa, path: libfreemkv }
      - uses: actions/checkout@v7
        with: { repository: freemkv/freemkv-engine,     ref: qa, path: freemkv-engine }
      - uses: actions/checkout@v7
        with: { repository: freemkv/freemkv-keysources, ref: qa, path: freemkv-keysources }
      - uses: actions/checkout@v7
        with: { repository: freemkv/freemkv-i18n,       ref: qa, path: freemkv-i18n }
      - uses: actions/checkout@v7
        with: { repository: freemkv/freemkv-unlock,     ref: qa, path: freemkv-unlock }
      - name: Point the patches at the sibling checkouts
        shell: bash
        run: |
          mkdir -p freemkv/.cargo
          cat > freemkv/.cargo/config.toml <<'CFG'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          CFG
      - name: Build the CLI
        shell: bash
        working-directory: freemkv
        run: cargo build --release --bin freemkv
      - name: Rip each fixture and hash it
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/freemkv/target/release/freemkv"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          out="full-${{ matrix.os }}.txt" ; : > "$out"
          # Smallest first: a break shows up on the 6 GB DVD in minutes rather
          # than after an hour of UHD.
          for f in dvd bd uhd; do
            aws s3 cp "s3://freemkv-fixtures-usw2-457667483187/$f.iso" "$f.iso" --quiet
            "$BIN" "iso://$f.iso" "mkv://$f-out.mkv"
            if command -v sha256sum >/dev/null; then H=$(sha256sum "$f-out.mkv" | cut -d' ' -f1)
            else H=$(shasum -a 256 "$f-out.mkv" | cut -d' ' -f1); fi
            printf '%s  %s-out.mkv\n' "$H" "$f" >> "$out"
            # Reclaim before the next one: all three together exceed the disk.
            rm -f "$f.iso" "$f-out.mkv"
          done
          cat "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-media-${{ matrix.os }}"
          path: "full-${{ matrix.os }}.txt"

  compare-full:
    needs: full-media
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "full-media-*", path: hashes }
      - name: Linux and Windows must agree byte for byte
        shell: bash
        run: |
          set -euo pipefail
          l=hashes/full-media-linux/full-linux.txt
          w=hashes/full-media-windows/full-windows.txt
          for f in "$l" "$w"; do
            [ -s "$f" ] || { echo "::error::$f missing or empty — a leg did not produce hashes"; exit 1; }
          done
          # Compare the hash column only: the filenames are identical by
          # construction, so any difference here is a real cross-platform
          # divergence in what the ripper produced.
          if diff <(cut -d' ' -f1 "$l") <(cut -d' ' -f1 "$w"); then
            echo "full-size media: linux and windows produced identical output"
          else
            echo "::error::full-size rips DIVERGED between linux and windows"
            exit 1
          fi
