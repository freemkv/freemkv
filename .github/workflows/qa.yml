name: qa

# ── The qa gate: "is this production worth?" ────────────────────────────────
#
# dev -> qa -> main.
#
# `dev` is for committing often. ci.yml answers "is it green" in minutes with
# fmt, clippy and the unit suite, so a mistake surfaces while it is still cheap
# to fix. `qa` is the release-candidate branch, and THIS workflow is the claim
# that a commit is production worth: everything expensive that can run without
# physical media. `main` only ever receives a qa that went green here.
#
# Sibling repos are checked out at `qa`, NOT `dev`. A qa run that resolved its
# dependencies from dev tips would be validating a combination that is not the
# one being released, which is the exact failure this branch exists to prevent.
#
# What this gate CANNOT cover: `disc://` and real `iso://` need physical media,
# and no hosted runner has the disk for a 53 GB UHD. Those run on ephemeral
# EC2 runners (see cli-matrix at the end), launched per run and torn down
# after one job.
on:
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      run_media:
        description: >-
          Also run the full-size media matrix on EC2 (~2h, real money).
          Off by default: a dispatch is usually someone re-running the cheap
          gates, and a push trigger for this is how a busy afternoon becomes a
          surprise bill. On, it is the only way to prove the media gate without
          promoting all eight repos to qa first.
        type: boolean
        default: false

jobs:
  # ── Name the candidate ────────────────────────────────────────────────
  #
  # Every push to `qa` is a release candidate, so every push gets a tag:
  # v<version>-rc<N>, N incrementing. That is the answer to "which build is on
  # qa right now, and is it the one I tested?" — a question that otherwise gets
  # answered from memory.
  #
  # This runs FIRST and does not depend on the gates, deliberately. A red
  # candidate needs a name more than a green one does: "rc3 failed
  # release-tests on windows" is a sentence you can act on; "qa is red" is not.
  # Red on qa is a working gate, not an incident — it is the branch saying this
  # is not production worth yet. Fix on dev, get dev green, push qa again.
  #
  # release.yml excludes v*-rc* so a candidate never publishes a release.
  rc-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Stamp the next rc
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$v" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          # Numeric sort on the rc ordinal: -rc10 must beat -rc9, and a plain
          # lexical sort gets that backwards from the tenth candidate on.
          n=$(git tag -l "v$v-rc*" | sed "s|^v$v-rc||" | sort -n | tail -1)
          tag="v$v-rc$(( ${n:-0} + 1 ))"
          git tag "$tag"
          git push origin "$tag"
          echo "### Candidate \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  # The debug suite runs on every dev push. Release is a DIFFERENT build:
  # overflow checks are off, debug_assert! is compiled out, and inlining
  # changes what the optimiser can prove. A test that only passes in debug is
  # a test that never guarded the binary anyone actually ships.
  release-tests:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: qa
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: qa
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: qa
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: qa
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: qa
          path: freemkv-unlock
      - name: Resolve siblings from their qa tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo test --release --tests
        working-directory: freemkv

  # clippy's output is target-dependent: cfg-gated code only gets linted on
  # the target it compiles for. Linting solely on the dev machine's host
  # target is how a lint that CI rejects reaches a push.
  cross-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: qa
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: qa
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: qa
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: qa
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: qa
          path: freemkv-unlock
      - name: Resolve siblings from their qa tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
        working-directory: freemkv

  # Windows compiles the tests but does not run them, matching the policy
  # ci.yml already set. The value here is codegen: the #[cfg(windows)] halves
  # of the SCSI transport and platform layers compile on no other runner, so
  # without this they are first built at release time.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: qa
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: qa
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: qa
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: qa
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: qa
          path: freemkv-unlock
      - name: Resolve siblings from their qa tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - run: cargo build --release --tests
        working-directory: freemkv

  cli-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: freemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/libfreemkv
          ref: qa
          path: libfreemkv
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-keysources
          ref: qa
          path: freemkv-keysources
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-engine
          ref: qa
          path: freemkv-engine
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-i18n
          ref: qa
          path: freemkv-i18n
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-unlock
          ref: qa
          path: freemkv-unlock
      - name: Resolve siblings from their qa tips
        shell: bash
        working-directory: freemkv
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv
      - name: Install ffmpeg and python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            brew install ffmpeg
          fi
      # Two legs, both hardware-free, both previously manual pre-release steps
      # — the kind that get skipped precisely when a release is being rushed.
      #
      # cli-parity is a golden-master characterization: a matrix of invocations
      # whose exit code, stdout and stderr are captured, normalized to strip the
      # version stamp and paths, and diffed against a recorded golden. It
      # catches the CLI contract changing by accident.
      #
      # cli-integration generates its own Blu-ray-legal media with ffmpeg and
      # verifies the output with ffprobe rather than trusting an exit code. It
      # is the check that catches a sink writing the wrong thing while
      # returning 0 — which is exactly how a defect reached a release.
      # cli-integration.sh builds the binary itself; cli-parity.sh does not —
      # it checks for one and exits 2 with "build it first". Build once here so
      # both legs share it and neither depends on the other's side effects.
      - run: cargo build --release --bin freemkv
        working-directory: freemkv
      - run: tests/cli-parity.sh check
        working-directory: freemkv
      - run: tests/cli-integration.sh
        working-directory: freemkv

  # ── Full-size media, on ephemeral EC2 ───────────────────────────────────────
  #
  # The one thing no hosted runner can do. GitHub's runners ship ~14 GB of disk
  # against a 35 GB Blu-ray and a 53 GB UHD, so the fixtures in `hash-matrix`
  # stop at a 6 GB DVD. These two jobs are the only reason EC2 exists here.
  #
  # They run LAST, behind everything cheap, for the same reason `real-media`
  # does: this is the leg that costs money per minute.
  #
  # macOS is deliberately absent. EC2 Mac is bare-metal-only and requires a
  # Dedicated Host with a 24-hour minimum allocation, so a 90-minute job bills
  # a full day and no teardown can avoid it. Hosted macOS already covers build,
  # test, the synthetic CLI matrix and the 6 GB real DVD — full-size media on
  # macOS is a known, accepted gap rather than a silent one.
  launch-runners:
    needs: [release-tests, cross-lint, windows-build, cli-integration]
    if: github.event_name == 'push' || inputs.run_media
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [linux, windows]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.FMKV_RUNNER_ROLE }}
          aws-region: us-west-2
      - name: Mint a single-use registration token
        id: reg
        env:
          # GITHUB_TOKEN cannot mint runner registration tokens: that needs
          # repo-admin, which it is never granted. Uses the PAT.
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          tok=$(gh api -X POST "repos/${{ github.repository }}/actions/runners/registration-token" -q .token)
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"
      - name: Launch the ephemeral runner
        run: |
          set -euo pipefail
          vpc=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          subnet=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" --query 'Subnets[0].SubnetId' --output text)
          aws ec2 run-instances \
            --launch-template LaunchTemplateName=freemkv-runner-${{ matrix.os }} \
            --subnet-id "$subnet" \
            --tag-specifications "ResourceType=instance,Tags=[
                {Key=freemkv-ci,Value=runner},
                {Key=runner-token,Value=${{ steps.reg.outputs.token }}},
                {Key=runner-repo,Value=${{ github.repository }}},
                {Key=launched-by,Value=${{ github.run_id }}}]" \
            --query 'Instances[0].InstanceId' --output text

  # ── The CLI matrix: every feature, both platforms, byte-identical ─────────
  #
  # This is the ONLY real-media gate. It replaced two jobs that overlapped and
  # a third that could never run:
  #
  #   - a LAN-only `real-media` job that ran the acceptance suite on a
  #     pre-provisioned box. It needed a host with the ISO hoard mounted, so it
  #     was gated behind a repo variable, and with that variable unset it
  #     SKIPPED every run — the suite that catches this project's worst defects
  #     was not running at all.
  #   - a `full-media` job that ripped three ISOs and hashed them. That is four
  #     of this suite's ~90 checks: it proved the mux, and nothing about the
  #     selection matrix, the format matrix, `dir://` sources or round-trips.
  #
  # Both are gone. The acceptance suite now runs HERE, on ephemeral EC2, on
  # Linux and Windows, and the two must produce identical hashes.
  #
  # macOS is deliberately absent, and it is the one gap in this gate: EC2 Mac
  # requires a Dedicated Host with a 24-hour minimum allocation, which is not
  # worth it per qa push. macOS parity is still covered on hosted runners by
  # hash-matrix.yml against synthetic and small-fixture media — what it does
  # not cover is full-size real discs.
  #
  # ORDERING: `needs` is the cost control, not decoration. This is by far the
  # most expensive thing the gate runs, so nothing touches real media until
  # lint, the unit suites, the cross-lint, the Windows build and the synthetic
  # CLI matrix are all green. A typo cannot burn a two-hour rip.
  cli-matrix:
    needs: launch-runners
    if: github.event_name == 'push' || inputs.run_media
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: [self-hosted, freemkv-media, "${{ matrix.os }}"]
    timeout-minutes: 240
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { path: freemkv }
      - uses: actions/checkout@v7
        with: { repository: freemkv/libfreemkv,         ref: "${{ github.ref_name == 'dev' && 'dev' || 'qa' }}", path: libfreemkv }
      - uses: actions/checkout@v7
        with: { repository: freemkv/freemkv-engine,     ref: "${{ github.ref_name == 'dev' && 'dev' || 'qa' }}", path: freemkv-engine }
      - uses: actions/checkout@v7
        with: { repository: freemkv/freemkv-keysources, ref: "${{ github.ref_name == 'dev' && 'dev' || 'qa' }}", path: freemkv-keysources }
      - uses: actions/checkout@v7
        with: { repository: freemkv/freemkv-i18n,       ref: "${{ github.ref_name == 'dev' && 'dev' || 'qa' }}", path: freemkv-i18n }
      - uses: actions/checkout@v7
        with: { repository: freemkv/freemkv-unlock,     ref: "${{ github.ref_name == 'dev' && 'dev' || 'qa' }}", path: freemkv-unlock }
      # The acceptance suite is not in this public repo — it names fixtures and
      # key sources. It lives in the private `freemkv-ci` repo, which exists
      # because Actions runners cannot reach the LAN Gitea host the scripts
      # used to live on. That unreachability is the whole reason the LAN job
      # this replaces could not be moved to EC2 before.
      - uses: actions/checkout@v7
        with:
          repository: freemkv/freemkv-ci
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}
          path: ci
      - name: Point the patches at the sibling checkouts
        shell: bash
        run: |
          mkdir -p freemkv/.cargo
          cat > freemkv/.cargo/config.toml <<'CFG'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          CFG
      - name: Record the libfreemkv sha
        shell: bash
        # MUX_APP carries libfreemkv's short sha, so two legs built from
        # different commits differ in output BYTES while being functionally
        # identical. The compare job refuses to judge a mismatch unless these
        # agree, rather than reporting a divergence that means nothing.
        run: echo "LF_SHA=$(git -C libfreemkv rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Install ffmpeg
        shell: bash
        # The suite verifies EVERY output with ffprobe — stream counts, clean
        # decode, audio actually present on the timeline. Without ffmpeg it
        # does not fail, it degrades into checking exit codes, which is the
        # failure mode this gate exists to prevent.
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3
          else
            choco install ffmpeg python3 -y --no-progress
            # choco writes the MACHINE PATH, which the already-running shell
            # does not see. Re-read it rather than assume — this exact thing
            # cost a full runner debug cycle with the AWS CLI.
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          fi
          command -v ffprobe >/dev/null || {
            echo "::error title=ffprobe missing::the acceptance suite verifies every output with ffprobe; without it the run would only be checking exit codes"
            exit 1
          }
          ffprobe -version | head -1
          # The suite's timeline analyser is a python program. This runner is
          # self-hosted, so it carries nothing a hosted image would have had:
          # the windows leg had no python at all, and every timeline check on
          # it produced an empty verdict, which the harness read as a pass. The
          # suite now refuses to run without an interpreter; install one, and
          # name it here rather than leaving it to a PATH search that finds the
          # Windows Store stub.
          if [ "${{ matrix.os }}" = "windows" ]; then
            # choco installs python3 into /c/PythonNNN where NNN floats with the
            # release (3.14 today; this was pinned to 3.13/3.12 and silently
            # missed a 3.14 box, aborting the whole windows leg). The shim it
            # drops is python3.NN.exe, never plain python3/python. Add whatever
            # /c/Python3* actually holds python.exe — for THIS step (export) and
            # the later ones ($GITHUB_PATH) — plus the choco shim dir.
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
            for d in /c/Python3*/; do
              if [ -x "${d}python.exe" ]; then
                echo "${d%/}" >> "$GITHUB_PATH"
                export PATH="$PATH:${d%/}"
              fi
            done
          fi
          PY=$(command -v python3 || command -v python || ls /c/Python3*/python.exe 2>/dev/null | head -1 || true)
          if [ -z "$PY" ] || ! "$PY" -c 'import sys; sys.exit(0 if sys.version_info[0] == 3 else 1)'; then
            echo "::error title=python 3 missing::the acceptance suite analyses every output timeline with a python program; without it the timeline checks would not run"
            exit 1
          fi
          echo "FMKV_PYTHON=$PY" >> "$GITHUB_ENV"
          "$PY" --version
      - name: Provision the build toolchain
        shell: bash
        # The media runner is self-hosted and ephemeral; like ffmpeg and python
        # above, it carries no build toolchain — the build step below was failing
        # with `cargo: command not found` (exit 127), and a bare runner also lacks
        # the C compiler/linker the build needs (rustc's linker driver + ring's C
        # backend on both OSes; MSVC link.exe on windows). Provision per-run rather
        # than depend on a hand-baked AMI, so the acceptance build reproduces on any
        # contributor's runner. Every install is idempotent/guarded — a no-op when
        # the AMI already provided it.
        run: |
          set -euo pipefail
          # ── Native C toolchain + linker ──────────────────────────────────────
          if [ "${{ matrix.os }}" = "windows" ]; then
            # The build targets x86_64-pc-windows-msvc (what the release ships and
            # what build.rs's manifest/icon path assumes). rustup installs RUST, not
            # a linker: a bare Windows Server AMI has no link.exe/Windows SDK, so
            # `cargo build` dies with `linking with link.exe failed`, and ring needs
            # cl.exe. rustc locates MSVC via vswhere (no PATH help needed). Gate on a
            # vswhere probe so this is a no-op when the AMI already has VS Build Tools.
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            have_vc=
            if [ -x "$vswhere" ]; then
              have_vc=$("$vswhere" -latest -products '*' \
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
                -property installationPath 2>/dev/null || true)
            fi
            if [ -z "$have_vc" ]; then
              choco install -y visualstudio2022buildtools --no-progress
              choco install -y visualstudio2022-workload-vctools --no-progress
            fi
          else
            # rustc's default linker driver is `cc` and ring compiles C, so gcc + ld
            # are mandatory; curl bootstraps rustup. Idempotent (apt lists already
            # refreshed by the ffmpeg step earlier in this job).
            sudo apt-get install -y -qq build-essential curl
          fi
          # ── Rust, pinned to the CI toolchain. A runner whose baked AMI carries an
          # older default (e.g. 1.97.x) must still be pinned to the bins' 1.98 MSRV,
          # so install+default 1.98.0 even when cargo is already present. ──────────
          if command -v cargo >/dev/null 2>&1; then
            cargo --version
            rustup toolchain install 1.98.0 --profile minimal 2>/dev/null || true
            rustup default 1.98.0 2>/dev/null || true
          elif [ "${{ matrix.os }}" = "windows" ]; then
            curl -sSf -o rustup-init.exe https://win.rustup.rs/x86_64
            ./rustup-init.exe -y --profile minimal --default-toolchain 1.98.0 \
              --default-host x86_64-pc-windows-msvc
            # POSIX form for $GITHUB_PATH, matching the /c/... entries the ffmpeg and
            # python steps already write. A C:\Users\...\bin entry gets split on its
            # drive-letter colon when Git-Bash re-parses PATH for the next step.
            echo "$(cygpath -u "$USERPROFILE")/.cargo/bin" >> "$GITHUB_PATH"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.98.0
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Build the CLI
        shell: bash
        working-directory: freemkv
        run: cargo build --release --bin freemkv
      - name: Fetch the four disc fixtures
        shell: bash
        # One of each family: DVD/CSS, Blu-ray/AACS v1, UHD/AACS 2.0, HD-DVD.
        # ~121 GiB, held for the whole run rather than fetched-and-deleted per
        # rip, because the format/selection/dir:// groups revisit them. The
        # launch templates carry 600 GB for exactly this.
        run: |
          set -euo pipefail
          # The bucket is in us-west-2 and the runner's apt `awscli` is the v1
          # client, which does NOT read the instance's region from IMDS for an
          # `s3 cp` — with no region it hits the wrong endpoint and burns the
          # retry budget on a redirect before failing with a masked error. The
          # head-object calls below already pass --region for exactly this;
          # setting it for the whole step covers the cp calls too, on any client.
          export AWS_DEFAULT_REGION=us-west-2 AWS_REGION=us-west-2
          B="${{ secrets.FMKV_FIXTURES_BUCKET }}"
          # Windows: the freemkv binary is a NATIVE build and cannot resolve an
          # MSYS path like /d/a/iso. `cygpath -m` yields C:/... , which Git-bash
          # and the native binary both accept — so one variable works for both.
          if [ "${{ matrix.os }}" = "windows" ]; then
            ISO_DIR=$(cygpath -m "$(pwd)")/isos
          else
            ISO_DIR="$(pwd)/isos"
          fi
          mkdir -p isos
          echo "ISO_DIR=$ISO_DIR" >> "$GITHUB_ENV"
          # The key database, alongside the discs. BOTH key sources are
          # configured, because that is what a real user has and because
          # neither covers everything on its own: the online service had no
          # key for the Blu-ray fixture (E7022, disc id 20312DAD...), which
          # this keydb does hold, and the keydb has no entry for the UHD
          # fixture, which the service serves. One source alone means a
          # permanently skipped family — and with a service configured a skip
          # is now a failure, correctly.
          if ! err=$(aws s3 cp "s3://$B/keydb.cfg" keydb.cfg --region us-west-2 --only-show-errors 2>&1); then
            echo "::error title=Key database download failed::could not fetch keydb.cfg from the fixtures bucket — the BD family cannot decrypt without it: ${err:-<no client output>}"
            exit 1
          fi
          if [ "${{ matrix.os }}" = "windows" ]; then
            echo "KEYDB_PATH=$(cygpath -m "$(pwd)")/keydb.cfg" >> "$GITHUB_ENV"
          else
            echo "KEYDB_PATH=$(pwd)/keydb.cfg" >> "$GITHUB_ENV"
          fi

          for f in dvd bd uhd hddvd; do
            sz=$(aws s3api head-object --bucket "$B" --key "$f.iso" --region us-west-2 \
                   --query ContentLength --output text)
            echo "::group::fetch $f.iso ($((sz/1024/1024/1024)) GiB)"
            if ! err=$(aws s3 cp "s3://$B/$f.iso" "isos/$f.iso" --region us-west-2 --only-show-errors 2>&1); then
              echo "::error title=Fixture download failed ($f)::could not fetch $f.iso from the Oregon bucket — check the runner's instance profile can read it: ${err:-<no client output>}"
              exit 1
            fi
            echo "::endgroup::"
          done
          df -h . | tail -1
      - name: Run the full CLI acceptance suite
        id: suite
        shell: bash
        env:
          # The same online key service autorip ships with by default, so CI
          # tests the configuration users actually have. The fixtures are real
          # retail discs: CSS (DVD) cracks keylessly, AACS (BD/UHD) does not.
          FMKV_KEY_URL: ${{ secrets.FMKV_KEY_URL }}
          FMKV_KEY_AUTH: ${{ secrets.FMKV_KEY_AUTH }}
        run: |
          set -uo pipefail
          # Fail EARLY and BY NAME on a missing secret. Without this the run
          # gets six minutes in, rips the DVD fine (CSS needs no key), and only
          # then reports a key error on the Blu-ray — which reads like a media
          # defect rather than an unset secret.
          if [ -z "${FMKV_KEY_URL:-}" ] || [ -z "${FMKV_KEY_AUTH:-}" ]; then
            echo "::error title=Key service not configured::FMKV_KEY_URL / FMKV_KEY_AUTH are unset, so the AACS fixtures (bd, uhd) cannot decrypt. Set them as repo secrets. The DVD would still pass, because CSS needs no key — do not read a green DVD as evidence the keys work."
            exit 1
          fi

          BIN="$PWD/freemkv/target/release/freemkv"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BIN="$(cygpath -m "$PWD")/freemkv/target/release/freemkv.exe"
            # $WORK comes from mktemp under $TMPDIR; give it a mixed path too,
            # or the suite hands the native binary an MSYS path it cannot open.
            export TMPDIR="$(cygpath -m "${RUNNER_TEMP}")"
          fi
          [ -x "${BIN%.exe}" ] || [ -x "$BIN" ] || {
            echo "::error title=CLI binary missing::expected a release build at $BIN"; exit 1; }

          chmod +x ci/scripts/cli-acceptance.sh || true
          FMKV_BIN="$BIN" \
          FMKV_DVD_ISO="$ISO_DIR/dvd.iso" \
          FMKV_BD_ISO="$ISO_DIR/bd.iso" \
          FMKV_UHD_ISO="$ISO_DIR/uhd.iso" \
          FMKV_HDDVD_ISO="$ISO_DIR/hddvd.iso" \
          FMKV_KEYDB="$KEYDB_PATH" \
          FMKV_HASHES="$PWD/cli-${{ matrix.os }}.txt" \
            bash ci/scripts/cli-acceptance.sh 2>&1 | tee "suite-${{ matrix.os }}.log"
          rc=${PIPESTATUS[0]}

          # The suite's own FAIL/SKIP lines are the diagnosis, and a step log
          # is NOT readable until the whole RUN completes — so while a matrix
          # sibling is still ripping, the failed leg's reason is unreachable
          # for another hour. Artifacts upload immediately, so the transcript
          # goes out as one, and the failing lines are echoed below as well.
          if [ "$rc" != 0 ]; then
            echo "── every failing check on ${{ matrix.os }} ──"
            grep -E '^  (FAIL|SKIP)' "suite-${{ matrix.os }}.log" || true
            echo "──"
          fi

          # The suite's own summary already names each FAIL and each unexpected
          # SKIP. Add the one line that says which LEG this was, so a red run in
          # a two-platform matrix does not require opening both to find out.
          if [ "$rc" != 0 ]; then
            echo "::error title=CLI acceptance failed on ${{ matrix.os }}::the suite exited $rc — the FAIL/SKIP lines naming each check are in this step's log above"
          fi
          echo "libfreemkv=$LF_SHA" >> "cli-${{ matrix.os }}.txt"
          echo "── hashes recorded on ${{ matrix.os }} ──"
          cat "cli-${{ matrix.os }}.txt"
          exit $rc
      # `always()`: a leg that FAILED still produced artifacts, and those are
      # exactly the ones worth comparing — "windows diverged" is the more
      # useful sentence when windows is also the leg that went red.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "cli-matrix-${{ matrix.os }}"
          path: "cli-${{ matrix.os }}.txt"
      # Separate artifact, always: this is the one thing that makes a failed
      # leg diagnosable while the other leg is still running.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "cli-suite-log-${{ matrix.os }}"
          path: "suite-${{ matrix.os }}.log"

  compare-cli-matrix:
    needs: cli-matrix
    if: always() && (github.event_name == 'push' || inputs.run_media)
    runs-on: ubuntu-latest
    steps:
      # continue-on-error: with no matching artifact this action FAILS, which
      # would replace the diagnostic below ("neither leg uploaded a hash file,
      # check whether the runners registered") with a generic download error —
      # burying the actual cause in exactly the case it matters most.
      - uses: actions/download-artifact@v4
        with: { pattern: "cli-matrix-*", path: hashes }
        continue-on-error: true
      - name: Linux and Windows must produce identical bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, collections

          arts, shas = collections.defaultdict(dict), {}
          files = sorted(glob.glob("hashes/*/cli-*.txt"))
          if not files:
              print("::error title=No hashes produced::neither leg of the CLI matrix "
                    "uploaded a hash file, so nothing was compared. Check whether the "
                    "EC2 runners registered at all.")
              sys.exit(1)

          for path in files:
              plat = os.path.basename(path)[len("cli-"):-len(".txt")]
              for line in open(path):
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("libfreemkv="):
                      shas[plat] = line.split("=", 1)[1]
                      continue
                  h, _, name = line.partition("  ")
                  arts[name.strip()][plat] = h

          plats = sorted({p for v in arts.values() for p in v})
          print("platforms:", ", ".join(plats) or "(none)")
          fail = False

          if len(set(shas.values())) > 1:
              print(f"::error title=Sibling shas differ::libfreemkv differs across the "
                    f"matrix ({shas}) — MUX_APP is stamped from it, so a byte comparison "
                    "would be meaningless. Pin the sibling refs.")
              fail = True

          # Name the platforms that MUST report rather than accepting whatever
          # turned up. A run where one leg died before writing hashes would
          # otherwise compare the survivor with itself, agree, and go green —
          # claiming parity having tested one, with the missing platform being
          # the one that failed and so the one most worth comparing.
          EXPECTED = {"linux", "windows"}
          absent = sorted(EXPECTED - set(plats))
          if absent:
              print(f"::error title=Platform never reported::no hashes from "
                    f"{', '.join(absent)} — that leg was never compared, so this run "
                    "cannot claim cross-platform parity")
              fail = True

          for name in sorted(arts):
              by = arts[name]
              missing = sorted(EXPECTED - set(by))
              if len(set(by.values())) == 1 and not missing:
                  print(f"  OK    {name}")
              elif missing:
                  fail = True
                  print(f"::error title=Artifact missing on {','.join(missing)}::{name} "
                        f"was not produced on {', '.join(missing)} — it agrees where it "
                        "exists, but that platform is unproven for this output")
              else:
                  fail = True
                  print(f"::error title=Output differs::{name} DIFFERS across platforms:")
                  for p in sorted(by):
                      print(f"      {p:10} {by[p]}")

          print(f"\n{len(arts)} artifacts compared across {len(plats)} platforms")
          sys.exit(1 if fail else 0)
          PY
