name: qa
run-name: qa ${{ inputs.dispatch_id || github.sha }}

# The release candidate gate. plan-media pins the candidate (the six rip-crate
# shas and one resolved lock, L_qa) for every job, and decides whether the
# full-disc EC2 matrix must run: it runs when the rip-affecting inputs have no
# green evidence (tests/media_gate.py, policy tests/media-gate-policy.json),
# and is reused otherwise. media-verdict is the one media answer.

on:
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      run_media:
        description: Run the full-disc EC2 matrix even when green evidence exists.
        type: boolean
        default: false
      skip_media:
        description: Skip the full-disc matrix. qa is red if it was required (unproven).
        type: boolean
        default: false
      skip_reason:
        description: Why the full-disc matrix is skipped (required with skip_media).
        type: string
        default: ''
      revisions:
        description: JSON of the six rip-crate shas to pin (promote passes it).
        type: string
        default: ''
      dispatch_id:
        description: Correlation id shown in the run name (promote passes it).
        type: string
        default: ''

# One group per candidate sha: a newer candidate is never cancelled by an older
# run, and a cancelled run tears down its own EC2 instances (launch teardown).
concurrency:
  group: qa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pins the candidate (C: six shas, one resolved lock), runs the
  # classification guards, fingerprints the rip-affecting inputs and decides:
  # reuse green evidence, or run the full-disc matrix.
  plan-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      run: ${{ steps.plan.outputs.run }}
      status: ${{ steps.plan.outputs.status }}
      reason: ${{ steps.plan.outputs.reason }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      revisions: ${{ steps.plan.outputs.revisions }}
      harness: ${{ steps.plan.outputs.harness }}
      launch_templates: ${{ steps.plan.outputs.launch_templates }}
      legs: ${{ steps.plan.outputs.legs }}
      evidence_url: ${{ steps.plan.outputs.evidence_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - name: Exact toolchain (freemkv rust-version)
        run: bash freemkv/.github/scripts/exact-toolchain.sh install freemkv/Cargo.toml
      - name: Pin the candidate
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.revisions }}
        run: python3 freemkv/tests/media_gate.py pin --workspace .
      # External inputs are fingerprinted too. A read failure is recorded, which
      # can only force a run (fail-safe), never reuse.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.FMKV_FIXTURES_ROLE }}
          aws-region: us-west-2
      - name: Pin the fixtures
        env:
          B: ${{ secrets.FMKV_FIXTURES_BUCKET }}
        run: python3 freemkv/tests/media_gate.py externals --part fixtures --bucket "$B" --out externals.json
      # Decision 15: the key service must still return the UHD fixture's key, proven by
      # decrypting the fixture's own ciphertext (tests/media_canary.py). It reads only the
      # AACS files and a few sample units of the pinned object (ranged GETs, the fixtures
      # role above). qa only, never dev; a failure or a missing result makes the plan
      # red ("canary-failed") before any EC2.
      - name: Key-service canary
        # The full ref: a dispatch on a TAG named qa has ref_name "qa" too.
        if: github.ref == 'refs/heads/qa'
        continue-on-error: true
        env:
          B: ${{ secrets.FMKV_FIXTURES_BUCKET }}
          FMKV_KEY_URL: ${{ secrets.FMKV_KEY_URL }}
          FMKV_KEY_AUTH: ${{ secrets.FMKV_KEY_AUTH }}
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/canary-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r freemkv/tests/media-fetch-requirements.txt
          "$venv/bin/python" freemkv/tests/media_canary.py --bucket "$B" --externals externals.json --out canary.json
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.FMKV_RUNNER_ROLE }}
          aws-region: us-west-2
      - name: Pin the launch templates
        run: python3 freemkv/tests/media_gate.py externals --part launch_templates --out externals.json
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REVISIONS: ${{ steps.pin.outputs.revisions }}
          SUPERSEDED: ${{ steps.pin.outputs.superseded }}
          RUN_MEDIA: ${{ inputs.run_media }}
          SKIP_MEDIA: ${{ inputs.skip_media }}
          SKIP_REASON: ${{ inputs.skip_reason }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 freemkv/tests/media_gate.py plan --workspace . --externals externals.json --canary canary.json --plan-directory media-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-plan
          path: media-plan
          retention-days: 90
          if-no-files-found: error
          overwrite: true
      # Decision 15, and so "Re-run failed jobs" re-runs the canary: a canary failure
      # fails this job (media-verdict still reports the plan's status and reason).
      - name: Key-service canary verdict
        if: steps.plan.outputs.status == 'canary-failed'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "::error title=Key-service canary failed::${REASON//::/: :}"
          exit 1

  rc-tag:
    # Only a qa push is a candidate; a dispatch (e.g. a media run on dev) must
    # not mint an rc tag.
    if: github.event_name == 'push' && github.ref_name == 'qa'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Stamp the next rc
        id: stamp
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$v" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          n=$(git tag -l "v$v-rc*" | sed "s|^v$v-rc||" | sort -n | tail -1)
          tag="v$v-rc$(( ${n:-0} + 1 ))"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Candidate \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  # The candidate's server image (the rip daemon + web UI), tagged rc-only so it can be
  # deployed and tested before release; :latest is never touched here. An rc tag cannot
  # trigger release.yml, so without this a candidate would have no image.
  rc-image:
    needs: rc-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push the rc image
        env:
          TAG: ${{ needs.rc-tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/server-image.sh "$TAG" qa

  release-tests:
    needs: [plan-media]
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
        # CLI build, then the app build.
        features: ['', '--features gui']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - name: Exact toolchain (freemkv rust-version)
        shell: bash
        run: bash freemkv/.github/scripts/exact-toolchain.sh install freemkv/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: media-plan, path: media-plan }
      # The six rip-crate shas and the one lock (L_qa) plan-media pinned; every
      # build below is --locked against it.
      - name: Build from the planned candidate
        shell: bash
        env:
          REVISIONS: ${{ needs.plan-media.outputs.revisions }}
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          "$py" freemkv/tests/media_gate.py checkout --workspace . --revisions "$REVISIONS"
          "$py" freemkv/tests/media_gate.py restore --workspace . --plan-directory media-plan
      - name: Install GTK4 + libadwaita development headers (Linux app)
        if: runner.os == 'Linux' && matrix.features != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev build-essential
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
          key: ${{ matrix.features == '' && 'cli' || 'app' }}
      # The check release.yml runs before shipping, exercised on every qa run first.
      - name: Clean build environment and C toolchain
        shell: bash
        run: |
          bash freemkv/.github/scripts/exact-toolchain.sh assert-env "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" freemkv
      - run: cargo test --locked --release --tests ${{ matrix.features }}
        working-directory: freemkv

  windows-build:
    needs: [plan-media]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - name: Exact toolchain (freemkv rust-version)
        shell: bash
        run: bash freemkv/.github/scripts/exact-toolchain.sh install freemkv/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: media-plan, path: media-plan }
      # The six rip-crate shas and the one lock (L_qa) plan-media pinned; every
      # build below is --locked against it.
      - name: Build from the planned candidate
        shell: bash
        env:
          REVISIONS: ${{ needs.plan-media.outputs.revisions }}
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          "$py" freemkv/tests/media_gate.py checkout --workspace . --revisions "$REVISIONS"
          "$py" freemkv/tests/media_gate.py restore --workspace . --plan-directory media-plan
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      # The check release.yml runs before shipping, exercised on every qa run first.
      - name: Clean build environment and C toolchain
        shell: bash
        run: |
          bash freemkv/.github/scripts/exact-toolchain.sh assert-env "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" freemkv
      - run: cargo build --locked --release --tests
        working-directory: freemkv
      - run: cargo build --locked --release --tests --features gui
        working-directory: freemkv
      # The release installer, compiled and round-tripped here so a broken
      # freemkv.iss fails qa instead of the tag build (steps mirror release.yml).
      - run: cargo build --locked --release --features gui
        working-directory: freemkv
      - name: Build the installer
        shell: pwsh
        working-directory: freemkv
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target/release/freemkv-gui.exe stage/freemkv.exe
          Copy-Item target/release/freemkv.exe stage/freemkv.com
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.4.3 -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" "/DBinDir=$((Resolve-Path stage).Path)" "/O$PWD" packaging/windows/freemkv.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc exited $LASTEXITCODE" }
          if (-not (Test-Path freemkv-x86_64-windows-setup.exe)) { throw "freemkv-x86_64-windows-setup.exe was not built" }
      - name: Round-trip the installer
        shell: pwsh
        working-directory: freemkv
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\freemkv"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\freemkv.lnk"
          $aumid = 'org.freemkv.FreeMKV'
          $aumidKey = "HKCU:\Software\Classes\AppUserModelId\$aumid"
          $userPath = { [Environment]::GetEnvironmentVariable('Path', 'User') }
          $keep = @("$env:RUNNER_TEMP\keep-a", "$env:RUNNER_TEMP\keep-b")
          [Environment]::SetEnvironmentVariable('Path', ((@((& $userPath) -split ';') + $keep) | Where-Object { $_ }) -join ';', 'User')
          $before = (& $userPath) -split ';'
          Start-Process -Wait ./freemkv-x86_64-windows-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          foreach ($f in 'freemkv.exe','freemkv.com','unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "installer did not create $dir\$f" }
          }
          if ((& $userPath) -split ';' -notcontains $dir) { throw "installer did not add $dir to the user PATH" }
          if (-not (Test-Path $lnk)) { throw "installer did not create $lnk" }
          # The shell property read is best-effort; the registry key checks below are the hard gate.
          $got = $null
          try {
            $item = (New-Object -ComObject Shell.Application).NameSpace((Split-Path $lnk)).ParseName((Split-Path $lnk -Leaf))
            $got = $item.ExtendedProperty('System.AppUserModel.ID')
          } catch { }
          if (-not $got) { Write-Output "::warning::could not read the AppUserModelID of $lnk; not verified" }
          elseif ($got -ne $aumid) { throw "Start-menu shortcut AppUserModelID is '$got', want $aumid" }
          if (-not (Test-Path $aumidKey)) { throw "installer did not register $aumidKey" }
          & "$dir\freemkv.com" --version
          if ($LASTEXITCODE -ne 0) { throw "installed freemkv.com --version exited $LASTEXITCODE" }
          # The bare name must resolve to the console .com (PATHEXT), not the windowed .exe.
          $env:Path = (& $userPath) + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $bare = (Get-Command freemkv -CommandType Application | Select-Object -First 1).Source
          if ($bare -ne "$dir\freemkv.com") { throw "bare 'freemkv' resolves to $bare, want $dir\freemkv.com" }
          Start-Process -Wait "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          # The uninstaller relaunches itself from %TEMP%, so -Wait can return early.
          $done = { -not (Test-Path "$dir\freemkv.exe") -and ((& $userPath) -split ';' -notcontains $dir) }
          for ($i = 0; $i -lt 60 -and -not (& $done); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\freemkv.exe") { throw "uninstaller left $dir\freemkv.exe" }
          if ((& $userPath) -split ';' -contains $dir) { throw "uninstaller left $dir on the user PATH" }
          if (Test-Path $lnk) { throw "uninstaller left $lnk" }
          if (Test-Path $aumidKey) { throw "uninstaller left $aumidKey" }
          $after = (& $userPath) -split ';'
          if (Compare-Object $before $after -SyncWindow 0) { throw "uninstall changed other user PATH entries: '$($before -join ';')' -> '$($after -join ';')'" }


  cli-integration:
    needs: [plan-media]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - name: Exact toolchain (freemkv rust-version)
        shell: bash
        run: bash freemkv/.github/scripts/exact-toolchain.sh install freemkv/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: media-plan, path: media-plan }
      # The six rip-crate shas and the one lock (L_qa) plan-media pinned; every
      # build below is --locked against it.
      - name: Build from the planned candidate
        shell: bash
        env:
          REVISIONS: ${{ needs.plan-media.outputs.revisions }}
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          "$py" freemkv/tests/media_gate.py checkout --workspace . --revisions "$REVISIONS"
          "$py" freemkv/tests/media_gate.py restore --workspace . --plan-directory media-plan
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
      - name: Install ffmpeg and python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            brew install ffmpeg
          fi
      # The CLI build: cli-parity expects a bare `freemkv` to print usage.
      - run: cargo build --locked --release --bin freemkv
        working-directory: freemkv
      - run: tests/cli-parity.sh check
        working-directory: freemkv
      - run: tests/cli-integration.sh
        working-directory: freemkv

  # One job per EC2 leg: launch a runner only this run can use (the run-<id>
  # label), then watch the leg and end with its conclusion, so "Re-run failed
  # jobs" re-runs both and gets a fresh instance. Teardown always runs, so a
  # cancelled run never strands an instance. Everything run-instances gets comes
  # from `media_gate.py launch-spec` (the policy): the functional template at its
  # planned version, the perf legs' differences as overrides, and the Spot cap.
  launch:
    needs: [plan-media, release-tests, windows-build, cli-integration]
    if: needs.plan-media.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      id-token: write
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan-media.outputs.legs || '["linux", "windows"]') }}
    env:
      GH_TOKEN: ${{ github.token }}
      LEG: ${{ matrix.leg }}
      RUN_ID: ${{ github.run_id }}
      ATTEMPT: ${{ github.run_attempt }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
          persist-credentials: false
          sparse-checkout: |
            .github/runner-templates
            tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - name: Still the newest candidate
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF" = refs/heads/qa ]; then
            head=$(gh api "repos/$REPO/git/ref/heads/qa" -q .object.sha)
            if [ "$head" != "$SHA" ]; then
              echo "::error title=Superseded::qa moved to ${head:0:12}; this run proves nothing and launches nothing"
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" || true
              exit 1
            fi
          fi
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.FMKV_RUNNER_ROLE }}
          aws-region: us-west-2
      - name: Launch spec
        id: spec
        env:
          TEMPLATES: ${{ needs.plan-media.outputs.launch_templates }}
        run: |
          set -euo pipefail
          spec=$(python3 freemkv/tests/media_gate.py launch-spec --leg "$LEG")
          echo "$spec" | jq .
          {
            echo "spec=$spec"
            echo "param=$(jq -r .param <<<"$spec")"
            echo "labels=$(jq -r .labels <<<"$spec")"
            echo "job=$(jq -r .job <<<"$spec")"
          } >> "$GITHUB_OUTPUT"
      # One parameter per run, attempt and leg (/freemkv-ci/runner-reg/<run>-<attempt>-<leg>,
      # inside the /freemkv-ci/runner-reg/* scope both roles already have), so two
      # overlapping runs never read each other's token. The instance deletes it right
      # after reading (its own role allows that); the launcher has no delete permission
      # and needs none: a token nobody read expires 60 minutes after it was minted.
      - name: Mint a registration token and stash it in SSM (SecureString)
        id: reg
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          PARAM: ${{ steps.spec.outputs.param }}
        run: |
          set -euo pipefail
          tok=$(gh api -X POST "repos/$REPO/actions/runners/registration-token" -q .token)
          echo "::add-mask::$tok"
          aws ssm put-parameter --name "$PARAM" --type SecureString --value "$tok" --overwrite >/dev/null
          echo "param=$PARAM" >> "$GITHUB_OUTPUT"
      # The planned launch-template version, and the user-data from this commit
      # (so the runner registers with this run's labels).
      - name: Launch the ephemeral runner
        id: launch
        env:
          PARAM: ${{ steps.reg.outputs.param }}
          SPEC: ${{ steps.spec.outputs.spec }}
        run: |
          set -euo pipefail
          lt=$(jq -r .template <<<"$SPEC")
          version=$(jq -r .version <<<"$SPEC")
          labels=$(jq -r .labels <<<"$SPEC")
          userdata="freemkv/$(jq -r .user_data <<<"$SPEC")"
          bdm=$(jq -c .block_device_mappings <<<"$SPEC")
          tags=$(jq -cn --arg p "$PARAM" --arg r "$REPO" --arg id "$RUN_ID" --arg l "$labels" '[{ResourceType: "instance",
            Tags: [{Key: "freemkv-ci", Value: "runner"}, {Key: "runner-token-param", Value: $p},
                   {Key: "runner-repo", Value: $r}, {Key: "launched-by", Value: $id},
                   {Key: "runner-labels", Value: $l}]}]')
          vpc=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          subnets=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" --query 'Subnets[].SubnetId' --output text)
          [ -n "$subnets" ] || { echo "no subnets in default VPC $vpc" >&2; exit 1; }
          # The functional Linux leg falls back across types (the actual type is recorded
          # by the leg); a perf leg has exactly one type; an empty list is the template's.
          types=$(jq -r '.types | if length == 0 then "template" else join(" ") end' <<<"$SPEC")
          # On-Demand runs WITHOUT the template (run-instances cannot clear a template's Spot
          # market options): launch-spec copies the pinned version's image, instance profile,
          # security groups, volumes, metadata options and shutdown behaviour into $od, plus
          # its own instance tags (Name) next to ours. aws ec2 run-instances help, --cli-input-json:
          # "If other arguments are provided on the command line, those values will override
          # the JSON-provided values." (so --instance-type picks the attempt's type).
          od=$(jq -c '.on_demand.input // empty' <<<"$SPEC")
          od_tags=$(jq -c --argjson t "$tags" '[{ResourceType: "instance", Tags: ($t[0].Tags + (.on_demand.tags // []))}]' <<<"$SPEC")
          try_launch() {
            local market="$1" options="$2" via_template="$3"
            local t s id
            for t in $types; do
              for s in $subnets; do
                echo "attempt: type=$t subnet=$s market=$market template=$via_template"
                extra=()
                [ "$t" = template ] || extra+=(--instance-type "$t")
                if [ "$via_template" = true ]; then
                  extra+=(--launch-template "LaunchTemplateName=$lt,Version=$version" --tag-specifications "$tags")
                  [ "$options" = null ] || extra+=(--instance-market-options "$options")
                  [ "$bdm" = null ] || extra+=(--block-device-mappings "$bdm")
                else
                  [ -n "$od" ] || { echo "no On-Demand input in the spec" > launch.err; return 2; }
                  extra+=(--cli-input-json "$od" --tag-specifications "$od_tags")
                fi
                if id=$(aws ec2 run-instances \
                          --subnet-id "$s" "${extra[@]}" \
                          --user-data "file://$userdata" \
                          --query 'Instances[0].InstanceId' --output text 2>launch.err); then
                  echo "instance=$id" >> "$GITHUB_OUTPUT"
                  echo "launched $id ($LEG, type=$t subnet=$s market=$market, template $lt v$version)"
                  # What record-media-evidence checks the leg against, even after EC2 forgets the instance.
                  jq -n --arg id "$id" --arg run "$RUN_ID" --arg attempt "$ATTEMPT" --arg leg "$LEG" \
                        --arg os "$(jq -r .os <<<"$SPEC")" --arg labels "$labels" \
                        --arg lt "$lt" --arg v "$version" --arg type "$t" --arg market "$market" \
                        '{instance_id: $id, launched_by: ($run | tonumber), run_attempt: ($attempt | tonumber),
                          leg: $leg, os: $os, runner_labels: $labels, market: $market,
                          launch_template: $lt, launch_template_version: $v, requested_type: $type}' \
                        > "launch-$LEG-$ATTEMPT.json"
                  return 0
                fi
                echo "  failed ($t/$s/$market): $(cat launch.err)"
                if ! grep -qiE 'InsufficientInstanceCapacity|Unsupported|InsufficientHostCapacity|capacity|SpotMaxPriceTooLow' launch.err; then
                  return 2
                fi
              done
            done
            return 1
          }
          # Markets in order (Spot at the policy's cap through the template, then
          # On-Demand without it; or the template's own): only capacity exhaustion moves on.
          rc=1
          while read -r market; do
            name=$(jq -r .name <<<"$market")
            options=$(jq -c .options <<<"$market")
            via_template=$(jq -r .template <<<"$market")
            rc=0; try_launch "$name" "$options" "$via_template" || rc=$?
            [ "$rc" = 1 ] || break
            echo "every $name attempt hit capacity"
          done < <(jq -c '.markets[]' <<<"$SPEC")
          [ "$rc" = 0 ] && exit 0
          echo "::error title=Runner launch failed::could not launch the $LEG media runner — cancelling the run so its leg does not sit queued" >&2
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.launch.outputs.instance != ''
        with:
          name: "launch-${{ matrix.leg }}-${{ github.run_attempt }}"
          path: "launch-${{ matrix.leg }}-${{ github.run_attempt }}.json"
          overwrite: true
      # Ends with the leg's conclusion. A leg not picked up by the deadline (the
      # instance never registered) terminates the instance and cancels the run.
      - name: Watch the leg
        id: watch
        env:
          INSTANCE: ${{ steps.launch.outputs.instance }}
          JOB: ${{ steps.spec.outputs.job }}
        run: |
          set -uo pipefail
          leg="$JOB"
          limit=900; case "$LEG" in windows*) limit=1800 ;; esac
          deadline=$(( $(date +%s) + limit ))
          picked=false
          while :; do
            # A failed poll is retried; only a leg never picked up by the deadline is fatal.
            # The leg's name, or the same name with further matrix values ("cli-matrix (linux, …)").
            if ! state=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
                           -q ".jobs[] | select(.name == \"$leg\" or (.name | startswith(\"${leg%)}, \"))) | \"\(.status) \(.conclusion)\"" \
                           2>/dev/null | head -1) || [ -z "$state" ]; then
              state="unknown none"
            fi
            read -r status conclusion <<<"$state"
            [ "$status" = in_progress ] && picked=true
            if [ "$status" = completed ]; then
              echo "$leg: $conclusion"
              [ "$conclusion" = success ]; exit $?
            fi
            if [ "$picked" = false ] && [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error title=Runner never picked up the leg::$leg is still '$status' $((limit / 60)) min after launch — terminating $INSTANCE and cancelling the run"
              aws ec2 terminate-instances --instance-ids "$INSTANCE" >/dev/null 2>&1 || true
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" || true
              exit 1
            fi
            sleep 30
          done
      # Anything failing before the watch (credentials, token, launch) would leave
      # the leg queued for a runner that never comes: cancel the run instead.
      - name: Cancel the run (no runner is coming)
        if: failure() && steps.watch.outcome != 'failure'
        run: gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" || true
      # Fresh credentials: the watch can outlive the first session.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: always() && steps.spec.outputs.labels != ''
        with:
          role-to-assume: ${{ secrets.FMKV_RUNNER_ROLE }}
          aws-region: us-west-2
      # The registration-token parameter is not deleted here (see the mint step).
      - name: Tear down
        if: always() && steps.spec.outputs.labels != ''
        env:
          LABELS: ${{ steps.spec.outputs.labels }}
          INSTANCE: ${{ steps.launch.outputs.instance }}
        run: |
          # Every live instance this run launched for this leg, including one whose id was
          # never written because the run was cancelled mid-launch.
          # JSON filters: the CLI's shorthand would split the comma-separated label value.
          filters=$(jq -cn --arg r "$RUN_ID" --arg l "$LABELS" '[
            {Name: "tag:launched-by", Values: [$r]}, {Name: "tag:runner-labels", Values: [$l]},
            {Name: "instance-state-name", Values: ["pending", "running", "stopping", "stopped"]}]')
          ids=$(aws ec2 describe-instances --filters "$filters" \
                  --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null || true)
          for id in $INSTANCE $ids; do
            aws ec2 terminate-instances --instance-ids "$id" --query 'TerminatingInstances[0].CurrentState.Name' --output text || true
          done

  cli-matrix:
    # Not `needs: launch`: a failed leg fails its launch job too, so "Re-run failed
    # jobs" re-runs the pair and gets a fresh instance for this run's label.
    needs: [plan-media, release-tests, windows-build, cli-integration]
    if: needs.plan-media.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        # The targets release.yml ships the CLI for. Building the host gnu
        # target instead pulled in GTK (glib-sys) on Linux; on musl it is
        # cfg'd out.
        include:
          - os: linux
            target: x86_64-unknown-linux-musl
          - os: windows
            target: x86_64-pc-windows-msvc
    # run-<id>: only the instance this run launched can take the job.
    runs-on: [self-hosted, freemkv-media, "${{ matrix.os }}", "run-${{ github.run_id }}"]
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: freemkv }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: freemkv/freemkv-ci
          ref: ${{ needs.plan-media.outputs.harness }}
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}
          persist-credentials: false
          path: ci
      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3 python3-venv
          else
            choco install ffmpeg python3 -y --no-progress
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          fi
          command -v ffprobe >/dev/null || {
            echo "::error title=ffprobe missing::the acceptance suite verifies every output with ffprobe; without it the run would only be checking exit codes"
            exit 1
          }
          ffprobe -version | head -1
          if [ "${{ matrix.os }}" = "windows" ]; then
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
            for d in /c/Python3*/; do
              if [ -x "${d}python.exe" ]; then
                echo "${d%/}" >> "$GITHUB_PATH"
                export PATH="$PATH:${d%/}"
              fi
            done
          fi
          PY=$(command -v python3 || command -v python || ls /c/Python3*/python.exe 2>/dev/null | head -1 || true)
          if [ -z "$PY" ] || ! "$PY" -c 'import sys; sys.exit(0 if sys.version_info[0] == 3 else 1)'; then
            echo "::error title=python 3 missing::the acceptance suite analyses every output timeline with a python program; without it the timeline checks would not run"
            exit 1
          fi
          echo "FMKV_PYTHON=$PY" >> "$GITHUB_ENV"
          "$PY" --version
      - name: Provision the build toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows" ]; then
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            have_vc=
            if [ -x "$vswhere" ]; then
              have_vc=$("$vswhere" -latest -products '*' \
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
                -property installationPath 2>/dev/null || true)
            fi
            if [ -z "$have_vc" ]; then
              choco install -y visualstudio2022buildtools --no-progress
              choco install -y visualstudio2022-workload-vctools --no-progress
            fi
          else
            # musl-tools: ring and mimalloc compile C for the musl target.
            sudo apt-get install -y -qq build-essential curl musl-tools
          fi
          # One exact toolchain: freemkv's rust-version, as release.yml and
          # release-orchestrate use. Any rustup failure fails the job; never fall back to the AMI's.
          if [ "${{ matrix.os }}" = "windows" ]; then
            cargo_bin="$(cygpath -u "$USERPROFILE")/.cargo/bin"
          else
            cargo_bin="$HOME/.cargo/bin"
          fi
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$cargo_bin/rustup" ] && [ ! -x "$cargo_bin/rustup.exe" ]; then
            if [ "${{ matrix.os }}" = "windows" ]; then
              curl -sSf -o rustup-init.exe https://win.rustup.rs/x86_64
              ./rustup-init.exe -y --profile minimal --default-toolchain none \
                --default-host x86_64-pc-windows-msvc
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none
            fi
          fi
          # POSIX form for $GITHUB_PATH: a C:\ entry is split on its drive-letter
          # colon when Git-Bash re-parses PATH for the next step.
          export PATH="$cargo_bin:$PATH"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          bash freemkv/.github/scripts/exact-toolchain.sh install freemkv/Cargo.toml "${{ matrix.target }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: media-plan, path: media-plan }
      - name: Build from the planned candidate
        shell: bash
        env:
          REVISIONS: ${{ needs.plan-media.outputs.revisions }}
        run: |
          set -euo pipefail
          "$FMKV_PYTHON" freemkv/tests/media_gate.py checkout --workspace . --revisions "$REVISIONS"
          "$FMKV_PYTHON" freemkv/tests/media_gate.py restore --workspace . --plan-directory media-plan
          echo "LF_SHA=$(git -C libfreemkv rev-parse --short HEAD)" >> "$GITHUB_ENV"
      # Catches the gui feature's crates leaking into the CLI build.
      - name: The CLI build has no UI dependencies
        shell: bash
        working-directory: freemkv
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -e normal,build --target "${{ matrix.target }}" --prefix none)
          ui=$(grep -E '^(gtk4|gdk4|libadwaita|glib-sys|gobject-sys|gio-sys|winsafe|windows|objc2-app-kit) ' \
                 <<<"$tree" | sed 's/ (\*)$//' | sort -u || true)
          if [ -n "$ui" ]; then
            echo "::error title=UI crates in the CLI build::the CLI must build without the gui feature's dependencies:"
            echo "$ui"
            exit 1
          fi
      - name: Clean build environment and C toolchain
        id: cenv
        shell: bash
        run: bash freemkv/.github/scripts/exact-toolchain.sh assert-env "${{ matrix.target }}" freemkv
      - name: Build the CLI
        shell: bash
        working-directory: freemkv
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin freemkv
      - name: The Linux CLI is static
        if: matrix.os == 'linux'
        shell: bash
        run: |
          BIN="freemkv/target/${{ matrix.target }}/release/freemkv"
          if readelf -d "$BIN" | grep -q NEEDED; then
            readelf -d "$BIN"; echo "::error::the Linux CLI is not static"; exit 1
          fi
      # All five keys at once, every ranged GET pinned to the ETag (or VersionId)
      # recorded first, and each object's ETag recomputed from the bytes as they
      # arrive (tests/media_fetch.py). The report records the fetch time per key.
      - name: Fetch the disc fixtures and key database
        shell: bash
        env:
          B: ${{ secrets.FMKV_FIXTURES_BUCKET }}
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION=us-west-2 AWS_REGION=us-west-2
          if [ "${{ matrix.os }}" = "windows" ]; then
            ISO_DIR=$(cygpath -m "$(pwd)")/isos
            venv="$(cygpath -u "$RUNNER_TEMP")/fetch-venv"
            venv_py="$venv/Scripts/python.exe"
          else
            ISO_DIR="$(pwd)/isos"
            venv="$RUNNER_TEMP/fetch-venv"
            venv_py="$venv/bin/python"
          fi
          echo "ISO_DIR=$ISO_DIR" >> "$GITHUB_ENV"
          echo "KEYDB_PATH=$ISO_DIR/keydb.cfg" >> "$GITHUB_ENV"
          "$FMKV_PYTHON" -m venv "$venv"
          "$venv_py" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r freemkv/tests/media-fetch-requirements.txt
          # The fixture pins plan-media fingerprinted; resolve afresh only if it could not read them.
          "$venv_py" - <<'PY'
          import json
          ext = json.load(open('media-plan/evidence.json'))['inputs']['externals']
          if 'error' not in ext.get('fixtures', {'error': 1}):
              json.dump(ext['fixtures'], open('fixtures.json', 'w'))
          PY
          [ -f fixtures.json ] || "$venv_py" freemkv/tests/media_fetch.py resolve --bucket "$B" --out fixtures.json
          "$venv_py" freemkv/tests/media_fetch.py fetch --bucket "$B" --manifest fixtures.json \
            --dest isos --report "fetch-${{ matrix.os }}.json"
          df -h . | tail -1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "fetch-report-${{ matrix.os }}"
          path: "fetch-${{ matrix.os }}.json"
          overwrite: true
          if-no-files-found: ignore
      - name: Run the full CLI acceptance suite
        id: suite
        shell: bash
        env:
          FMKV_KEY_URL: ${{ secrets.FMKV_KEY_URL }}
          FMKV_KEY_AUTH: ${{ secrets.FMKV_KEY_AUTH }}
        run: |
          set +e -uo pipefail
          if [ -z "${FMKV_KEY_URL:-}" ] || [ -z "${FMKV_KEY_AUTH:-}" ]; then
            echo "::error title=Key service not configured::FMKV_KEY_URL / FMKV_KEY_AUTH are unset, so the AACS fixtures (bd, uhd) cannot decrypt. Set them as repo secrets. The DVD would still pass, because CSS needs no key — do not read a green DVD as evidence the keys work."
            exit 1
          fi

          BIN="$PWD/freemkv/target/${{ matrix.target }}/release/freemkv"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BIN="$(cygpath -m "$PWD")/freemkv/target/${{ matrix.target }}/release/freemkv.exe"
            export TMPDIR="$(cygpath -m "${RUNNER_TEMP}")"
          fi
          [ -x "${BIN%.exe}" ] || [ -x "$BIN" ] || {
            echo "::error title=CLI binary missing::expected a release build at $BIN"; exit 1; }

          chmod +x ci/scripts/cli-acceptance.sh || true
          FMKV_MEDIA_CHECKS="$PWD/freemkv/tests/media_checks.py" \
          FMKV_BIN="$BIN" \
          FMKV_DVD_ISO="$ISO_DIR/dvd.iso" \
          FMKV_BD_ISO="$ISO_DIR/bd.iso" \
          FMKV_UHD_ISO="$ISO_DIR/uhd.iso" \
          FMKV_HDDVD_ISO="$ISO_DIR/hddvd.iso" \
          FMKV_SYN_M2TS_LPCM="$ISO_DIR/synthetic-m2ts-h264-bframes-lpcm16-lpcm24.m2ts" \
          FMKV_SYN_MKV_ADTS="$ISO_DIR/synthetic-mkv-h264-aac-mp2-mp3.mkv" \
          FMKV_SYN_MPG="$ISO_DIR/synthetic-mpg-mpeg2-interlaced-mp2-lpcm24.mpg" \
          FMKV_BD_DAMAGE_PATCH="$ISO_DIR/bd-aacs-damage.patch.json" \
          FMKV_KEYDB="$KEYDB_PATH" \
          FMKV_HASHES="$PWD/cli-${{ matrix.os }}.txt" \
            bash ci/scripts/cli-acceptance.sh 2>&1 | tee "suite-${{ matrix.os }}.log"
          rc=${PIPESTATUS[0]}

          if [ "$rc" != 0 ]; then
            echo "── every failing check on ${{ matrix.os }} ──"
            grep -E '^  (FAIL|SKIP)' "suite-${{ matrix.os }}.log" || true
            echo "──"
          fi

          if [ "$rc" != 0 ]; then
            echo "::error title=CLI acceptance failed on ${{ matrix.os }}::the suite exited $rc — the FAIL/SKIP lines naming each check are in this step's log above"
          fi
          echo "libfreemkv=$LF_SHA" >> "cli-${{ matrix.os }}.txt"
          echo "── hashes recorded on ${{ matrix.os }} ──"
          cat "cli-${{ matrix.os }}.txt"
          exit $rc
      # What record-media-evidence cross-checks against the jobs API and EC2.
      - name: Leg identity
        shell: bash
        env:
          C_TOOLCHAIN: ${{ steps.cenv.outputs.c_toolchain }}
        run: |
          "$FMKV_PYTHON" freemkv/tests/media_gate.py leg --leg "${{ matrix.os }}" --target "${{ matrix.target }}" \
            --c-toolchain "$C_TOOLCHAIN" --out "leg-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "leg-${{ matrix.os }}"
          path: "leg-${{ matrix.os }}.json"
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "cli-matrix-${{ matrix.os }}"
          path: "cli-${{ matrix.os }}.txt"
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "cli-suite-log-${{ matrix.os }}"
          path: "suite-${{ matrix.os }}.log"
          overwrite: true

  compare-cli-matrix:
    needs: [plan-media, cli-matrix]
    if: always() && needs.plan-media.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "cli-matrix-*", path: hashes }
        continue-on-error: true
      - name: Linux and Windows must produce identical bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, collections

          arts, shas = collections.defaultdict(dict), {}
          files = sorted(glob.glob("hashes/*/cli-*.txt"))
          if not files:
              print("::error title=No hashes produced::neither leg of the CLI matrix "
                    "uploaded a hash file, so nothing was compared. Check whether the "
                    "EC2 runners registered at all.")
              sys.exit(1)

          for path in files:
              plat = os.path.basename(path)[len("cli-"):-len(".txt")]
              for line in open(path):
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("libfreemkv="):
                      shas[plat] = line.split("=", 1)[1]
                      continue
                  h, _, name = line.partition("  ")
                  arts[name.strip()][plat] = h

          plats = sorted({p for v in arts.values() for p in v})
          print("platforms:", ", ".join(plats) or "(none)")
          fail = False

          if len(set(shas.values())) > 1:
              print(f"::error title=Sibling shas differ::libfreemkv differs across the "
                    f"matrix ({shas}) — MUX_APP is stamped from it, so a byte comparison "
                    "would be meaningless. Pin the sibling refs.")
              fail = True

          EXPECTED = {"linux", "windows"}
          absent = sorted(EXPECTED - set(plats))
          if absent:
              print(f"::error title=Platform never reported::no hashes from "
                    f"{', '.join(absent)} — that leg was never compared, so this run "
                    "cannot claim cross-platform parity")
              fail = True

          for name in sorted(arts):
              by = arts[name]
              missing = sorted(EXPECTED - set(by))
              if len(set(by.values())) == 1 and not missing:
                  print(f"  OK    {name}")
              elif missing:
                  fail = True
                  print(f"::error title=Artifact missing on {','.join(missing)}::{name} "
                        f"was not produced on {', '.join(missing)} — it agrees where it "
                        "exists, but that platform is unproven for this output")
              else:
                  fail = True
                  print(f"::error title=Output differs::{name} DIFFERS across platforms:")
                  for p in sorted(by):
                      print(f"      {p:10} {by[p]}")

          print(f"\n{len(arts)} artifacts compared across {len(plats)} platforms")
          sys.exit(1 if fail else 0)
          PY

  # Writes the evidence: an annotated tag media-evidence/<F>/<run_id> on an
  # orphan commit holding evidence.json and the built Cargo.lock.
  record-media-evidence:
    needs: [plan-media, launch, cli-matrix, compare-cli-matrix]
    if: >-
      always() && needs.plan-media.outputs.run == 'true' && needs.launch.result == 'success'
      && needs.cli-matrix.result == 'success' && needs.compare-cli-matrix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    outputs:
      tag: ${{ steps.record.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: media-plan, path: media-plan }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: 'leg-*', path: legs, merge-multiple: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: 'launch-*', path: legs, merge-multiple: true }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.FMKV_RUNNER_ROLE }}
          aws-region: us-west-2
      - name: Record the evidence
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 freemkv/tests/media_gate.py record --plan-directory media-plan --legs legs

  # The one media answer (I-1): green only if evidence was reused or written by this run.
  media-verdict:
    needs: [plan-media, launch, cli-matrix, compare-cli-matrix, record-media-evidence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
          persist-credentials: false
          sparse-checkout: tests
      - name: Media verdict
        env:
          PLAN_RESULT: ${{ needs.plan-media.result }}
          STATUS: ${{ needs.plan-media.outputs.status }}
          REASON: ${{ needs.plan-media.outputs.reason }}
          EVIDENCE_URL: ${{ needs.plan-media.outputs.evidence_url }}
          MATRIX: ${{ needs.cli-matrix.result }}
          COMPARE: ${{ needs.compare-cli-matrix.result }}
          RECORD: ${{ needs.record-media-evidence.result }}
          TAG: ${{ needs.record-media-evidence.outputs.tag }}
        run: python3 freemkv/tests/media_gate.py verdict
