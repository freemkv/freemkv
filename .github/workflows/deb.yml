name: Debian package

on:
  # With `tag`, a backfill: build ONLY the legs marked `backfill` (added after
  # that release) from the tag's source, with this workflow's packaging, and add
  # them to the tag's existing release. Without it, a plain build of the ref.
  #   gh workflow run deb.yml --ref main -f tag=v1.8.0
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to backfill (e.g. v1.8.0); empty = build only
        type: string
        default: ''
  push:
    branches: [dev, qa]
    tags: ['v*', '!v*-rc*']
  pull_request:
    paths: ['packaging/deb/**', '.github/workflows/deb.yml']

concurrency:
  group: deb-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaging-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s packaging/deb -p 'test_*.py' -v

  # One leg per Debian architecture. The app links the host's GTK, so it builds
  # natively (amd64, and arm64 on GitHub's arm64 runner); armhf (Raspberry Pi
  # 32-bit) is the static CLI only, cross-built with the same pinned `cross`
  # image as the release's armv7 binary. dev builds and installs every leg so a
  # new architecture is proven before qa; only a tag publishes.
  # The legs, one JSON object per line. `backfill: true` marks one added after
  # v1.8.0, which a backfill dispatch builds for an already-published tag.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      apps: ${{ steps.legs.outputs.apps }}
    steps:
      - id: legs
        env:
          BACKFILL: ${{ inputs.tag && 'true' || 'false' }}
          LEGS: |
            {"arch": "amd64", "runner": "ubuntu-24.04", "gnu": "x86_64-unknown-linux-gnu", "cli": "x86_64-unknown-linux-musl", "app": true, "cross": false}
            {"arch": "arm64", "runner": "ubuntu-24.04-arm", "gnu": "aarch64-unknown-linux-gnu", "cli": "aarch64-unknown-linux-musl", "app": true, "cross": false, "backfill": true}
            {"arch": "armhf", "runner": "ubuntu-24.04", "gnu": "", "cli": "armv7-unknown-linux-musleabihf", "app": false, "cross": true, "backfill": true}
        run: |
          set -euo pipefail
          legs=$(jq -cs --argjson b "$BACKFILL" 'map(select(($b | not) or .backfill))' <<<"$LEGS")
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "apps=$(jq -c 'map(select(.app))' <<<"$legs")" >> "$GITHUB_OUTPUT"

  build:
    needs: [packaging-tests, plan]
    if: github.ref_name == 'dev' || github.ref_name == 'qa' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: freemkv
          ref: ${{ inputs.tag }}
          fetch-depth: ${{ inputs.tag && 0 || 1 }}
      # Backfill: the tag's source with this workflow's packaging scripts.
      - name: Overlay this workflow's packaging
        if: inputs.tag
        working-directory: freemkv
        env:
          SHA: ${{ github.sha }}
        run: git checkout "$SHA" -- .github/scripts/ packaging/deb/
      # Siblings live inside freemkv/ so `cross` (which mounts only the crate)
      # sees them too.
      - name: Pin matching sibling sources
        env:
          BUILD_REF: ${{ inputs.tag || github.ref_name }}
          BUILD_REF_TYPE: ${{ inputs.tag && 'tag' || github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$BUILD_REF_TYPE" = tag ]; then ref="$BUILD_REF"
          elif [ "$BUILD_REF" = dev ]; then ref=dev
          else ref=qa; fi
          for repo in libfreemkv freemkv-engine freemkv-keysources freemkv-i18n freemkv-unlock; do
            git clone --depth 1 --branch "$ref" "https://github.com/freemkv/$repo.git" "freemkv/siblings/$repo"
          done
          python3 - <<'PY'
          import importlib.util, json, pathlib, subprocess, tomllib
          spec = importlib.util.spec_from_file_location('flatpak_prepare', 'freemkv/packaging/flatpak/prepare.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          version = tomllib.loads(pathlib.Path('freemkv/Cargo.toml').read_text())['package']['version']
          revisions = {}
          for repo in module.REPOS[1:]:
              path = pathlib.Path('freemkv/siblings', repo)
              actual = tomllib.loads((path / 'Cargo.toml').read_text())['package']['version']
              if actual != version:
                  raise SystemExit(f'{repo} version {actual} differs from {version}')
              revisions[repo] = subprocess.check_output(['git', '-C', str(path), 'rev-parse', 'HEAD'], text=True).strip()
          config = pathlib.Path('freemkv/.cargo/config.toml')
          config.parent.mkdir(exist_ok=True)
          config.write_text(module.patches().replace('"../', '"siblings/'))
          pathlib.Path('revisions.json').write_text(json.dumps(revisions, indent=2) + '\n')
          PY
      - name: Install Ubuntu 24.04 build and package tools
        env:
          APP: ${{ matrix.app }}
          CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          pkgs=(build-essential pkg-config dpkg-dev lintian desktop-file-utils)
          if [ "$APP" = true ]; then pkgs+=(libgtk-4-dev libadwaita-1-dev); fi
          # Native musl legs compile C with musl-gcc; the armhf leg strips with the cross binutils.
          if [ "$CROSS" = true ]; then pkgs+=(binutils-arm-linux-gnueabihf); else pkgs+=(musl-tools); fi
          sudo apt-get update
          sudo apt-get install -y "${pkgs[@]}"
          # cc-rs calls <arch>-linux-musl-gcc for any non-x86_64 musl target, even a
          # native one; musl-tools only ships the musl-gcc wrapper.
          arch=$(uname -m)
          if [ "$CROSS" != true ] && [ "$arch" != x86_64 ]; then
            sudo ln -sf "$(command -v musl-gcc)" "/usr/local/bin/$arch-linux-musl-gcc"
          fi
      # Pinned + hash-checked like release.yml's cross legs; the build image by digest.
      - name: Install cross
        if: matrix.cross
        run: |
          set -euo pipefail
          curl -fsSLo cross.tar.gz https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz
          echo 'a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588  cross.tar.gz' | sha256sum -c -
          tar xzf cross.tar.gz cross
          sudo mv cross /usr/local/bin/
          echo 'CROSS_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_IMAGE=ghcr.io/cross-rs/armv7-unknown-linux-musleabihf:0.2.5@sha256:b4f481f30ceca34730a5723f717396d762d94f6eddd7e1cf7c7862d1377ff98c' >> "$GITHUB_ENV"
      - name: Exact toolchain (freemkv rust-version)
        run: bash freemkv/.github/scripts/exact-toolchain.sh install freemkv/Cargo.toml ${{ matrix.cli }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: freemkv
          key: deb-${{ matrix.arch }}
      - name: Clean build environment and C toolchain
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.gnu }}" ]; then
            bash freemkv/.github/scripts/exact-toolchain.sh assert-env ${{ matrix.gnu }} freemkv
          fi
          bash freemkv/.github/scripts/exact-toolchain.sh assert-env ${{ matrix.cli }} freemkv
      - name: Build app and static CLI packages
        working-directory: freemkv
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = true ]; then
            cargo build --release --features gui --bin freemkv
            python3 packaging/deb/build.py --package freemkv --output ../deb-package
          fi
          if [ "${{ matrix.cross }}" = true ]; then
            cross build --release --target ${{ matrix.cli }} --bin freemkv
          else
            cargo build --release --target ${{ matrix.cli }} --bin freemkv
          fi
          python3 packaging/deb/build.py --package freemkv-cli --arch ${{ matrix.arch }} --output ../deb-package \
            --binary target/${{ matrix.cli }}/release/freemkv
          cp ../revisions.json ../deb-package/revisions.json
      - name: Lint packages and desktop entry
        run: |
          set -euo pipefail
          desktop-file-validate freemkv/packaging/flatpak/org.freemkv.FreeMKV.desktop
          for deb in deb-package/*.deb; do
            lintian --fail-on error "$deb"
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deb-package-${{ matrix.arch }}
          path: deb-package
          if-no-files-found: error
          retention-days: 90

  install:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { name: 'deb-package-${{ matrix.arch }}', path: deb-package }
      - name: Install app into a clean Ubuntu 24.04 runtime
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ./deb-package/freemkv-${{ matrix.arch }}.deb \
            xvfb xauth dbus-x11 python3 fonts-dejavu-core
          dpkg-query -W -f='${Status}\n' freemkv | grep -Fx 'install ok installed'
          dpkg-query -W libgtk-4-1 libadwaita-1-0
          ldd /usr/bin/freemkv | grep -F libgtk-4.so
          expected=$(python3 -c 'import json; print(json.load(open("deb-package/freemkv-${{ matrix.arch }}.json"))["version"])')
          freemkv --version | tee version.log
          awk -v expected="$expected" '$1 == expected { found=1 } END { exit !found }' version.log
      - name: Launch installed GUI without a terminal
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home tester
          chmod 755 "$GITHUB_WORKSPACE"
          status=0
          runuser -u tester -- xvfb-run --auto-servernum dbus-run-session -- \
            timeout 15s env GDK_BACKEND=x11 /usr/bin/freemkv > gui-launch.log 2>&1 || status=$?
          cat gui-launch.log
          test "$status" -eq 124
      - name: CLI package replaces the app and is static
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./deb-package/freemkv-cli-${{ matrix.arch }}.deb
          dpkg-query -W -f='${Status}\n' freemkv-cli | grep -Fx 'install ok installed'
          if dpkg-query -W -f='${Status}\n' freemkv 2>/dev/null | grep -Fxq 'install ok installed'; then
            echo "freemkv is still installed alongside freemkv-cli"; exit 1
          fi
          test ! -e /usr/share/applications/org.freemkv.FreeMKV.desktop
          expected=$(python3 -c 'import json; print(json.load(open("deb-package/freemkv-cli-${{ matrix.arch }}.json"))["version"])')
          /usr/bin/freemkv --version | tee cli-version.log
          awk -v expected="$expected" '$1 == expected { found=1 } END { exit !found }' cli-version.log
          (ldd /usr/bin/freemkv 2>&1 || true) | tee cli-ldd.log
          grep -Eq 'statically linked|not a dynamic executable' cli-ldd.log
          # A display must not matter: the CLI build prints usage and exits 2.
          status=0
          env DISPLAY=:99 WAYLAND_DISPLAY=wayland-0 /usr/bin/freemkv > cli-usage.log 2>&1 || status=$?
          cat cli-usage.log
          test "$status" -eq 2
      - name: App package replaces the CLI
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./deb-package/freemkv-${{ matrix.arch }}.deb
          dpkg-query -W -f='${Status}\n' freemkv | grep -Fx 'install ok installed'
          if dpkg-query -W -f='${Status}\n' freemkv-cli 2>/dev/null | grep -Fxq 'install ok installed'; then
            echo "freemkv-cli is still installed alongside freemkv"; exit 1
          fi
          ldd /usr/bin/freemkv | grep -F libgtk-4.so
          test -f /usr/share/applications/org.freemkv.FreeMKV.desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deb-validation-${{ matrix.arch }}
          path: |
            version.log
            gui-launch.log
            cli-*.log
          retention-days: 90

  # No hosted armhf runner: the armhf CLI package installs and runs in an
  # arm/v7 Ubuntu 24.04 container under QEMU user emulation.
  install-armhf:
    needs: [plan, build]
    if: contains(needs.plan.outputs.legs, '"armhf"')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { name: deb-package-armhf, path: deb-package }
      - name: Install and run the armhf CLI package
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          expected=$(python3 -c 'import json; print(json.load(open("deb-package/freemkv-cli-armhf.json"))["version"])')
          docker run --rm --platform linux/arm/v7 -v "$PWD/deb-package:/deb:ro" ubuntu:24.04 sh -euc '
            dpkg -i /deb/freemkv-cli-armhf.deb
            dpkg-query -W -f="\${Status}\n" freemkv-cli | grep -Fx "install ok installed"
            /usr/bin/freemkv --version
            status=0; /usr/bin/freemkv > /dev/null 2>&1 || status=$?
            test "$status" -eq 2' | tee cli-armhf.log
          awk -v expected="$expected" '$1 == expected { found=1 } END { exit !found }' cli-armhf.log

  publish:
    needs: [install, install-armhf]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: 'deb-package-*', path: deb-package, merge-multiple: true }
      - name: Attach installed and validated packages to the release
        if: ${{ !inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd deb-package
          for deb in freemkv-amd64.deb freemkv-cli-amd64.deb freemkv-arm64.deb freemkv-cli-arm64.deb freemkv-cli-armhf.deb; do sha256sum "$deb" > "$deb.sha256"; done
          for attempt in $(seq 1 90); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" freemkv-amd64.deb freemkv-amd64.deb.sha256 \
                freemkv-cli-amd64.deb freemkv-cli-amd64.deb.sha256 \
                freemkv-arm64.deb freemkv-arm64.deb.sha256 \
                freemkv-cli-arm64.deb freemkv-cli-arm64.deb.sha256 \
                freemkv-cli-armhf.deb freemkv-cli-armhf.deb.sha256 --clobber
              exit 0
            fi
            echo "Waiting for release $RELEASE_TAG ($attempt/90)"
            sleep 20
          done
          echo "Release $RELEASE_TAG was not created; packages remain in this run."
          exit 1
      # Only the backfill legs were built, so only their packages exist here; the
      # release's amd64 packages are never touched.
      - name: Add the backfilled packages to the existing release
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd deb-package
          debs=(freemkv-*.deb)
          for f in "${debs[@]}"; do sha256sum "$f" > "$f.sha256"; done
          ls -l "${debs[@]}"
          gh release upload "$TAG" freemkv-*.deb freemkv-*.deb.sha256 --clobber

  # The APT repository at freemkv.org/apt indexes every .deb on the latest
  # release; ask marketing's apt.yml to rebuild it now instead of at its daily
  # run. Like FlatPark, a failure here never turns the release red.
  apt:
    needs: publish
    runs-on: ubuntu-24.04
    permissions: {}
    continue-on-error: true
    steps:
      - name: Refresh the freemkv.org APT repository
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: gh api repos/freemkv/marketing/dispatches -f event_type=apt-refresh

  # FlatPark (flatpark.org) repackages freemkv-amd64.deb as a Flatpak. Ping it
  # once the .deb is on the release so the update ships in minutes instead of
  # at its daily scan. No token is sent; FlatPark checks public release state.
  flatpark:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions: {}
    # A FlatPark outage must never turn the release red; the daily scan still
    # picks the release up.
    continue-on-error: true
    steps:
      - uses: flatpark/publish-action@b67fca1b80b095541bc011967e0a35292bed14d8 # v1.0.2
        with:
          app-id: org.freemkv.FreeMKV
          tag: ${{ github.ref_name }}
