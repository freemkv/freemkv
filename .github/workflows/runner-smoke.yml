name: runner-smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: [self-hosted, freemkv-media]
    timeout-minutes: 20
    steps:
      - name: Prove the toolchain the media job depends on is present
        shell: bash
        run: |
          set -euo pipefail
          echo "host: $(uname -a)"
          echo "disk:"; df -h / | tail -1
          source "$HOME/.cargo/env" 2>/dev/null || true
          cargo --version
          ffprobe -version | head -1
          aws --version
          echo "S3 reachable:"; aws s3 ls s3://freemkv-fixtures-usw2-457667483187/ --region us-west-2
