name: runner-smoke
on: { workflow_dispatch: { inputs: { os: { type: string, default: Windows } } } }
jobs:
  smoke:
    runs-on: [self-hosted, freemkv-media, "${{ inputs.os }}"]
    timeout-minutes: 25
    steps:
      - name: Prove the toolchain the full-media job assumes
        shell: bash
        run: |
          set -euo pipefail
          uname -a || ver
          df -h . | tail -1
          cargo --version || "$USERPROFILE/.cargo/bin/cargo" --version
          ffprobe -version | head -1
          aws --version
          aws s3 ls s3://freemkv-fixtures-usw2-457667483187/ --region us-west-2
