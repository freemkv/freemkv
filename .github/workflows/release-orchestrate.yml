name: release-orchestrate

# qa → tags → main, as one action.
#
# This is the last hand-run step. It does NOT reimplement `release.sh`: that
# script is ~1900 lines of version bumping, git-tag re-pin cascade across eight
# repos, tag ordering, artifact waits and main advancement, and rewriting it as
# YAML would trade a proven implementation for an unproven one at exactly the
# moment mistakes are most expensive. It was already built to run here —
# `FMKV_ROOT` exists so CI can point it at a provisioned workspace instead of a
# developer's laptop.
#
# So this workflow's whole job is to BE that workspace: check out all eight
# repos plus the scripts, then hand over.
#
# `release.sh` lives in the `freemkv-ci` repo (private, on GitHub) for one
# reason: hosted runners cannot reach a self-hosted git host on a LAN, and the
# scripts previously lived on one. Nothing else moved.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 1.6.5)
        required: true
        type: string
      dry_run:
        description: Run every check and print the plan, change nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Refuse unless qa is green on all eight
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          # Only true release-quality gates count (CI, leak-guard, qa,
          # hash-matrix, parity). Excluded: the release workflows THEMSELVES —
          # release-orchestrate is the run executing this very check, so counting
          # it makes the check wait on itself forever ("still running"), and a
          # prior failed release-orchestrate at the SHA must not block a re-run —
          # plus the periodic runner-infra workflows (ci-runner-sweeper/-launch),
          # which can be mid-flight at any instant and are not a quality signal.
          NON_GATING: '^(Dependabot Updates|CodeQL|pages-build-deployment|release-orchestrate|release-cascade|Release|ci-runner-launch|ci-runner-sweeper)$'
        run: |
          set -uo pipefail
          fail=0
          for r in freemkv-unlock libfreemkv freemkv-keysources freemkv-i18n \
                   freemkv-engine bdemu freemkv autorip; do
            sha=$(gh api "repos/freemkv/$r/git/ref/heads/qa" -q .object.sha 2>/dev/null || echo "")
            [ -n "$sha" ] || { echo "::error::$r has no qa branch"; fail=1; continue; }
            runs=$(gh api "repos/freemkv/$r/actions/runs?head_sha=$sha&per_page=100" \
                     -q '[.workflow_runs[] | {name, status, conclusion}]')
            gating=$(echo "$runs" | jq --arg re "$NON_GATING" '[.[] | select(.name | test($re) | not)]')
            [ "$(echo "$gating" | jq 'length')" != "0" ] || { echo "::error::$r: no qa run for ${sha:0:7}"; fail=1; continue; }
            [ "$(echo "$gating" | jq '[.[]|select(.status!="completed")]|length')" = "0" ] \
              || { echo "::error::$r: qa still running for ${sha:0:7}"; fail=1; continue; }
            bad=$(echo "$gating" | jq -r '[.[]|select(.conclusion!="success" and .conclusion!="skipped")|.name]|unique|join(", ")')
            [ -z "$bad" ] || { echo "::error::$r: qa ${sha:0:7} not green ($bad)"; fail=1; continue; }
            echo "  ✓ $r: qa ${sha:0:7} green"
          done
          [ "$fail" = "0" ] || { echo "::error::refusing to release — qa is not green across the set"; exit 1; }

      # release.sh expects the eight repos side by side under one root, the way
      # an operator checkout looks. Provision exactly that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-ci, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ci }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-unlock,     ref: qa, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ws/freemkv-unlock,     fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/libfreemkv,         ref: qa, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ws/libfreemkv,         fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-keysources, ref: qa, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ws/freemkv-keysources, fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-i18n,       ref: qa, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ws/freemkv-i18n,       fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv-engine,     ref: qa, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ws/freemkv-engine,     fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/bdemu,              ref: qa, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ws/bdemu,              fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv,            ref: qa, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ws/freemkv,            fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/autorip,            ref: qa, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ws/autorip,            fetch-depth: 0 }
      # The public docs site. release.sh updates its changelog page + download
      # version and pushes them, then a final gate verifies the site names this
      # release; without this checkout that whole step silently no-op'd, which is
      # how 1.6.5 shipped with freemkv.org stuck on 1.6.4. It has no dev/qa — it
      # IS the deployed artifact — so it comes in on `main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: freemkv/freemkv.github.io,  ref: main, token: "${{ secrets.ORG_DISPATCH_TOKEN }}", path: ws/freemkv.github.io,  fetch-depth: 0 }

      # Pinned to a commit SHA, not the floating `1.98.0` BRANCH. dtolnay/rust-
      # toolchain has no version tags (only `v1` + per-toolchain branches), and
      # `@1.98.0` is a mutable branch ref. Pinning by SHA loses the ref-name the
      # action uses to pick the toolchain, so name it explicitly via `toolchain`.
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          toolchain: 1.98.0

      - name: Identify as the release bot
        run: |
          git config --global user.name  "freemkv release"
          git config --global user.email "dev@getbusbar.com"
          git config --global url."https://x-access-token:${{ secrets.ORG_DISPATCH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: release.sh
        env:
          FMKV_ROOT: ${{ github.workspace }}/ws
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          # The script's own branch model: it operates on WORK_BRANCH and moves
          # `main` only at the end, so `main` always equals the newest tag.
          WORK_BRANCH: qa
        run: |
          set -euo pipefail
          chmod +x ci/scripts/*.sh
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ci/scripts/release.sh --dry-run "${{ inputs.version }}"
          else
            ci/scripts/release.sh "${{ inputs.version }}"
          fi
