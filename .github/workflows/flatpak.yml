name: Flatpak

# Candidate source and dependencies are snapshotted once, then built offline.
on:
  workflow_dispatch:
  push:
    branches: [dev, qa]
    tags: ['v*', '!v*-rc*']
  pull_request:
    paths: ['packaging/flatpak/**', '.github/workflows/flatpak.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaging-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s packaging/flatpak -p 'test_*.py' -v

  prepare:
    needs: packaging-tests
    if: github.ref_name == 'qa' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: checkouts/freemkv }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Snapshot matching candidate or release dependencies
        env:
          BUILD_REF: ${{ github.ref_name }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$BUILD_REF_TYPE" = tag ]; then
            ref="$BUILD_REF"
          elif [ "$BUILD_REF" = dev ]; then
            ref=dev
          else
            ref=qa
          fi
          for repo in libfreemkv freemkv-engine freemkv-keysources freemkv-i18n freemkv-unlock; do
            git clone --depth 1 --branch "$ref" "https://github.com/freemkv/$repo.git" "checkouts/$repo"
          done
          python checkouts/freemkv/packaging/flatpak/prepare.py --checkouts checkouts --output flatpak-package
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          path: flatpak-package
          if-no-files-found: error
          retention-days: 90

  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/download-artifact@v4
        with: { name: flatpak-package, path: flatpak-package }
      - name: Lint current manifest
        run: flatpak-builder-lint manifest flatpak-package/org.freemkv.FreeMKV.json
      - name: Build current package offline
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: freemkv.flatpak
          manifest-path: flatpak-package/org.freemkv.FreeMKV.json
          cache-key: flatpak-builder-${{ github.sha }}
          mirror-screenshots-url: https://dl.flathub.org/media
          upload-artifact: true
      - name: Lint built repository
        run: flatpak-builder-lint repo repo
      - name: Check installed version and GUI launch
        shell: bash
        run: |
          set -euo pipefail
          flatpak install --user --noninteractive ./freemkv.flatpak
          expected=$(python3 -c 'import json; print(json.load(open("flatpak-package/provenance.json"))["version"])')
          flatpak run --command=freemkv org.freemkv.FreeMKV --version | tee version.log
          awk -v expected="$expected" '$1 == expected { found=1 } END { exit !found }' version.log
          status=0
          xvfb-run --auto-servernum dbus-run-session -- \
            timeout 15s flatpak run --env=GDK_BACKEND=x11 \
              org.freemkv.FreeMKV > gui-launch.log 2>&1 || status=$?
          cat gui-launch.log
          if [ "$status" -ne 124 ]; then
            echo "Expected a running GUI; launcher exited with status $status"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak-validation
          path: |
            gui-launch.log
            version.log
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-validated-binary
          path: freemkv.flatpak
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: flatpak-package, path: flatpak-package }
      - uses: actions/download-artifact@v4
        with: { name: flatpak-validated-binary, path: binary }
      - name: Attach validated package to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tar -czf freemkv-flatpak-package.tar.gz flatpak-package
          cp binary/freemkv.flatpak freemkv-x86_64-linux.flatpak
          for f in freemkv-x86_64-linux.flatpak freemkv-flatpak-package.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
          for attempt in $(seq 1 90); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" freemkv-x86_64-linux.flatpak* \
                freemkv-flatpak-package.tar.gz* --clobber
              exit 0
            fi
            echo "Waiting for release $RELEASE_TAG ($attempt/90)"
            sleep 20
          done
          echo "Release $RELEASE_TAG was not created; validated artifacts remain in this run."
          exit 1
