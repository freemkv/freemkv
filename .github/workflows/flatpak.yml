name: Flatpak

# Validates the Flathub submission manifest the same way Flathub's own CI
# does: build OFFLINE in the current Flathub runtime container, then run
# flatpak-builder-lint on both the manifest and the built repo, then check
# the installed GUI starts. Physical drive and interactive testing is manual.
#
# Runs on the flathub-submission branch and on manual dispatch. Not part of
# the dev/qa/main fast-path; the CLI+GUI compile is covered by ci.yml.
on:
  workflow_dispatch:
  push:
    branches: [flathub-submission]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # gnome-51 == org.gnome.Platform/Sdk 51, the current Flathub runtime.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      # Lint the manifest before building (fast fail on structural issues).
      - name: Lint manifest
        run: flatpak-builder-lint manifest packaging/flatpak/org.freemkv.FreeMKV.yaml

      # Offline build in the Flathub container. No siblings checkout and no
      # network `cargo build`: sources come from the pinned git tag and the
      # vendored cargo-sources.json.
      - name: Build (offline)
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: freemkv.flatpak
          manifest-path: packaging/flatpak/org.freemkv.FreeMKV.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          mirror-screenshots-url: https://dl.flathub.org/media
          upload-artifact: true

      # Keep strict lint blocking: no per-app exceptions are needed today.
      - name: Lint repo
        run: flatpak-builder-lint repo repo

      - name: Check installed GUI launch
        shell: bash
        run: |
          flatpak install --user --noninteractive ./freemkv.flatpak
          # A GUI should stay running until timeout; CLI help exits immediately.
          # This exercises the default manifest command without an explicit gui arg.
          status=0
          xvfb-run --auto-servernum dbus-run-session -- \
            timeout 15s flatpak run --env=GDK_BACKEND=x11 \
              org.freemkv.FreeMKV > gui-launch.log 2>&1 || status=$?
          cat gui-launch.log
          if [ "$status" -ne 124 ]; then
            echo "Expected a running GUI; launcher exited with status $status"
            exit 1
          fi
