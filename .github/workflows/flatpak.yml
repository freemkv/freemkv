name: Flatpak

# Validates the Flathub submission manifest the same way Flathub's own CI
# does: build OFFLINE in the current Flathub runtime container, then run
# flatpak-builder-lint on both the manifest and the built repo. Green here
# means it builds and lints on Flathub's infrastructure.
#
# Runs on the flathub-submission branch and on manual dispatch. Not part of
# the dev/qa/main fast-path; the CLI+GUI compile is covered by ci.yml.
on:
  workflow_dispatch:
  push:
    branches: [flathub-submission]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # gnome-51 == org.gnome.Platform/Sdk 51, the current Flathub runtime.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      # Lint the manifest before building (fast fail on structural issues).
      - name: Lint manifest
        run: flatpak-builder-lint manifest packaging/flatpak/org.freemkv.FreeMKV.yaml

      # Offline build in the Flathub container. No siblings checkout and no
      # network `cargo build`: sources come from the pinned git tag and the
      # vendored cargo-sources.json.
      - name: Build (offline)
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: freemkv.flatpak
          manifest-path: packaging/flatpak/org.freemkv.FreeMKV.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          mirror-screenshots-url: https://dl.flathub.org/media
          upload-artifact: true

      # Lint the built repo the way Flathub gates submissions. --exceptions
      # allows entries Flathub explicitly permits per-app (e.g. --device=all
      # for optical-media tools) once granted.
      - name: Lint repo
        run: flatpak-builder-lint --exceptions repo repo
