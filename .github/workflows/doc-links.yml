name: doc-links

# Thin caller → the canonical reusable doc-links gate in freemkv/.github.
# The old per-repo copy documented freemkv alone with a plain checkout: it needs
# no sibling checkout because the committed [patch.crates-io] git tags in
# Cargo.toml already resolve the four freemkv deps for a `cargo doc` build. So no
# `checkout`/`patch` here — only `self`. The reusable gate resolves the toolchain
# from Cargo.toml's rust-version and keeps the same default doc args
# (--no-deps --document-private-items --lib --bins).
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc-links:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: freemkv/.github/.github/workflows/guard-doclinks.yml@v1
    with:
      self: freemkv
