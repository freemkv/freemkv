name: Arch Linux package

# pacman packages (.pkg.tar.zst) for Arch Linux and Arch Linux ARM, repackaged
# from the release's validated .debs (packaging/arch/deb2pkg.py): same
# binaries, so nothing is compiled here. Every .deb on the release becomes a
# package, any architecture (amd64 -> x86_64, arm64 -> aarch64, armhf -> armv7h).
# freemkv.org/arch (marketing's arch.yml) indexes them; the payloads stay here.
#
#   tag push        wait for deb.yml's .debs on the release, convert, install-test,
#                   sign (.sig), attach freemkv-*.pkg.tar.zst, refresh freemkv.org/arch
#   dispatch + tag  the same for an existing release (backfill):
#                     gh workflow run arch.yml --ref dev -f tag=v1.8.0
#   dev/qa/PR       convert the LATEST release's .debs and install-test; publish nothing
#
# Packages are signed with secret APT_SIGNING_KEY (the freemkv.org repository key).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to add pacman packages to (e.g. v1.8.0); empty = test only
        type: string
        default: ''
  push:
    branches: [dev, qa]
    tags: ['v*', '!v*-rc*']
  pull_request:
    paths: ['packaging/arch/**', '.github/workflows/arch.yml']

concurrency:
  group: arch-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaging-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s packaging/arch -p 'test_*.py' -v

  debs:
    needs: packaging-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - name: Pick the release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; publish=true
          elif [ -n "$INPUT_TAG" ]; then tag=$INPUT_TAG; publish=true
          else tag=$(gh release view --json tagName -q .tagName); publish=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release $tag, publish=$publish"
      # On a tag, deb.yml attaches the .debs after building and installing
      # them; wait until they are there and the asset list has settled.
      - name: Wait for the release's .debs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          last=
          for attempt in $(seq 1 280); do
            debs=$(gh release view "$TAG" --json assets -q '[.assets[].name | select(endswith(".deb"))] | sort | join(" ")' 2>/dev/null || true)
            case " $debs " in
              *" freemkv-amd64.deb "*" freemkv-cli-amd64.deb "*)
                if [ "$debs" = "$last" ]; then echo "debs: $debs"; exit 0; fi ;;
            esac
            last=$debs
            echo "waiting for $TAG .debs ($attempt): ${debs:-none}"
            sleep 30
          done
          echo "the .debs never appeared on $TAG"; exit 1
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.deb' --pattern '*.deb.sha256' --dir debs
          cd debs && for f in *.deb; do
            [ -f "$f.sha256" ] && sha256sum -c "$f.sha256"
          done
          ls -l
      - uses: actions/upload-artifact@v7
        with: { name: debs, path: debs/*.deb, if-no-files-found: error, retention-days: 7 }

  build:
    needs: debs
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v8
        with: { name: debs, path: debs }
      - name: Convert
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel python zstd
          useradd --create-home builder
          install -d -o builder out
          chown -R builder debs
          runuser -u builder -- python3 packaging/arch/deb2pkg.py --output out \
            --floor gtk4=4.10 --floor libadwaita=1.4 debs/*.deb
          for p in out/*.pkg.tar.zst; do echo "== $p"; pacman -Qip "$p"; pacman -Qlp "$p"; done
      - name: Sign
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY }}
          PUBLISH: ${{ needs.debs.outputs.publish }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            [ "$PUBLISH" = true ] && { echo "APT_SIGNING_KEY is required to publish"; exit 1; }
            echo "::notice::no APT_SIGNING_KEY here; packages left unsigned (test run)"; exit 0
          fi
          GNUPGHOME=$(mktemp -d); export GNUPGHOME
          printf '%s\n' "$KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          gpg --armor --export "$fpr" > out/freemkv.asc
          for p in out/*.pkg.tar.zst; do
            gpg --batch --pinentry-mode loopback --local-user "$fpr" --detach-sign --no-armor -o "$p.sig" "$p"
            gpg --verify "$p.sig" "$p"
          done
      - uses: actions/upload-artifact@v7
        with: { name: arch-package, path: out, if-no-files-found: error, retention-days: 90 }

  # No hosted Arch Linux ARM runner: the aarch64/armv7h packages are built and
  # signed with the same payload as the .debs deb.yml installs on arm64/armhf.
  install:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: arch-package, path: pkgs }
      - name: CLI package installs, is static and runs
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          if [ -f pkgs/freemkv.asc ]; then
            pacman-key --init
            pacman-key --add pkgs/freemkv.asc
            fpr=$(gpg --with-colons --show-keys pkgs/freemkv.asc | awk -F: '/^fpr/{print $10; exit}')
            pacman-key --lsign-key "$fpr"
            for s in pkgs/*.sig; do pacman-key --verify "$s" "${s%.sig}"; done
          fi
          pacman -U --noconfirm ./pkgs/freemkv-cli-x86_64.pkg.tar.zst
          pacman -Q freemkv-cli
          expected=$(pacman -Qip pkgs/freemkv-cli-x86_64.pkg.tar.zst | awk '/^Version/{sub(/-[0-9]+$/, "", $3); print $3}')
          /usr/bin/freemkv --version | tee cli-version.log
          awk -v e="$expected" '$1 == e { f=1 } END { exit !f }' cli-version.log
          status=0; /usr/bin/freemkv > /dev/null 2>&1 || status=$?
          test "$status" -eq 2
      - name: App package replaces the CLI and runs
        run: |
          set -euo pipefail
          pacman -R --noconfirm freemkv-cli
          pacman -U --noconfirm ./pkgs/freemkv-x86_64.pkg.tar.zst
          pacman -S --noconfirm --needed xorg-server-xvfb dbus
          pacman -Q freemkv
          ldd /usr/bin/freemkv | grep -F libgtk-4.so
          test -f /usr/share/applications/org.freemkv.FreeMKV.desktop
          test -f /usr/share/licenses/freemkv/LICENSE
          freemkv --version
      - name: Launch the installed GUI without a terminal
        run: |
          set -euo pipefail
          useradd --create-home tester
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          status=0
          runuser -u tester -- env DISPLAY=:99 GDK_BACKEND=x11 \
            timeout 15s dbus-run-session -- /usr/bin/freemkv > gui-launch.log 2>&1 || status=$?
          cat gui-launch.log
          test "$status" -eq 124

  publish:
    needs: [debs, install]
    if: needs.debs.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: arch-package, path: arch-package }
      - name: Attach the installed and validated packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.debs.outputs.tag }}
        run: |
          set -euo pipefail
          cd arch-package
          pkgs=(freemkv-*.pkg.tar.zst)
          for f in "${pkgs[@]}"; do sha256sum "$f" > "$f.sha256"; done
          ls -l
          gh release upload "$TAG" freemkv-*.pkg.tar.zst freemkv-*.pkg.tar.zst.sig freemkv-*.pkg.tar.zst.sha256 --clobber
      # A marketing outage must not turn the release red; arch.yml there also runs daily.
      - name: Refresh the freemkv.org pacman repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: gh api repos/freemkv/marketing/dispatches -f event_type=arch-refresh
