name: Release

on:
  push:
    tags:
      - 'v*'
      # NOT the release-candidate tags. Every push to `qa` stamps a
      # v<version>-rc<N> so a run can be named, and 'v*' matches those too —
      # which would have this workflow build and PUBLISH a GitHub release for
      # every candidate, including the red ones.
      - '!v*-rc*'

# Least privilege at the top; only the jobs that create/upload the GitHub
# release (build, build-windows, cli-binaries) elevate to contents: write. The
# tap and homepage jobs write to OTHER repos via a PAT (ORG_DISPATCH_TOKEN), so
# they need no write on GITHUB_TOKEN here.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Cargo.toml version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VER="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          if [ "$CARGO_VER" != "$TAG" ]; then
            echo "::error::Cargo.toml says $CARGO_VER but tag is $TAG"
            exit 1
          fi
          echo "Version match: $CARGO_VER"
      # The .app's version is what the user sees in About, so it must agree too.
      # A stale Info.plist ships a build that lies about which release it is.
      - name: Verify Info.plist version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PLIST_VER="v$(sed -n 's/.*<key>CFBundleShortVersionString<\/key><string>\(.*\)<\/string>.*/\1/p' macos/Info.plist)"
          if [ "$PLIST_VER" != "$TAG" ]; then
            echo "::error::Info.plist says $PLIST_VER but tag is $TAG"
            exit 1
          fi
          echo "Info.plist match: $PLIST_VER"

  # Parallel tripwire, exactly as the CLI does it: fails the run, but `build`
  # does NOT `needs:` it, so packaging starts as soon as `verify` passes. The
  # tag decision was already gated by CI (ci.yml on dev, then a green qa.yml) on the same exact Rust.
  test:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exact toolchain (rust-version)
        run: bash .github/scripts/exact-toolchain.sh install Cargo.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clean build environment and C toolchain
        run: bash .github/scripts/exact-toolchain.sh assert-env "$(rustc -vV | sed -n 's/^host: //p')"
      - run: cargo test --locked --tests
      - run: cargo test --locked --tests --features gui

  # ── macOS app (`gui` build) ─────────────────────────────────────────────────
  build:
    # NOTE: deliberately does NOT `needs: test` — see the test job above.
    needs: verify
    # Uploads assets to the GitHub release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # One .app per arch, mirroring the CLI's two macOS legs.
        include:
          - target: aarch64-apple-darwin
            asset: freemkv-aarch64-macos
          - target: x86_64-apple-darwin
            asset: freemkv-x86_64-macos

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exact toolchain (rust-version)
        shell: bash
        run: bash .github/scripts/exact-toolchain.sh install Cargo.toml "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Clean build environment and C toolchain
        run: bash .github/scripts/exact-toolchain.sh assert-env "${{ matrix.target }}"
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --features gui --bin freemkv

      # ── Developer ID signing ──────────────────────────────────────────────
      #
      # Absent the secrets this is a no-op and the build stays ad-hoc signed,
      # exactly as before. That is the required behaviour, not a convenience:
      # a fork's CI cannot read secrets, so a hard failure here would mean
      # nobody but this repo could build the app at all.
      - name: Import the Developer ID certificate
        id: signing
        uses: ./.github/actions/import-developer-id
        with:
          certificate-p12: ${{ secrets.MACOS_CERT_P12 }}
          certificate-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}

      - name: Bundle freemkv.app
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: bash macos/bundle.sh release ${{ matrix.target }}

      # The .dmg only. The .zip and the checksums are built AFTER stapling —
      # a zip made here would carry an un-stapled .app, and its hash would not
      # match the file that actually ships.
      - name: Package the disk image
        run: |
          hdiutil create -volname "freemkv" -srcfolder target/freemkv.app \
            -ov -format UDZO "${{ matrix.asset }}.dmg"

      # ── Notarization ──────────────────────────────────────────────────────
      #
      # Apple scans the upload and issues a ticket; stapling attaches that
      # ticket to the file so Gatekeeper accepts it with NO network. Skipping
      # the staple is the subtle failure: it passes every test on a connected
      # machine and refuses to launch on an offline one.
      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          A="${{ matrix.asset }}"
          # --wait blocks until Apple returns a verdict; without it the job
          # would "succeed" having only queued the submission.
          if ! xcrun notarytool submit "$A.dmg" \
                 --key "$RUNNER_TEMP/notary.p8" \
                 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
                 --wait --timeout 30m; then
            echo "::error::notarization was rejected — fetching the log"
            xcrun notarytool log "$(xcrun notarytool history \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" --output-format json \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["history"][0]["id"])')" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
            rm -f "$RUNNER_TEMP/notary.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$A.dmg"
          # Staple the .app as well, so the .zip built next carries the ticket
          # too. A ticket cannot be attached to a bare binary or to a .zip.
          xcrun stapler staple target/freemkv.app

      - name: Finalize artifacts
        run: |
          set -euo pipefail
          A="${{ matrix.asset }}"
          # Built from the (now stapled) .app. The .zip is for scripted
          # installs — brew casks, MDM — that would rather not mount a .dmg.
          ditto -c -k --keepParent target/freemkv.app "$A.zip"
          shasum -a 256 "$A.dmg" > "$A.dmg.sha256"
          shasum -a 256 "$A.zip" > "$A.zip.sha256"

      - name: Verify the bundle
        run: |
          BIN=target/freemkv.app/Contents/MacOS/freemkv
          # A .dmg built for the wrong arch is indistinguishable from the right
          # one until a user double-clicks it, so pin the arch here.
          case "${{ matrix.target }}" in
            aarch64-*) WANT=arm64 ;;
            x86_64-*)  WANT=x86_64 ;;
          esac
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -qw "$WANT" \
            || { echo "::error::expected $WANT in $(lipo -archs "$BIN")"; exit 1; }
          # No AppKit means the CLI build got bundled as the app.
          otool -L "$BIN" | grep -q AppKit.framework \
            || { echo "::error::$BIN does not link AppKit — built without --features gui?"; exit 1; }
          # An .app that fails signature validation is one Gatekeeper refuses
          # to open, which users report as "the app is damaged".
          codesign --verify --deep --strict --verbose=2 target/freemkv.app

          # When signed for real, prove the thing users actually download would
          # pass Gatekeeper. codesign only says the signature is well-formed --
          # it says nothing about WHO signed it or whether Apple has seen it,
          # so an ad-hoc bundle passes the check above and is still refused on
          # every other Mac. These two are the checks that would have caught
          # that: spctl evaluates the policy, stapler proves the ticket is
          # attached and therefore works offline.
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            spctl -a -vvv -t install "${{ matrix.asset }}.dmg"
            xcrun stapler validate "${{ matrix.asset }}.dmg"
            codesign -dv --verbose=4 target/freemkv.app 2>&1 | grep -q "Authority=Developer ID Application" \
              || { echo "::error::bundle is not signed by a Developer ID authority"; exit 1; }
          else
            echo "ad-hoc build — skipping Gatekeeper checks (they would fail by design)"
          fi

      - name: Upload
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            ${{ matrix.asset }}.dmg
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.dmg.sha256
            ${{ matrix.asset }}.zip.sha256

  # ── Windows app (`gui` build) ───────────────────────────────────────────────
  # The build yields two images of one program: console `freemkv.exe` and
  # windows-subsystem `freemkv-gui.exe`. They ship as `freemkv.com` (CLI; wins
  # PATHEXT lookup) and `freemkv.exe` (double-click → window), in a portable
  # .zip and a per-user Inno Setup installer (packaging/windows/freemkv.iss).
  build-windows:
    # Same rationale as `build`: does NOT `needs: test` (parallel tripwire).
    needs: verify
    # Uploads assets to the GitHub release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # x64 only: no hosted ARM64 Windows runner; x64 runs emulated there.
        include:
          - target: x86_64-pc-windows-msvc
            asset: freemkv-x86_64-windows

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exact toolchain (rust-version)
        shell: bash
        run: bash .github/scripts/exact-toolchain.sh install Cargo.toml "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}-app

      - name: Clean build environment and C toolchain
        shell: bash
        run: bash .github/scripts/exact-toolchain.sh assert-env "${{ matrix.target }}"
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --features gui

      - name: Stage and zip
        shell: pwsh
        run: |
          $a   = "${{ matrix.asset }}"
          $rel = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item "$rel/freemkv-gui.exe" stage/freemkv.exe
          Copy-Item "$rel/freemkv.exe" stage/freemkv.com
          Compress-Archive -Path stage/* -DestinationPath "$a.zip" -Force

      - name: Build the installer
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.4.3 -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $ver = $env:TAG.TrimStart('v')
          & $iscc "/DAppVersion=$ver" "/DBinDir=$((Resolve-Path stage).Path)" "/O$PWD" packaging/windows/freemkv.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc exited $LASTEXITCODE" }

      - name: Verify
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG.TrimStart('v')
          $a   = "${{ matrix.asset }}"
          function Get-Subsystem($path) {
            $b  = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            if ([Text.Encoding]::ASCII.GetString($b, $pe, 4) -ne "PE`0`0") { throw "$path is not a PE image" }
            # Subsystem sits at optional-header offset 68 in both PE32 and PE32+.
            [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          }
          $names = ([IO.Compression.ZipFile]::OpenRead((Resolve-Path "$a.zip").Path).Entries.FullName | Sort-Object) -join ','
          Write-Output "zip contents: $names"
          if ($names -ne 'freemkv.com,freemkv.exe') { throw "$a.zip must hold exactly freemkv.com + freemkv.exe" }
          $gui = Get-Subsystem stage/freemkv.exe
          $con = Get-Subsystem stage/freemkv.com
          if ($gui -ne 2) { throw "freemkv.exe subsystem is $gui, want 2 (windows)" }
          if ($con -ne 3) { throw "freemkv.com subsystem is $con, want 3 (console)" }
          $out = & ./stage/freemkv.com --version
          if ($LASTEXITCODE -ne 0) { throw "freemkv.com --version exited $LASTEXITCODE" }
          Write-Output "freemkv.com --version => $out"
          if ("$out" -notmatch [regex]::Escape($ver)) { throw "freemkv.com --version does not report $ver" }
          if (-not (Test-Path "$a-setup.exe")) { throw "$a-setup.exe was not built" }

      # Round-trip the installer: files, shortcut and PATH land; uninstall
      # removes them and leaves the user's other PATH entries intact.
      - name: Verify the installer
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\freemkv"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\freemkv.lnk"
          $userPath = { [Environment]::GetEnvironmentVariable('Path', 'User') }
          $keep = @("$env:RUNNER_TEMP\keep-a", "$env:RUNNER_TEMP\keep-b")
          [Environment]::SetEnvironmentVariable('Path', ((@((& $userPath) -split ';') + $keep) | Where-Object { $_ }) -join ';', 'User')
          $before = (& $userPath) -split ';'
          Start-Process -Wait "./${{ matrix.asset }}-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          foreach ($f in 'freemkv.exe','freemkv.com','unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "installer did not create $dir\$f" }
          }
          if (-not (Test-Path $lnk)) { throw "installer did not create $lnk" }
          if ((& $userPath) -split ';' -notcontains $dir) { throw "installer did not add $dir to the user PATH" }
          & "$dir\freemkv.com" --version
          if ($LASTEXITCODE -ne 0) { throw "installed freemkv.com --version exited $LASTEXITCODE" }
          # The bare name must resolve to the console .com (PATHEXT), not the windowed .exe.
          $env:Path = (& $userPath) + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $bare = (Get-Command freemkv -CommandType Application | Select-Object -First 1).Source
          if ($bare -ne "$dir\freemkv.com") { throw "bare 'freemkv' resolves to $bare, want $dir\freemkv.com" }
          freemkv --version
          if ($LASTEXITCODE -ne 0) { throw "bare freemkv --version exited $LASTEXITCODE" }
          Start-Process -Wait "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          # The uninstaller relaunches itself from %TEMP%, so -Wait can return early.
          $done = { -not (Test-Path "$dir\freemkv.exe") -and ((& $userPath) -split ';' -notcontains $dir) }
          for ($i = 0; $i -lt 60 -and -not (& $done); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\freemkv.exe") { throw "uninstaller left $dir\freemkv.exe" }
          if ((& $userPath) -split ';' -contains $dir) { throw "uninstaller left $dir on the user PATH" }
          if (Test-Path $lnk) { throw "uninstaller left $lnk" }
          $after = (& $userPath) -split ';'
          if (Compare-Object $before $after -SyncWindow 0) { throw "uninstall changed other user PATH entries: '$($before -join ';')' -> '$($after -join ';')'" }

      - name: Checksums
        shell: bash
        run: |
          A="${{ matrix.asset }}"
          sha256sum "$A.zip" > "$A.zip.sha256"
          sha256sum "$A-setup.exe" > "$A-setup.exe.sha256"

      - name: Upload
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256
            ${{ matrix.asset }}-setup.exe
            ${{ matrix.asset }}-setup.exe.sha256

  # ── CLI (no features) ───────────────────────────────────────────────────────
  # Bare binaries, no UI libraries; Linux is static musl. `legacy` re-uploads
  # the same bytes under the pre-split name so old `releases/latest/download/`
  # URLs keep working for one release cycle.
  cli-binaries:
    needs: verify
    # Uploads assets to the GitHub release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: freemkv-cli-x86_64-linux
            legacy: freemkv-x86_64-linux
            ext: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: freemkv-cli-aarch64-linux
            legacy: freemkv-aarch64-linux
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: freemkv-cli-aarch64-macos
            legacy: freemkv-aarch64-macos
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: freemkv-cli-x86_64-macos
            legacy: freemkv-x86_64-macos
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: freemkv-cli-x86_64-windows
            legacy: freemkv-x86_64-windows
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exact toolchain (rust-version)
        shell: bash
        run: bash .github/scripts/exact-toolchain.sh install Cargo.toml "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # arm64 musl goes through `cross`: mimalloc-sys and ring compile C, which
      # a plain x86 `cargo build --target` cannot link.
      # Pinned + hash-checked like linuxdeploy in appimage.yml; the build image by digest.
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          curl -fsSLo cross.tar.gz https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz
          echo 'a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588  cross.tar.gz' | sha256sum -c -
          tar xzf cross.tar.gz cross
          sudo mv cross /usr/local/bin/
          echo 'CROSS_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_IMAGE=ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4' >> "$GITHUB_ENV"
      - name: Clean build environment and C toolchain
        shell: bash
        run: bash .github/scripts/exact-toolchain.sh assert-env "${{ matrix.target }}"
      - name: Build CLI
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --locked --release --target ${{ matrix.target }} --bin freemkv
      - name: Build CLI (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --locked --release --target ${{ matrix.target }} --bin freemkv

      # The CLI must not pull in UI libraries: none at all on static Linux,
      # no AppKit/UserNotifications on macOS.
      - name: Verify no UI libraries are linked
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/freemkv"
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L "$BIN"
            if otool -L "$BIN" | grep -Eq 'AppKit|UserNotifications'; then
              echo "::error::the CLI links a UI framework"; exit 1
            fi
          else
            if readelf -d "$BIN" | grep -q NEEDED; then
              readelf -d "$BIN"
              echo "::error::the Linux CLI is not static"; exit 1
            fi
          fi

      # Downloaded bare binaries are quarantined like the .app, so they need
      # signing and notarizing too.
      - name: Import the Developer ID certificate
        id: signing
        if: runner.os == 'macOS'
        uses: ./.github/actions/import-developer-id
        with:
          certificate-p12: ${{ secrets.MACOS_CERT_P12 }}
          certificate-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}

      - name: Sign and notarize the macOS CLI
        if: runner.os == 'macOS' && steps.signing.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/freemkv"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          # notarytool takes only .zip/.dmg/.pkg, and a bare Mach-O cannot be
          # stapled, so first run still needs Apple reachable.
          ditto -c -k "$BIN" "$RUNNER_TEMP/notarize-cli.zip"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$RUNNER_TEMP/notarize-cli.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize-cli.zip"
          codesign -dv --verbose=4 "$BIN" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::CLI is not signed by a Developer ID authority"; exit 1; }

      - name: Package
        shell: bash
        run: |
          A="${{ matrix.asset }}"
          L="${{ matrix.legacy }}"
          E="${{ matrix.ext }}"
          BIN="target/${{ matrix.target }}/release/freemkv$E"
          cp "$BIN" "$A$E"
          cp "$BIN" "$L$E"
          # Hash AFTER signing: a signature rewrites the binary.
          if [ "$RUNNER_OS" = "macOS" ]; then SHA="shasum -a 256"; else SHA=sha256sum; fi
          $SHA "$A$E" > "$A$E.sha256"
          $SHA "$L$E" > "$L$E.sha256"
      - name: Upload
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            ${{ matrix.asset }}${{ matrix.ext }}
            ${{ matrix.asset }}${{ matrix.ext }}.sha256
            ${{ matrix.legacy }}${{ matrix.ext }}
            ${{ matrix.legacy }}${{ matrix.ext }}.sha256

  # ── Linux desktop app (AppImage, bundles GTK4 + libadwaita) ─────────────
  linux-appimage:
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/appimage.yml
    with:
      release: true

  # ── Homebrew tap ────────────────────────────────────────────────────────
  #
  # brew is the install path with no friction on macOS: Homebrew fetches with
  # curl, which never sets com.apple.quarantine, so nothing has to be allowed
  # through System Settings the way a browser download does. That only holds if
  # the tap actually points at this release, so it is updated here rather than
  # by hand -- a tap left behind is a tap that installs the previous version
  # while the download page advertises this one.
  #
  # Runs after every artifact job: update.sh reads the checksums from the
  # published assets, so they all have to exist first.
  update-homebrew-tap:
    needs: [build, build-windows, cli-binaries]
    if: always() && needs.build.result == 'success' && needs['cli-binaries'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update the tap to this release
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          VER: ${{ github.ref_name }}
          # Free-text actor passed via env, not interpolated into the run script.
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || {
            echo "::warning::ORG_DISPATCH_TOKEN is not set — the Homebrew tap was NOT updated"
            echo "::warning::brew install will keep serving the previous release until it is"
            exit 0
          }
          git clone --depth 1 \
            "https://x-access-token:$GH_TOKEN@github.com/freemkv/homebrew-tap.git" tap
          cd tap
          ./update.sh "${VER#v}"
          if git diff --quiet; then
            echo "tap already at ${VER#v} — nothing to do"
            exit 0
          fi
          git config user.name  "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          git commit -aqm "freemkv ${VER#v}"
          git push
          echo "tap updated to ${VER#v}" >> "$GITHUB_STEP_SUMMARY"

  update-homepage:
    needs: [build, build-windows, cli-binaries]
    # Gated on the desktop apps only (macOS + Windows): the org README advertises
    # the release, and a release with no shippable app is not one to advertise.
    # `always()` + explicit result checks so a failed CLI leg does not silently
    # skip the dispatch, and a failed app leg definitively does.
    # NOTE: bracket form for `build-windows` — a hyphen in a job id is parsed as
    # subtraction in the dot form, so `needs.build-windows.result` is invalid.
    if: always() && needs.build.result == 'success' && needs['build-windows'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update org README with new version
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}
          repository: freemkv/.github
          event-type: new-release
          client-payload: '{"version": ${{ toJSON(github.ref_name) }}}'
