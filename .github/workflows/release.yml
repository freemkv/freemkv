name: Release

on:
  push:
    tags:
      - 'v*'
      # NOT the release-candidate tags. Every push to `qa` stamps a
      # v<version>-rc<N> so a run can be named, and 'v*' matches those too —
      # which would have this workflow build and PUBLISH a GitHub release for
      # every candidate, including the red ones.
      - '!v*-rc*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VER="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          if [ "$CARGO_VER" != "${{ github.ref_name }}" ]; then
            echo "::error::Cargo.toml says $CARGO_VER but tag is ${{ github.ref_name }}"
            exit 1
          fi
          echo "Version match: $CARGO_VER"
      # The .app's version is what the user sees in About, so it must agree too.
      # A stale Info.plist ships a build that lies about which release it is.
      - name: Verify Info.plist version matches tag
        run: |
          PLIST_VER="v$(sed -n 's/.*<key>CFBundleShortVersionString<\/key><string>\(.*\)<\/string>.*/\1/p' macos/Info.plist)"
          if [ "$PLIST_VER" != "${{ github.ref_name }}" ]; then
            echo "::error::Info.plist says $PLIST_VER but tag is ${{ github.ref_name }}"
            exit 1
          fi
          echo "Info.plist match: $PLIST_VER"

  # Parallel tripwire, exactly as the CLI does it: fails the run, but `build`
  # does NOT `needs:` it, so packaging starts as soon as `verify` passes. The
  # tag decision was already gated by the local precommit on the same Rust 1.89.
  test:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --tests

  build:
    # NOTE: deliberately does NOT `needs: test` — see the test job above.
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # Two macOS flavors, mirroring the CLI — which ships BOTH, so these
        # genuinely mirror it. (This comment used to claim the CLI dropped
        # x86_64-apple-darwin over a linker issue; its own matrix below
        # contradicted that, and the target builds. Corrected rather than
        # deleted so nobody re-derives the false constraint from the history.)
        include:
          - target: aarch64-apple-darwin
            asset: freemkv-aarch64-macos
          - target: x86_64-apple-darwin
            asset: freemkv-x86_64-macos

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ── Developer ID signing ──────────────────────────────────────────────
      #
      # Absent the secrets this is a no-op and the build stays ad-hoc signed,
      # exactly as before. That is the required behaviour, not a convenience:
      # a fork's CI cannot read secrets, so a hard failure here would mean
      # nobody but this repo could build the app at all.
      - name: Import the Developer ID certificate
        id: signing
        uses: ./.github/actions/import-developer-id
        with:
          certificate-p12: ${{ secrets.MACOS_CERT_P12 }}
          certificate-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}

      - name: Bundle freemkv.app
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: bash macos/bundle.sh release ${{ matrix.target }}

      # The .dmg only. The .zip and the checksums are built AFTER stapling —
      # a zip made here would carry an un-stapled .app, and its hash would not
      # match the file that actually ships.
      - name: Package the disk image
        run: |
          hdiutil create -volname "freemkv" -srcfolder target/freemkv.app \
            -ov -format UDZO "${{ matrix.asset }}.dmg"

      # ── Notarization ──────────────────────────────────────────────────────
      #
      # Apple scans the upload and issues a ticket; stapling attaches that
      # ticket to the file so Gatekeeper accepts it with NO network. Skipping
      # the staple is the subtle failure: it passes every test on a connected
      # machine and refuses to launch on an offline one.
      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          A="${{ matrix.asset }}"
          # --wait blocks until Apple returns a verdict; without it the job
          # would "succeed" having only queued the submission.
          if ! xcrun notarytool submit "$A.dmg" \
                 --key "$RUNNER_TEMP/notary.p8" \
                 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
                 --wait --timeout 30m; then
            echo "::error::notarization was rejected — fetching the log"
            xcrun notarytool log "$(xcrun notarytool history \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" --output-format json \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["history"][0]["id"])')" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
            rm -f "$RUNNER_TEMP/notary.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$A.dmg"
          # Staple the .app as well, so the .zip built next carries the ticket
          # too. A ticket cannot be attached to a bare binary or to a .zip.
          xcrun stapler staple target/freemkv.app

      - name: Finalize artifacts
        run: |
          set -euo pipefail
          VER="${{ github.ref_name }}"
          A="${{ matrix.asset }}"
          # Built from the (now stapled) .app. The .zip is for scripted
          # installs — brew casks, MDM — that would rather not mount a .dmg.
          ditto -c -k --keepParent target/freemkv.app "$A.zip"
          # Versioned copies, mirroring the CLI's versioned/unversioned pair.
          cp "$A.dmg" "freemkv-$VER-${{ matrix.target }}.dmg"
          cp "$A.zip" "freemkv-$VER-${{ matrix.target }}.zip"
          shasum -a 256 \
            "$A.dmg" "$A.zip" \
            "freemkv-$VER-${{ matrix.target }}.dmg" \
            "freemkv-$VER-${{ matrix.target }}.zip" \
            > "$A.dmg.sha256"

      - name: Verify the bundle
        run: |
          BIN=target/freemkv.app/Contents/MacOS/freemkv
          # A .dmg built for the wrong arch is indistinguishable from the right
          # one until a user double-clicks it, so pin the arch here.
          case "${{ matrix.target }}" in
            aarch64-*) WANT=arm64 ;;
            x86_64-*)  WANT=x86_64 ;;
          esac
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -qw "$WANT" \
            || { echo "::error::expected $WANT in $(lipo -archs "$BIN")"; exit 1; }
          # An .app that fails signature validation is one Gatekeeper refuses
          # to open, which users report as "the app is damaged".
          codesign --verify --deep --strict --verbose=2 target/freemkv.app

          # When signed for real, prove the thing users actually download would
          # pass Gatekeeper. codesign only says the signature is well-formed --
          # it says nothing about WHO signed it or whether Apple has seen it,
          # so an ad-hoc bundle passes the check above and is still refused on
          # every other Mac. These two are the checks that would have caught
          # that: spctl evaluates the policy, stapler proves the ticket is
          # attached and therefore works offline.
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            spctl -a -vvv -t install "${{ matrix.asset }}.dmg"
            xcrun stapler validate "${{ matrix.asset }}.dmg"
            codesign -dv --verbose=4 target/freemkv.app 2>&1 | grep -q "Authority=Developer ID Application" \
              || { echo "::error::bundle is not signed by a Developer ID authority"; exit 1; }
          else
            echo "ad-hoc build — skipping Gatekeeper checks (they would fail by design)"
          fi

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset }}.dmg
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.dmg.sha256
            freemkv-*-${{ matrix.target }}.dmg
            freemkv-*-${{ matrix.target }}.zip

  # ── Windows desktop app ─────────────────────────────────────────────────────
  # The peer of the macOS `build` job above. Windows has no bundle format, so
  # the shippable unit is a .zip holding the single `freemkv.exe` — the same
  # binary that serves the CLI (`main.rs` routes `freemkv gui` to the desktop
  # shell), exactly as the macOS .app wraps the same binary. That is why there
  # is no separate GUI cargo target or feature to select: the desktop shell is
  # `#[cfg(target_os = "windows")]`-gated inside the one `freemkv` bin.
  #
  # This job is deliberately SEPARATE from `cli-binaries` even though both
  # compile the same target: the CLI leg's product is the bare, runnable
  # `.exe` asset, and this leg's product is the desktop-app `.zip` (plus, in
  # future, an icon/manifest/installer, which must not leak into the CLI
  # asset). Keeping them apart means the download page's two sections point at
  # two independently-named assets, and neither can silently become the other.
  #
  # Asset names (mirroring the macOS leg's unversioned + versioned pair):
  #   freemkv-x86_64-windows.zip                    ← linked from the site
  #   freemkv-<tag>-x86_64-pc-windows-msvc.zip
  #   freemkv-x86_64-windows.zip.sha256
  # No collision with the CLI leg, which owns `freemkv-x86_64-windows.exe*`.
  build-windows:
    # Same rationale as `build`: does NOT `needs: test` (parallel tripwire).
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # Single leg today. aarch64-pc-windows-msvc is not shipped: there is no
        # ARM64 Windows runner in the hosted pool, and x64 runs under emulation
        # on ARM Windows. Add a leg here when that changes.
        include:
          - target: x86_64-pc-windows-msvc
            asset: freemkv-x86_64-windows

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-app

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $a   = "${{ matrix.asset }}"
          $bin = "target/${{ matrix.target }}/release/freemkv.exe"
          # The .zip is the DESKTOP APP, mirroring macOS where the .dmg carries
          # the app and the bare binary is the CLI. Here the app is
          # `freemkv-gui.exe` and the CLI ships as its own `freemkv.exe` asset.
          #
          # Windows has no .app bundle, so "this is the desktop app" cannot be a
          # property of how an image was started — an Explorer double-click and a
          # `cmd` invocation look identical to the process. It has to be which
          # image was started. `freemkv.exe` is linked console-subsystem, so
          # double-clicking it opens a console, prints usage and exits; and the
          # subsystem is a PE header field fixed at link time, not something a
          # runtime branch can change. `freemkv-gui.exe` is the windows-subsystem
          # image built from the same crate and the same shell code.
          #
          # `cargo build --release` already produced it; only this step decided
          # whether a user could ever get it. Shipping the console binary as the
          # "app" is why the download page's Windows card said "in development"
          # while a working shell sat unshipped.
          $gui = "target/${{ matrix.target }}/release/freemkv-gui.exe"
          if (-not (Test-Path $gui)) { throw "freemkv-gui.exe missing — the .zip would ship the console CLI as the desktop app" }
          # Unversioned .zip is the stable URL the download page links via
          # `releases/latest/download/<asset>`; the versioned copy mirrors the
          # macOS leg so a specific release can be pinned.
          Compress-Archive -Path $gui -DestinationPath "$a.zip" -Force
          Compress-Archive -Path $gui -DestinationPath "freemkv-$ver-${{ matrix.target }}.zip" -Force
          $h = Get-FileHash -Algorithm SHA256 "$a.zip"
          "$($h.Hash.ToLower())  $a.zip" | Out-File -Encoding ascii "$a.zip.sha256"

      - name: Verify the binary
        shell: pwsh
        run: |
          # A .zip whose .exe cannot start is indistinguishable from a good one
          # until a user double-clicks it — so actually run it. `--version` is
          # the cheapest path that exercises process start + the linked
          # libfreemkv, and it needs no disc.
          $out = & "target/${{ matrix.target }}/release/freemkv.exe" --version
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::freemkv.exe --version exited $LASTEXITCODE"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($out)) {
            Write-Output "::error::freemkv.exe --version printed nothing"
            exit 1
          }
          Write-Output "freemkv.exe --version => $out"
          # The .zip is the DESKTOP APP, so it must contain the windowed image
          # and NOT the console one. Shipping freemkv.exe here is the specific
          # regression this guards: it extracts and double-clicks to a console
          # that prints usage and closes, which reads to a user as a broken
          # download rather than as "you got the CLI by mistake".
          $zip = (Resolve-Path "${{ matrix.asset }}.zip").Path
          $names = [IO.Compression.ZipFile]::OpenRead($zip).Entries.FullName
          Write-Output "zip contents: $($names -join ', ')"
          if ($names -notcontains 'freemkv-gui.exe') {
            Write-Output "::error::freemkv-gui.exe missing from ${{ matrix.asset }}.zip — that archive is the desktop app"
            exit 1
          }
          if ($names -contains 'freemkv.exe') {
            Write-Output "::error::${{ matrix.asset }}.zip contains the console freemkv.exe; the CLI ships as its own .exe asset"
            exit 1
          }

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256
            freemkv-*-${{ matrix.target }}.zip

  # ── Standalone CLI binaries for the platforms without a desktop app ─────────
  # The GUI is target-gated off on Linux, so that leg is pure CLI. Linux ships
  # musl-static (no glibc version coupling). The Windows and macOS legs here are
  # the BARE binary for scripted installs — the windowed product ships from
  # `build-windows` (.zip) and `build` (.dmg) respectively.
  cli-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: freemkv-x86_64-linux
            ext: ''
          # arm64 Linux. Dropped by accident in the 1.6.0 workflow unification
          # and caught before the tag: the asset exists at v1.5.2 and is served
          # from the stable `releases/latest/download/` URL, so losing it would
          # 404 every bookmark, script and Dockerfile pinned to that path — and
          # silently, because no download button links it. autorip never stopped
          # shipping its arm64 leg, so the two would also have disagreed.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: freemkv-aarch64-linux
            ext: ''
          # Bare macOS CLI binaries (the .dmg already bundles the CLI; these are
          # for scripted installs / brew formulae that want just the binary).
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: freemkv-aarch64-macos
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: freemkv-x86_64-macos
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: freemkv-x86_64-windows
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # arm64 musl cross-builds through `cross` (a container with the right
      # sysroot), which is how this leg was built up to v1.5.2. A plain
      # `cargo build --target` on an x86 runner cannot link it: mimalloc-sys
      # and ring both compile C.
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          curl -sL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv cross /usr/local/bin/
      - name: Build CLI
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build CLI (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}
      # The bare macOS CLI binaries need signing and notarizing too. They are
      # downloaded directly, so they are quarantined exactly like the .app --
      # and unsigned, they produce the same "Apple could not verify" refusal
      # that the .dmg was fixed for. Shipping a signed app beside an unsigned
      # CLI just moves the complaint.
      - name: Import the Developer ID certificate
        id: signing
        if: runner.os == 'macOS'
        uses: ./.github/actions/import-developer-id
        with:
          certificate-p12: ${{ secrets.MACOS_CERT_P12 }}
          certificate-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}

      - name: Sign and notarize the macOS CLI
        if: runner.os == 'macOS' && steps.signing.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/freemkv"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          # notarytool only accepts .zip, .dmg and .pkg -- never a bare Mach-O.
          # Zip it, notarize that, and the binary inside is what gets the
          # verdict. The ticket CANNOT be stapled to a bare binary, so first
          # run still needs Apple to be reachable; the .dmg from the build job
          # is the fully offline-verifiable artifact. Documented on the
          # download page rather than left for a user to discover.
          ditto -c -k "$BIN" "$RUNNER_TEMP/notarize-cli.zip"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$RUNNER_TEMP/notarize-cli.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize-cli.zip"
          codesign -dv --verbose=4 "$BIN" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::CLI is not signed by a Developer ID authority"; exit 1; }

      - name: Package
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          A="${{ matrix.asset }}"
          E="${{ matrix.ext }}"
          BIN="target/${{ matrix.target }}/release/freemkv$E"
          cp "$BIN" "$A$E"
          cp "$BIN" "$A-$VER$E"
          # Hash AFTER signing: a signature rewrites the binary, so a checksum
          # taken before it would not match what ships.
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "$A$E" "$A-$VER$E" > "$A$E.sha256"
          else
            sha256sum "$A$E" "$A-$VER$E" > "$A$E.sha256"
          fi
      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset }}${{ matrix.ext }}
            ${{ matrix.asset }}-*${{ matrix.ext }}
            ${{ matrix.asset }}${{ matrix.ext }}.sha256

  # ── Homebrew tap ────────────────────────────────────────────────────────
  #
  # brew is the install path with no friction on macOS: Homebrew fetches with
  # curl, which never sets com.apple.quarantine, so nothing has to be allowed
  # through System Settings the way a browser download does. That only holds if
  # the tap actually points at this release, so it is updated here rather than
  # by hand -- a tap left behind is a tap that installs the previous version
  # while the download page advertises this one.
  #
  # Runs after every artifact job: update.sh reads the checksums from the
  # published assets, so they all have to exist first.
  update-homebrew-tap:
    needs: [build, build-windows, cli-binaries]
    if: always() && needs.build.result == 'success' && needs['cli-binaries'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update the tap to this release
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          VER: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || {
            echo "::warning::ORG_DISPATCH_TOKEN is not set — the Homebrew tap was NOT updated"
            echo "::warning::brew install will keep serving the previous release until it is"
            exit 0
          }
          git clone --depth 1 \
            "https://x-access-token:$GH_TOKEN@github.com/freemkv/homebrew-tap.git" tap
          cd tap
          ./update.sh "${VER#v}"
          if git diff --quiet; then
            echo "tap already at ${VER#v} — nothing to do"
            exit 0
          fi
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git commit -aqm "freemkv ${VER#v}"
          git push
          echo "tap updated to ${VER#v}" >> "$GITHUB_STEP_SUMMARY"

  update-homepage:
    needs: [build, build-windows, cli-binaries]
    # Gated on the desktop apps only (macOS + Windows): the org README advertises
    # the release, and a release with no shippable app is not one to advertise.
    # `always()` + explicit result checks so a failed CLI leg does not silently
    # skip the dispatch, and a failed app leg definitively does.
    # NOTE: bracket form for `build-windows` — a hyphen in a job id is parsed as
    # subtraction in the dot form, so `needs.build-windows.result` is invalid.
    if: always() && needs.build.result == 'success' && needs['build-windows'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update org README with new version
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}
          repository: freemkv/.github
          event-type: new-release
          client-payload: '{"version": "${{ github.ref_name }}"}'
