name: promote

# dev → qa, for all eight repos, as one action.
#
# This replaces `promote.sh`. The script's guarantees are kept exactly; only the
# place it runs changes, so nobody has to remember to run it from a checkout
# with all eight repos side by side.
#
# WHY LOCKSTEP
# Every repo's `qa.yml` resolves its SIBLINGS at `qa`. Promote half the set and
# the qa runs still go green — against a combination of trees that will never
# be released. That is worse than a red run, because it looks like evidence.
# So: refuse unless the whole set is ready, then push all eight in dependency
# order, so a dependency is always advanced before the repos that resolve it.
#
# WHY THE BOT-WORKFLOW EXCLUSION
# `Dependabot Updates` runs against dev's own SHA and fails, permanently, on
# every repo carrying a local path override (`../freemkv-unlock`) — it cannot
# resolve a path outside the repo. Counting it meant promotion was blocked by a
# job that can never pass while dev looks the way we deliberately make it look.
# It tests whether a bot can open a PR, not whether the code is releasable.
# Kept as a deny-list, not an allow-list of {CI, leak-guard}: a NEW gating
# workflow must not be ignored just because this file has not heard of it.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check everything, push nothing
        type: boolean
        default: true

permissions:
  contents: read

# Two promote runs must never race their qa PATCH/POST pushes.
concurrency:
  group: promote
  cancel-in-progress: false

env:
  # Dependency order — freemkv-unlock is the BASE (libfreemkv and bdemu depend
  # on it), then the libs, then the binaries. Mirrors release.sh's tag cascade
  # so the two cannot disagree about what "in order" means.
  REPOS: >-
    freemkv-unlock libfreemkv freemkv-keysources freemkv-i18n
    freemkv-engine bdemu freemkv autorip
  # Exclude the orchestration/bot workflows from the green-gate: a repo's own
  # promote/release/runner runs (and their dry-runs) must not gate the NEXT
  # promote — otherwise a failed promote dry-run on a dev SHA blocks promotion of
  # that same SHA. Mirrors release-orchestrate's NON_GATING.
  #
  # Scorecard is here for a different reason: it reports security posture to the
  # OpenSSF API and builds nothing, so it cannot tell us whether the code is
  # releasable. It is also externally broken — the action runs out of
  # gcr.io/openssf/scorecard-action, whose Google project has billing disabled,
  # so every run fails on `docker pull` regardless of the commit. Gating on it
  # would block every release on someone else's billing page.
  NON_GATING: '^(Dependabot Updates|CodeQL|Scorecard|pages-build-deployment|promote|release-orchestrate|Release|ci-runner-launch|ci-runner-sweeper)$'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # Private-info gate: the org-specific scanner lives in the private
      # freemkv-ci repo; its output here is redacted to category + file:line.
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-ci
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}
          path: ci
      - name: Refuse if any public repo's dev carries private info
        run: bash ci/scripts/scan-public.sh dev $REPOS .github homebrew-tap
      - name: Check every repo's dev is green and qa can fast-forward
        id: check
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail
          fail=0
          : > /tmp/shas
          : > /tmp/versions
          for r in $REPOS; do
            dev=$(gh api "repos/freemkv/$r/git/ref/heads/dev" -q .object.sha 2>/dev/null || echo "")
            if [ -z "$dev" ]; then echo "::error::$r: no dev branch"; fail=1; continue; fi

            # UNIFIED-VERSION PARITY: all eight ship the SAME version. Capture the
            # root Cargo.toml version at dev's SHA now, for every repo (even a
            # red one, so the parity error still names it), and cross-check after
            # the loop. release-orchestrate re-bumps all eight to its `version`
            # input at release time, so a drift here never reaches a tag — but it
            # makes qa a combination that will never ship (siblings resolve at qa),
            # so a green qa on mixed versions is misleading evidence. Catch it here.
            # NB: this job runs under `bash -e`. Keep the fetch out of a pipe that
            # an early-exiting reader could SIGPIPE (a `... | base64 -d | grep -m1`
            # aborted the whole step, nondeterministically). Fetch into a var
            # (|| tolerate failure), then parse with a here-string — no pipe.
            raw=$(gh api "repos/freemkv/$r/contents/Cargo.toml?ref=$dev" -q .content 2>/dev/null | base64 -d 2>/dev/null) || raw=""
            ver=$(awk -F'"' '/^version *=/{print $2; exit}' <<<"$raw")
            if [ -z "$ver" ]; then echo "::error::$r: could not read Cargo.toml version at dev ${dev:0:7}"; fail=1; else echo "$r $ver" >> /tmp/versions; fi

            qa=$(gh api "repos/freemkv/$r/git/ref/heads/qa" -q .object.sha 2>/dev/null || echo "")

            if [ "$dev" = "$qa" ]; then
              echo "  = $r: already promoted (${dev:0:7})"
              echo "$r $dev already" >> /tmp/shas
              continue
            fi

            # qa must be an ANCESTOR of dev. If it is not, someone committed
            # straight to qa and a push would discard it — stop rather than
            # force anything.
            if [ -n "$qa" ]; then
              cmp=$(gh api "repos/freemkv/$r/compare/$qa...$dev" -q .status 2>/dev/null || echo "unknown")
              case "$cmp" in
                ahead|identical) ;;
                *) echo "::error::$r: qa is '$cmp' relative to dev — not a fast-forward, refusing"; fail=1; continue ;;
              esac
            fi

            # main COHERENCE — catch out-of-band commits on main HERE, pre-qa, not
            # at release-time. main is a pure release pointer; it must contain
            # nothing that dev does not (else the release's qa→main advance
            # diverges AFTER all 8 tags are public — the 1.6.12 failure). If main
            # carries commits dev lacks (a README web-UI edit, a hand hotfix),
            # refuse and name the reconcile: cherry-pick them into dev, then
            # re-promote, so qa→main stays a clean push.
            main=$(gh api "repos/freemkv/$r/git/ref/heads/main" -q .object.sha 2>/dev/null || echo "")
            if [ -n "$main" ] && [ "$main" != "$dev" ]; then
              mcmp=$(gh api "repos/freemkv/$r/compare/$dev...$main" -q .status 2>/dev/null || echo "unknown")
              case "$mcmp" in
                behind|identical) ;;   # main ⊆ dev — clean
                *) echo "::error::$r: main is '$mcmp' vs dev — main carries commit(s) not in dev (out-of-band edit). Bring them back: git -C $r cherry-pick <sha> onto dev, push, then re-promote."; fail=1; continue ;;
              esac
            fi

            runs=$(gh api "repos/freemkv/$r/actions/runs?head_sha=$dev&per_page=100" \
                     -q '[.workflow_runs[] | {name, status, conclusion}]')
            gating=$(echo "$runs" | jq --arg re "$NON_GATING" '[.[] | select(.name | test($re) | not)]')

            if [ "$(echo "$gating" | jq 'length')" = "0" ]; then
              echo "::error::$r: no CI run found for dev ${dev:0:7}"; fail=1; continue
            fi
            if [ "$(echo "$gating" | jq '[.[] | select(.status != "completed")] | length')" != "0" ]; then
              echo "::error::$r: CI still running for dev ${dev:0:7}"; fail=1; continue
            fi
            bad=$(echo "$gating" | jq -r '[.[] | select(.conclusion != "success" and .conclusion != "skipped") | .name] | unique | join(", ")')
            if [ -n "$bad" ]; then
              echo "::error::$r: dev ${dev:0:7} is not green ($bad)"; fail=1; continue
            fi

            echo "  ✓ $r: dev ${dev:0:7} green, ready"
            echo "$r $dev ready" >> /tmp/shas
          done
          # Cross-check the captured versions: every repo must be at the SAME
          # version. Distinct values => drift; name every repo and its version so
          # the fix is a one-line bump per outlier, then re-promote.
          distinct=$(awk '{print $2}' /tmp/versions | sort -u | wc -l | tr -d ' ')
          if [ "$distinct" -gt 1 ]; then
            echo "::error::version drift across the unified set — all eight must match. Bump the outliers to the target version, then re-promote:"
            sort -k2 /tmp/versions | awk '{printf "    %-20s %s\n", $1, $2}'
            fail=1
          fi

          [ "$fail" = "0" ] || { echo "::error::refusing to promote — fix the above first"; exit 1; }

      - name: Promote dev → qa, in dependency order
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          while read -r r sha state; do
            [ "$state" = "ready" ] || { echo "  = $r: already at ${sha:0:7}"; continue; }
            printf '  → %-20s ' "$r"
            # Create the ref if qa does not exist yet, otherwise fast-forward.
            if gh api "repos/freemkv/$r/git/ref/heads/qa" >/dev/null 2>&1; then
              gh api -X PATCH "repos/freemkv/$r/git/refs/heads/qa" -f sha="$sha" -F force=false -q .object.sha
            else
              gh api -X POST "repos/freemkv/$r/git/refs" -f ref=refs/heads/qa -f sha="$sha" -q .object.sha
            fi
          done < /tmp/shas
          echo "promoted. qa CI is running — the heaviest leg (full-size media) runs last, behind everything else."

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true — every check above passed; pushed nothing."
